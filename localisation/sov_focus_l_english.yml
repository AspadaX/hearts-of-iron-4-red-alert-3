l_english:

SOV_red_army_triumphant:0 "The Red Army Triumphant"
SOV_red_army_triumphant_desc:0 "The Red Army stands victorious over Europe. Its prestige is immense, but its supply lines and command structure are stretched across a continent."
SOV_continent_under_occupation:0 "A Continent Under Occupation"
SOV_continent_under_occupation_desc:0 "Europe and Scandinavia are held by Soviet occupation zones. Their industries feed the Union, but their peoples remain restless and expensive to control."
SOV_red_fleet_deficiencies:0 "The Red Fleet's Deficiencies"
SOV_red_fleet_deficiencies_desc:0 "The Soviet Navy remains a coastal force. Its dockyards, coordination and operational experience lag far behind the other great powers."
SOV_fractured_supreme_command:0 "Fractured Supreme Command"
SOV_fractured_supreme_command_desc:0 "The Politburo, the General Staff and the occupation authorities disagree over the future of the Union. Orders from Moscow arrive late and often contradict one another."
SOV_industrial_colossus:0 "Soviet Industrial Colossus"
SOV_industrial_colossus_desc:0 "The planned economy has built a vast industrial base. It is inefficient in places, but it can outproduce almost any rival once mobilised."

SOV_premier_authority:0 "The Premier's Authority"
SOV_premier_authority_desc:0 "Cherdenko has outmanoeuvred his rivals and restored a single line of authority from the Kremlin to the occupation zones."
SOV_party_unity:0 "Party Unity"
SOV_party_unity_desc:0 "The Central Committee has closed ranks behind the Premier. Ideological discipline is strengthening across the state."
SOV_general_secretary:0 "The General Secretary"
SOV_general_secretary_desc:0 "Krukov has fused military command and party leadership. The Red Army now answers directly to the General Secretary."
SOV_revolutionary_command:0 "Revolutionary Command"
SOV_revolutionary_command_desc:0 "The Commander and Dasha have rebuilt the leadership around revolutionary legitimacy rather than personal dictatorship."
SOV_dasha_adviser:0 "Dasha Fedorovich"
SOV_dasha_adviser_desc:0 "Dasha Fedorovich coordinates the Commander's intelligence service, screens the officer corps for loyalists, and keeps the revolutionary coalition united."
SOV_direct_rule_europe:0 "Direct Rule in Europe"
SOV_direct_rule_europe_desc:0 "The European occupation zone is administered directly from Moscow. Local autonomy is a memory."
SOV_direct_rule_scandinavia:0 "Direct Rule in Scandinavia"
SOV_direct_rule_scandinavia_desc:0 "The northern occupation zone is governed by Soviet commissars and garrison commanders."
SOV_imperial_administration:0 "The Soviet Imperial Administration"
SOV_imperial_administration_desc:0 "A permanent civil service now links Moscow to every occupied province. Resistance is monitored, taxed and suppressed."
SOV_european_security_bloc:0 "The European Security Bloc"
SOV_european_security_bloc_desc:0 "The European client republics coordinate their armies and economies under Soviet direction."
SOV_northern_security_bloc:0 "The Northern Security Bloc"
SOV_northern_security_bloc_desc:0 "The Scandinavian client states provide bases, resources and manpower for the Union."
SOV_soviet_security_bloc:0 "The Soviet Security Bloc"
SOV_soviet_security_bloc_desc:0 "A federation of client states surrounds the Soviet Union. Their autonomy is limited, but their combined weight is enormous."
SOV_krukov_legacy:0 "Krukov's Legacy"
SOV_krukov_legacy_desc:0 "The General Secretary has turned the Soviet sphere into a disciplined military bloc prepared for the next war."
SOV_liberation_doctrine:0 "Liberation Doctrine"
SOV_liberation_doctrine_desc:0 "The Union presents itself as a liberator rather than an occupier. Communist parties across Europe look to Moscow for leadership."
SOV_internationalist_union:0 "The Internationalist Union"
SOV_internationalist_union_desc:0 "The Union has become the centre of a voluntary communist international. Its member republics share a common cause."
SOV_cherdenko_legacy:0 "Cherdenko's Legacy"
SOV_cherdenko_legacy_desc:0 "The Premier has bound Europe to Moscow through a mixture of patronage, repression and political theatre."
SOV_world_revolution:0 "World Revolution"
SOV_world_revolution_desc:0 "The Soviet Union has committed itself to the global triumph of communism, whatever the cost."
SOV_baltic_fleet:0 "The Baltic Fleet"
SOV_baltic_fleet_desc:0 "The Baltic Fleet has been reinforced and given priority access to new ships and naval doctrine."

SOV_socialist_economy:0 "Socialist Reconstruction"
SOV_socialist_economy_desc:0 "Consumer production and civilian industry are being rebuilt alongside heavy industry. The population is offered a visible peace dividend."
SOV_war_economy:0 "Centralized War Economy"
SOV_war_economy_desc:0 "Every factory is harnessed to military production. Consumer goods are sacrificed for tanks, aircraft and munitions."
SOV_tesla_program:0 "Tesla Technology"
SOV_tesla_program_desc:0 "A secret research programme explores electromagnetic weapons, defensive fields and other technologies from the old war."
SOV_iron_curtain_defenses:0 "The Iron Curtain"
SOV_iron_curtain_defenses_desc:0 "A layered network of air defences, listening posts and internal security measures seals the Soviet sphere from foreign influence."
SOV_vacuum_imploder_program:0 "The Vacuum Imploder"
SOV_vacuum_imploder_program_desc:0 "Soviet scientists are developing a devastating new weapon capable of collapsing enemy positions from within."
SOV_occupation_ministry:0 "The Occupation Ministry"
SOV_occupation_ministry_desc:0 "A dedicated ministry manages the occupied territories, balancing extraction, garrison costs and political control."
SOV_european_garrison_network:0 "European Garrison Network"
SOV_european_garrison_network_desc:0 "Soviet troops and local auxiliaries are distributed across Europe to protect key industrial and transport centres."
SOV_northern_garrison_network:0 "Northern Garrison Network"
SOV_northern_garrison_network_desc:0 "Winter-trained garrisons guard Scandinavia and its approaches to the Soviet north."
SOV_internal_security:0 "Internal Security"
SOV_internal_security_desc:0 "The security services have infiltrated occupation administrations and party organisations. Dissent is detected before it spreads."
SOV_imperial_integration:0 "Imperial Integration"
SOV_imperial_integration_desc:0 "The occupation zones are being integrated into Soviet economic and administrative structures."
SOV_red_navy_rebuilt:0 "The Red Navy Rebuilt"
SOV_red_navy_rebuilt_desc:0 "New dockyards, modern doctrine and experienced crews have transformed the Soviet Navy into a serious force."
SOV_modern_red_army:0 "The Modern Red Army"
SOV_modern_red_army_desc:0 "The Red Army has been reorganised around mechanised formations, modern artillery and flexible command."
SOV_red_air_doctrine:0 "The Red Air Force"
SOV_red_air_doctrine_desc:0 "Soviet aviation has moved beyond massed frontal attacks toward coordinated air superiority operations."
SOV_deep_battle:0 "Deep Battle"
SOV_deep_battle_desc:0 "Soviet commanders have perfected the doctrine of deep operations: breakthrough, exploitation and the destruction of enemy reserves."
SOV_rocket_command:0 "Rocket Command"
SOV_rocket_command_desc:0 "Dedicated rocket formations give the Red Army long-range striking power."
SOV_nuclear_program:0 "The Nuclear Programme"
SOV_nuclear_program_desc:0 "The Soviet atomic programme has been expanded, bringing the Union closer to a new strategic deterrent."
SOV_comintern_direction:0 "Comintern Direction"
SOV_comintern_direction_desc:0 "The Comintern coordinates communist parties, client states and revolutionary movements around the world."
SOV_anti_colonial:0 "Anti-Colonial Struggle"
SOV_anti_colonial_desc:0 "Moscow supports national liberation movements against the old colonial empires."
SOV_eastern_outreach:0 "Eastern Outreach"
SOV_eastern_outreach_desc:0 "The Union is cultivating trade and political influence across Asia and the Middle East."
SOV_global_revolutionary_line:0 "The Global Revolutionary Line"
SOV_global_revolutionary_line_desc:0 "The Soviet Union has adopted an openly revolutionary foreign policy. Every crisis is an opportunity."

SOV_the_red_continent:0 "The Red Continent"
SOV_the_red_continent_desc:0 "The Soviet Union stands astride Europe. The first task is to secure the gains of the last war and turn them into a lasting order."
SOV_the_burden_of_victory:0 "The Burden of Victory"
SOV_the_burden_of_victory_desc:0 "Victory has brought occupation, resistance and administrative chaos. The Kremlin must decide how to govern what it has won."
SOV_the_kremlin_divided:0 "The Kremlin Divided"
SOV_the_kremlin_divided_desc:0 "Cherdenko, Krukov and the young Commander represent three different visions of the Union's future. The Politburo cannot postpone the choice forever."
SOV_the_future_of_the_union:0 "The Future of the Union"
SOV_the_future_of_the_union_desc:0 "The succession debate has reached its conclusion. The next course will define the Soviet Union for a generation."
SOV_cherdenko_directive:0 "The Cherdenko Directive"
SOV_cherdenko_directive_desc:0 "Cherdenko will preserve the Union as a centralized empire, ruled from Moscow and defended by a loyal party apparatus."
SOV_krukov_directive:0 "The Krukov Directive"
SOV_krukov_directive_desc:0 "Krukov will reorganize the Soviet sphere into a disciplined network of client states under military leadership."
SOV_commander_directive:0 "The Commander's Directive"
SOV_commander_directive_desc:0 "The Commander and Dasha will transform the occupation zones into independent communist republics allied to Moscow."
SOV_secure_the_party:0 "Secure the Party"
SOV_secure_the_party_desc:0 "The Premier purges wavering officials and promotes loyal cadres. The party machine is brought firmly under control."
SOV_direct_rule_in_europe:0 "Direct Rule in Europe"
SOV_direct_rule_in_europe_desc:0 "The European occupation zone is placed under direct Soviet administration, with commissars replacing local councils."
SOV_exploit_european_industry:0 "Exploit European Industry"
SOV_exploit_european_industry_desc:0 "European factories and resources are integrated into the Soviet war economy."
SOV_northern_directive:0 "The Northern Directive"
SOV_northern_directive_desc:0 "Scandinavia is placed under direct Soviet control, securing the northern approaches and the Baltic Sea."
SOV_secure_baltic:0 "Secure the Baltic"
SOV_secure_baltic_desc:0 "The Baltic Fleet is expanded and the northern coast is fortified against any future challenge."
SOV_an_indivisible_empire:0 "An Indivisible Empire"
SOV_an_indivisible_empire_desc:0 "Moscow's authority now runs unbroken from the Baltic to the Balkans. The Union has become an empire in all but name."
SOV_cherdenko_red_century:0 "A Red Century"
SOV_cherdenko_red_century_desc:0 "Cherdenko's centralized order is complete. The Soviet Union enters the new century as the undisputed master of Europe."
SOV_reorganize_europe:0 "Reorganize Europe"
SOV_reorganize_europe_desc:0 "The European occupation zone is broken into client republics, each tied to Moscow by treaty and garrison."
SOV_european_client_republics:0 "European Client Republics"
SOV_european_client_republics_desc:0 "The new European governments coordinate their defence and production with the Soviet Union."
SOV_reorganize_scandinavia:0 "Reorganize Scandinavia"
SOV_reorganize_scandinavia_desc:0 "Scandinavia is divided into client states under Soviet protection."
SOV_northern_client_republics:0 "Northern Client Republics"
SOV_northern_client_republics_desc:0 "The northern client states provide forward bases and secure the approaches to the Soviet Union."
SOV_a_federation_of_puppets:0 "A Federation of Puppets"
SOV_a_federation_of_puppets_desc:0 "Krukov's client states form a single security bloc, directed from Moscow but governed by local administrations."
SOV_krukov_peace_through_strength:0 "Peace Through Strength"
SOV_krukov_peace_through_strength_desc:0 "The General Secretary has built a military bloc capable of deterring any coalition. The Soviet sphere is stable, armed and obedient."
SOV_rights_of_republics:0 "Rights of Republics"
SOV_rights_of_republics_desc:0 "The Commander grants the occupied nations the right to form their own communist republics, free of direct Soviet rule."
SOV_liberation_of_europe:0 "Liberation of Europe"
SOV_liberation_of_europe_desc:0 "Soviet troops are presented as liberators. European communists are invited to build their own governments."
SOV_workers_of_every_nation:0 "Workers of Every Nation"
SOV_workers_of_every_nation_desc:0 "The new republics are invited into a voluntary alliance with the Soviet Union."
SOV_nordic_revolution:0 "Nordic Revolution"
SOV_nordic_revolution_desc:0 "Scandinavian communists take power in independent republics, ending the occupation without ending the alliance."
SOV_a_revolution_worth_defending:0 "A Revolution Worth Defending"
SOV_a_revolution_worth_defending_desc:0 "The new republics and the Soviet Union share a common revolutionary project. Their alliance is based on consent as well as power."
SOV_international_congress:0 "The International Congress"
SOV_international_congress_desc:0 "Communist delegates from across Europe gather in Moscow to coordinate the next stage of the world revolution."
SOV_export_the_revolution:0 "Export the Revolution"
SOV_export_the_revolution_desc:0 "The Soviet Union commits itself to spreading communism beyond its immediate sphere, by persuasion where possible and by force where necessary."
SOV_socialist_reconstruction:0 "Socialist Reconstruction"
SOV_socialist_reconstruction_desc:0 "The Union turns from permanent mobilisation toward rebuilding its cities, farms and consumer industries."
SOV_centralized_war_economy:0 "Centralized War Economy"
SOV_centralized_war_economy_desc:0 "The entire Soviet economy is placed on a war footing, with priority given to heavy industry and the armed forces."
SOV_five_year_plan:0 "The Five Year Plan"
SOV_five_year_plan_desc:0 "A new five year plan sets ambitious targets for industrial growth and infrastructure."
SOV_arms_production_drive:0 "Arms Production Drive"
SOV_arms_production_drive_desc:0 "Factories are converted to military production and new armored formations are equipped."
SOV_tesla_technology:0 "Tesla Technology"
SOV_tesla_technology_desc:0 "Soviet research institutes begin work on electromagnetic weapons and defensive systems."
SOV_ural_industrial_belt:0 "The Ural Industrial Belt"
SOV_ural_industrial_belt_desc:0 "The industrial cities of the Urals are expanded into a secure rear base for Soviet industry."
SOV_iron_curtain:0 "The Iron Curtain"
SOV_iron_curtain_desc:0 "Air defences and security networks are built to seal the Soviet sphere from foreign penetration."
SOV_vacuum_imploder:0 "The Vacuum Imploder"
SOV_vacuum_imploder_desc:0 "The secret Vacuum Imploder project reaches its final stage."
SOV_occupation_administration:0 "Occupation Administration"
SOV_occupation_administration_desc:0 "A civil administration is established for the occupied territories, with clear chains of command and budgets."
SOV_european_garrison:0 "European Garrisons"
SOV_european_garrison_desc:0 "Additional troops are deployed to European cities, rail hubs and industrial centres."
SOV_northern_garrison:0 "Northern Garrisons"
SOV_northern_garrison_desc:0 "Reinforcements are sent to Scandinavia to secure the northern flank."
SOV_suppress_dissent:0 "Suppress Dissent"
SOV_suppress_dissent_desc:0 "The security services crack down on resistance networks and opposition groups across the occupation zones."
SOV_integrate_occupation:0 "Integrate the Occupation"
SOV_integrate_occupation_desc:0 "The occupation zones are formally integrated into the Soviet administrative and economic system."
SOV_rebuild_red_navy:0 "Rebuild the Red Navy"
SOV_rebuild_red_navy_desc:0 "New ships, dockyards and training programmes begin to erase the Soviet Navy's weaknesses."
SOV_modernize_red_army:0 "Modernize the Red Army"
SOV_modernize_red_army_desc:0 "The Red Army adopts modern equipment and reorganises its armored and mechanised formations."
SOV_red_air_force:0 "The Red Air Force"
SOV_red_air_force_desc:0 "Soviet aviation is expanded and its doctrine revised for modern air superiority operations."
SOV_deep_battle_doctrine:0 "Deep Battle Doctrine"
SOV_deep_battle_doctrine_desc:0 "Soviet theorists formalise deep battle: break the front, exploit the gap and destroy the enemy rear."
SOV_rocket_forces:0 "Rocket Forces"
SOV_rocket_forces_desc:0 "Dedicated rocket formations are created to strike targets far behind the front."
SOV_atomic_program:0 "The Atomic Programme"
SOV_atomic_program_desc:0 "The Soviet Union expands its nuclear research and begins planning for a strategic deterrent."
SOV_consolidate_comintern:0 "Consolidate the Comintern"
SOV_consolidate_comintern_desc:0 "The Comintern is reorganised into a disciplined instrument of Soviet foreign policy."
SOV_support_colonial_revolution:0 "Support Colonial Revolution"
SOV_support_colonial_revolution_desc:0 "Moscow begins supplying and training anti-colonial movements across Asia and Africa."
SOV_courting_the_east:0 "Courting the East"
SOV_courting_the_east_desc:0 "Soviet diplomats and traders expand their influence across Asia and the Middle East."
SOV_global_revolution:0 "The Global Revolution"
SOV_global_revolution_desc:0 "The Comintern adopts a global revolutionary strategy, committing the Soviet Union to support communist movements everywhere."

SOV_occupation_decisions:0 "Occupation Administration"
SOV_occupation_decisions_desc:0 "Manage the loyalty of the European and Scandinavian occupation zones. Loyalty improves with effective administration, garrisons and political concessions; neglect breeds unrest."
SOV_reinforce_european_garrison:0 "Reinforce the European Garrison"
SOV_reinforce_european_garrison_desc:0 "Deploy additional troops and military police to the European occupation zone. Costs 50 political power and takes 60 days."
SOV_reinforce_scandinavian_garrison:0 "Reinforce the Scandinavian Garrison"
SOV_reinforce_scandinavian_garrison_desc:0 "Deploy additional winter-trained troops to Scandinavia. Costs 50 political power and takes 60 days."
SOV_european_plebiscite:0 "Hold a European Plebiscite"
SOV_european_plebiscite_desc:0 "Organise a controlled plebiscite on the future of the European occupation zone. Requires loyalty above 50. Costs 75 political power and takes 90 days."
SOV_scandinavian_plebiscite:0 "Hold a Scandinavian Plebiscite"
SOV_scandinavian_plebiscite_desc:0 "Organise a controlled plebiscite in Scandinavia. Requires loyalty above 50. Costs 75 political power and takes 90 days."
SOV_crack_down_on_dissent:0 "Crack Down on Dissent"
SOV_crack_down_on_dissent_desc:0 "Use the security services to break resistance networks in both occupation zones. Costs 75 political power, reduces stability and takes 30 days."

sov.1.t:0 "The Burden of Victory"
sov.1.d:0 "The war is over, but the peace has not arrived. Soviet garrisons stretch from the Atlantic coast to the Arctic Circle. Every city requires administrators, every railway requires guards, and every factory requires coal that the Union does not have to spare.\n\nThe Kremlin must decide how much of Europe can be held, and at what cost."
sov.1.a:0 "The Union will bear this burden."
sov.2.t:0 "The Kremlin Divided"
sov.2.d:0 "The succession debate has begun. Premier Cherdenko speaks of order and central authority. General Krukov demands a disciplined military bloc. The young Commander and Dasha call for a new revolutionary settlement.\n\nNo faction is strong enough to impose its will without a political struggle."
sov.2.a:0 "The Politburo will decide."
sov.3.t:0 "The Premier's Course"
sov.3.d:0 "Cherdenko addresses the Central Committee. Europe will remain under direct Soviet administration, and the party will be the instrument of that rule. The applause is careful but unanimous."
sov.3.a:0 "The party is united."
sov.4.t:0 "The General's Course"
sov.4.d:0 "Krukov enters the Kremlin at the head of a military delegation. The occupation zones will become client states, their armies drilled by Soviet officers and their economies tied to Soviet needs.\n\nThe General Secretary salutes the assembled officers."
sov.4.a:0 "Peace through strength."
sov.5.t:0 "The Commander's Course"
sov.5.d:0 "The Commander and Dasha present a different vision. The occupied nations will become independent communist republics, free to govern themselves but allied to Moscow. The old guard is sceptical, but the streets are listening."
sov.5.a:0 "A revolution worth defending."
sov.10.t:0 "Unrest in Europe"
sov.10.d:0 "Resistance networks have spread through the European occupation zone. Sabotage is disrupting rail traffic, and local officials report that entire districts no longer obey Moscow. Loyalty stands at [?SOV_europe_loyalty|0]."
sov.10.a:0 "Deploy the garrisons."
sov.10.b:0 "Offer limited concessions."
sov.11.t:0 "Unrest in Scandinavia"
sov.11.d:0 "The northern occupation zone is growing restless. Winter supply convoys are being ambushed, and garrison commanders warn that local cooperation is collapsing. Loyalty stands at [?SOV_scandinavia_loyalty|0]."
sov.11.a:0 "Deploy the garrisons."
sov.11.b:0 "Offer limited concessions."
