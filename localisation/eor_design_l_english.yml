 EOR_seek_settlement_aoe_desc:0 "Spend 100 PP to request a non-aggression pact and a one-year truce. A legal request requires an independent target outside our faction without an existing settlement: either an enemy above 35% surrender progress, or a peaceful target weaker than the Empire while our government has neither capitulated nor entered civil war. Acceptance can still be refused, costing an additional 25 PP."
 EOR_subject_iot_pacific_naval_research:0 "Pacific Naval Research — IOT"
 EOR_subject_iot_pacific_naval_research_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Delivery requires the same recipient to remain an Imperial subject and retain ownership and control of the original project capital. If invalidated, no reward or refund is granted; the reservation expires on schedule."
