 EOR_seek_settlement_aoe_desc:0 "Spend 100 PP to seek a negotiated non-aggression settlement. The recipient may refuse. Acceptance requires either more than 35% surrender progress, or peace with a secure, technologically established Empire. War invalidates a settlement for victory purposes."
