 EOR_institute_funding:0 "Imperial Weaponry Institute Funding"
 EOR_institute_funding_desc:0 "Imperial Weaponry Institute Funding. Initial balance values; campaign balance requires testing."
 EOR_the_imperial_dawn:0 "The Imperial Dawn"
 EOR_the_imperial_dawn_desc:0 "A new century has brought the Empire to the edge of a struggle for the Pacific. Mobilize the government behind a common program and prepare the court to decide what the Rising Sun will become."
 EOR_the_divine_mandate:0 "The Divine Mandate"
 EOR_the_divine_mandate_desc:0 "Yoshiro's authority rests on the conviction that the dynasty embodies Japan's destiny. Reaffirm that bond before military setbacks and political rivals can turn public doubt into a crisis of legitimacy."
 EOR_the_imperial_court:0 "The Imperial Court"
 EOR_the_imperial_court_desc:0 "The Emperor cannot govern an empire of such vast ambitions alone. The Imperial Court must coordinate the military, government ministries, and industrial corporations to ensure that every institution serves the nation's objectives."
 EOR_council_of_shoguns:0 "Council of Shoguns"
 EOR_council_of_shoguns_desc:0 "The Imperial Armed Forces require unified strategic direction. The most capable commanders shall assemble to determine the Empire's military priorities and coordinate the coming war."
 EOR_the_crown_prince:0 "The Crown Prince"
 EOR_the_crown_prince_desc:0 "Tatsu believes that scientific achievement can secure the Empire's future. Give the crown prince a public platform and open a channel through which the government can support his technocratic allies."
 EOR_the_question_of_destiny:0 "The Question of Destiny"
 EOR_the_question_of_destiny_desc:0 "The crisis has exposed a division that ceremonial unity can no longer conceal. Decide whether the Empire will rest on divine authority, scientific rule, military power or the hidden promise of constitutional reform."
 EOR_reaffirm_the_divine_mandate:0 "Reaffirm the Divine Mandate"
 EOR_reaffirm_the_divine_mandate_desc:0 "The dynasty has survived because its authority stands above ordinary politics. Commit the government to Yoshiro's rule and restore confidence in the Emperor's claim to lead Japan."
 EOR_reinforce_the_shogunate:0 "Reinforce the Shogunate"
 EOR_reinforce_the_shogunate_desc:0 "The Shogunate must remain the unquestioned instrument of Imperial authority. Military officers and civilian administrators alike must demonstrate absolute loyalty to the Emperor."
 EOR_the_emperors_sacred_authority:0 "The Emperor's Sacred Authority"
 EOR_the_emperors_sacred_authority_desc:0 "The Emperor's authority is not merely political. It represents the spiritual unity of the Empire. By strengthening Imperial institutions, we shall ensure that no internal division can threaten our national purpose."
 EOR_warriors_of_the_rising_sun:0 "Warriors of the Rising Sun"
 EOR_warriors_of_the_rising_sun_desc:0 "The infantry program must become a coherent fighting tradition. Consolidate the training and equipment standards of the army's warrior formations."
 EOR_the_emperors_personal_guard:0 "The Emperor's Personal Guard"
 EOR_the_emperors_personal_guard_desc:0 "An elite force shall be established to safeguard the Imperial family and serve as the ultimate symbol of loyalty to the throne."
 EOR_the_eternal_empire:0 "The Eternal Empire"
 EOR_the_eternal_empire_desc:0 "The throne has survived its challenge and chosen a lasting military direction. Consolidate Yoshiro's settlement into a state built around Imperial continuity and disciplined national service."
 EOR_the_crown_prince_speaks:0 "The Crown Prince Speaks"
 EOR_the_crown_prince_speaks_desc:0 "Crown Prince Tatsu has challenged the traditional interpretation of Imperial destiny. The Empire's victories have been achieved not through divine intervention, but through the ingenuity of its scientists, engineers, and soldiers."
 EOR_science_above_superstition:0 "Science Above Superstition"
 EOR_science_above_superstition_desc:0 "The Empire must confront the realities of the modern world. Scientific knowledge and technological innovation—not unquestioning faith—must determine our future."
 EOR_reform_imperial_war_council:0 "Reform the Imperial War Council"
 EOR_reform_imperial_war_council_desc:0 "The Imperial military command must be reorganized around operational effectiveness. Officers shall be judged by their competence rather than their adherence to tradition."
 EOR_empower_the_technocrats:0 "Empower the Technocrats"
 EOR_empower_the_technocrats_desc:0 "Engineers and researchers need authority over the institutions they are expected to transform. Give the technical ministries a coordinating role in production, procurement and the Empire's next generation of weapons."
 EOR_the_scientific_shogunate:0 "The Scientific Shogunate"
 EOR_the_scientific_shogunate_desc:0 "The Shogunate shall be transformed into an institution guided by technical expertise and strategic rationality. The authority of the state will be preserved, but its methods must evolve."
 EOR_the_empire_of_tomorrow:0 "The Empire of Tomorrow"
 EOR_the_empire_of_tomorrow_desc:0 "Tatsu's political and military reforms now form a coherent national program. Consolidate the technocratic settlement and turn scientific achievement into a durable source of authority."
 EOR_father_and_son_accord:0 "The Father and Son Accord"
 EOR_father_and_son_accord_desc:0 "Emperor Yoshiro and Crown Prince Tatsu have agreed that Imperial tradition and scientific progress need not be enemies. The monarchy shall retain its authority while the Crown Prince receives greater responsibility for military modernization."
 EOR_tradition_and_innovation:0 "Tradition and Innovation"
 EOR_tradition_and_innovation_desc:0 "The Empire's traditions provide unity, while its technological achievements provide strength. By reconciling these principles, we may avoid the destructive divisions that have weakened other nations."
 EOR_reformed_imperial_court:0 "A Reformed Imperial Court"
 EOR_reformed_imperial_court_desc:0 "The Imperial Court shall establish clearer responsibilities between the throne, the military leadership, and the technological ministries."
 EOR_imperial_ambition:0 "Imperial Ambition"
 EOR_imperial_ambition_desc:0 "The Empire's scattered commitments demand a strategic purpose. Bring its overseas ambitions before the government and begin planning the campaigns that would make them achievable."
 EOR_northern_war_plan:0 "The Northern War Plan"
 EOR_northern_war_plan_desc:0 "A northern campaign needs its own logistical and operational framework. Open the Soviet theater once it is our chosen priority or a later strategic reassessment permits expansion."
 EOR_operation_vorkuta:0 "Operation Vorkuta"
 EOR_operation_vorkuta_desc:0 "Continental distances will punish any force that advances without preparation. Organize the northern offensive and establish the military foundations for operations against the Soviet Union."
 EOR_strike_vladivostok:0 "Strike at Vladivostok"
 EOR_strike_vladivostok_desc:0 "Vladivostok anchors Soviet power on the Pacific coast. Prepare the attack on this first major objective and the prestige claim that will follow its capture."
 EOR_battle_for_siberia:0 "Advance Through Siberia"
 EOR_battle_for_siberia_desc:0 "The advance now depends on surviving distance, weather and a thin transport network. Adapt our logistics to Siberia and prepare the next stage of the northern war."
 EOR_into_soviet_territory:0 "Into Soviet Territory"
 EOR_into_soviet_territory_desc:0 "The Imperial Army must exploit its initial victories before Soviet forces can reorganize. Rapid mechanized offensives will prevent the enemy from establishing defensive lines."
 EOR_stalingrad_offensive:0 "The Stalingrad Offensive"
 EOR_stalingrad_offensive_desc:0 "The Soviet leadership has attached enormous symbolic importance to Stalingrad. Capturing the city would deliver both a military and psychological blow to the Soviet war effort."
 EOR_odessa_operation:0 "The Odessa Operation"
 EOR_odessa_operation_desc:0 "The northern campaign must develop into a wider challenge to Soviet strategic depth. Prepare the operation that will carry Imperial forces toward the decisive western objectives."
 EOR_march_on_moscow:0 "March on Moscow"
 EOR_march_on_moscow_desc:0 "Moscow is the political and military center of the Soviet war effort. Concentrate preparations for the final approach and make its capture an explicit campaign objective."
 EOR_fall_of_the_kremlin:0 "The Fall of the Kremlin"
 EOR_fall_of_the_kremlin_desc:0 "The Kremlin's fall would demonstrate that the northern campaign has reached the enemy's center. Recognize that achievement when it occurs, while judging Soviet defeat through the wider victory requirements."
 EOR_pacific_war_plan:0 "The Pacific War Plan"
 EOR_pacific_war_plan_desc:0 "A Pacific campaign requires secure bases and a coordinated fleet strategy. Open this theater once it is our first priority or a later reassessment permits it."
 EOR_fortify_pearl_harbor:0 "Fortify Pearl Harbor"
 EOR_fortify_pearl_harbor_desc:0 "Hawaii is a vital forward base in the central Pacific. Strengthen Pearl Harbor's defenses and prepare it to support operations far from Japan."
 EOR_black_tortoise_fortress:0 "The Black Tortoise Fortress"
 EOR_black_tortoise_fortress_desc:0 "A hardened Hawaiian base could absorb attacks that would cripple an exposed fleet. Develop the Black Tortoise defensive concept and authorize its costly preparation as a temporary strategic operation."
 EOR_challenge_allied_pacific_fleet:0 "Challenge the Allied Fleet"
 EOR_challenge_allied_pacific_fleet_desc:0 "The Allied fleet must be confronted before our forces can operate freely across the ocean. Prepare the naval effort needed to contest its control of the Pacific."
 EOR_secure_the_pacific:0 "Secure the Pacific"
 EOR_secure_the_pacific_desc:0 "Bases and fleet operations must support one another. Consolidate our Pacific position after preparing both Pearl Harbor and the challenge to Allied sea power."
 EOR_operation_santa_monica:0 "Operation Santa Monica"
 EOR_operation_santa_monica_desc:0 "An attack across the Pacific depends on careful staging and sustained supply. Prepare Operation Santa Monica as the bridge from maritime control to a mainland campaign."
 EOR_assault_american_mainland:0 "Assault the American Mainland"
 EOR_assault_american_mainland_desc:0 "The continental campaign must now turn preparations into a viable offensive. Establish the military basis for attacking the American mainland and pursuing its principal objectives."
 EOR_fall_of_allied_command:0 "The Fall of Allied Command"
 EOR_fall_of_allied_command_desc:0 "A decisive blow to Allied command would mark the culmination of the Pacific offensive. Record the achievement without treating one captured headquarters as the automatic defeat of every Allied power."
 EOR_imperial_strategic_reassessment:0 "Global Reassessment"
 EOR_imperial_strategic_reassessment_desc:0 "The first campaign has revealed new opportunities or exposed the limits of our original plan. Review its results and authorize operations in additional theaters when the reassessment conditions are met."
 EOR_prepare_for_coalition:0 "Prepare for the Coalition"
 EOR_prepare_for_coalition_desc:0 "Intelligence reports suggest that the Allied Nations and Soviet Union may cooperate against the Empire. We must prepare for the possibility of a coordinated offensive."
 EOR_the_last_opposition:0 "The Last Opposition"
 EOR_the_last_opposition_desc:0 "The Empire has overcome extraordinary challenges. Yet so long as another great power remains capable of resisting us, our struggle remains unfinished."
 EOR_the_supreme_shogunate:0 "The Supreme Shogunate"
 EOR_the_supreme_shogunate_desc:0 "Only demonstrated victory can justify Shinzo's highest claim to authority. Unite the military settlement under the title of Supreme Shogun once the required major successes have been secured."
 EOR_ensure_the_supremacy_of_our_technology:0 "Ensure the Supremacy of Our Technology"
 EOR_ensure_the_supremacy_of_our_technology_desc:0 "The Empire's numerical disadvantages make technical superiority essential. Establish a national research program to support advanced manufacturers, military reform and experimental science."
 EOR_approach_the_new_high_tech_companies:0 "Approach the New High-Tech Companies"
 EOR_approach_the_new_high_tech_companies_desc:0 "New industrial firms possess capabilities beyond the traditional procurement establishment. Open negotiations with them and build the partnerships needed by the Imperial research program."
 EOR_kurikara_robotics:0 "Kurikara Robotics"
 EOR_kurikara_robotics_desc:0 "Heavy robotic systems require specialists able to turn prototypes into reliable machines. Bring Kurikara Robotics into Imperial procurement and make its expertise available to the government."
 EOR_tenzai_robotics:0 "Tenzai Robotics"
 EOR_tenzai_robotics_desc:0 "Advanced aircraft demand close cooperation between airframe designers and robotic-control specialists. Bring Tenzai Robotics into the procurement network supporting our air forces."
 EOR_kanegawa_industries:0 "Kanegawa Industries"
 EOR_kanegawa_industries_desc:0 "Armored warfare depends on dependable production as much as bold designs. Establish a procurement relationship with Kanegawa Industries and its armored-equipment specialists."
 EOR_shirada_shipworks:0 "Shirada Shipworks"
 EOR_shirada_shipworks_desc:0 "A modern fleet needs shipyards capable of building and maintaining advanced hulls. Engage Shirada Shipworks as a central partner in Imperial naval development."
 EOR_funding_imperial_weaponry_institute:0 "Fund the Imperial Weaponry Institute"
 EOR_funding_imperial_weaponry_institute_desc:0 "Separate firms cannot answer every question raised by advanced weapons. Fund a central institute to coordinate military research, support technical ministries and provide a foundation for experimental programs."
 EOR_deploy_king_oni:0 "The King Oni Program"
 EOR_deploy_king_oni_desc:0 "Heavy robotic development must deliver equipment that the army can field. Complete the King Oni program and bring its machines into the production system."
 EOR_shogun_executioner_program:0 "The Shogun Executioner Program"
 EOR_shogun_executioner_program_desc:0 "Heavy robotics may be extended into a weapon of exceptional scale. Select the Shogun Executioner as the first grand program and commit to the industrial demands of its development."
 EOR_advanced_imperial_shipbuilding:0 "Advanced Imperial Shipbuilding"
 EOR_advanced_imperial_shipbuilding_desc:0 "Shirada's expertise must be supported by a broader naval construction program. Develop the shipbuilding capacity and methods required by the next generation of Imperial vessels."
 EOR_shogun_battleship_program:0 "The Shogun Battleship Program"
 EOR_shogun_battleship_program_desc:0 "The heavy-gun doctrine requires ships designed around its demands. Complete the development program that brings the Shogun battleship into Imperial production."
 EOR_giga_fortress_project:0 "The Giga Fortress Project"
 EOR_giga_fortress_project_desc:0 "A mobile naval fortress could concentrate extraordinary force in a contested theater. Select the Giga Fortress as the first grand program and begin its strategic development."
 EOR_transformable_aircraft:0 "Transformable Aircraft"
 EOR_transformable_aircraft_desc:0 "Tengu and Striker-VX development requires a shared foundation in advanced airframes and control systems. Establish both dedicated fighter and ground-attack equipment programs before choosing an air doctrine."
 EOR_mecha_tengu_program:0 "The Mecha Tengu Program"
 EOR_mecha_tengu_program_desc:0 "The fighter doctrine needs a sustained development program for its principal aircraft. Improve the research and operational support behind the Mecha Tengu force."
 EOR_striker_vx_squadrons:0 "Striker-VX Squadrons"
 EOR_striker_vx_squadrons_desc:0 "Ground-attack aircraft require crews trained for the demands of battlefield support. Develop the squadrons and technical expertise behind the dedicated Striker-VX air force."
 EOR_establish_nanotech_mainframe:0 "Establish the Nanotech Mainframe"
 EOR_establish_nanotech_mainframe_desc:0 "Advanced manufacturing needs a common system for coordinating its research and applications. Integrate nanoconstruction, robotic production and institute research into a national technical mainframe."
 EOR_project_omega:0 "Project Omega"
 EOR_project_omega_desc:0 "Psionic research may offer capabilities beyond conventional military technology. Select Project Omega as the first grand experimental program and investigate its possibilities under controlled conditions."
 EOR_liberate_the_manpower:0 "Liberate the Manpower"
 EOR_liberate_the_manpower_desc:0 "Automation can release workers from tasks that machines can perform. Reorganize employment to make more manpower available, accepting the social disruption caused by rapid change."
 EOR_imperial_wartime_measures:0 "Imperial Wartime Measures"
 EOR_imperial_wartime_measures_desc:0 "Military ambition requires an economy able to sustain it. Begin a coordinated industrial program that will settle the government's relationship with the zaibatsus and provide the foundation for mobilization."
 EOR_introduce_the_imperial_mobilization_law:0 "Introduce the Imperial Mobilization Law"
 EOR_introduce_the_imperial_mobilization_law_desc:0 "The chosen industrial settlement now provides a framework for wartime coordination. Introduce a national mobilization law and authorize joint mobilization with current subjects."
 EOR_government_zaibatsus_dialogue:0 "Government-Zaibatsu Dialogue"
 EOR_government_zaibatsus_dialogue_desc:0 "The industrial combines possess expertise the state cannot replace overnight. Convene negotiations to decide whether cooperation or direct control will govern the wartime economy."
 EOR_the_first_amendment_of_the_imperial_mobilization_law:0 "First Amendment to Imperial Mobilization"
 EOR_the_first_amendment_of_the_imperial_mobilization_law_desc:0 "The first mobilization measures have exposed weaknesses in military procurement. Amend the law to support Imperial infantry purchases and a broader commitment to the war effort."
 EOR_the_second_amendment_of_the_imperial_mobilization_law:0 "Second Amendment to Imperial Mobilization"
 EOR_the_second_amendment_of_the_imperial_mobilization_law_desc:0 "Sustained war requires production capacity as well as emergency orders. Extend the mobilization framework to authorize paid industrial expansion and maintain public support for the effort."
 EOR_bring_the_zaibatsus_into_the_fold:0 "The Imperial Arsenal"
 EOR_bring_the_zaibatsus_into_the_fold_desc:0 "Central planning must extend from legal authority to the operation of the combines. Complete their integration into the state-directed economy before introducing national mobilization measures."
 EOR_build_our_overseas_territories:0 "Imperial Overseas Territories"
 EOR_build_our_overseas_territories_desc:0 "The Empire's overseas commitments need more than garrisons and declarations. Begin a common administrative and development program for the territories and dependencies that support its regional position."
 EOR_imperial_logistics_network:0 "Imperial Logistics Network"
 EOR_imperial_logistics_network_desc:0 "Either administrative settlement depends on reliable movement between its members. Build a common logistics network after consolidating centralized integration or regional cooperation."
 EOR_resource_security_program:0 "Imperial Resource Dependency"
 EOR_resource_security_program_desc:0 "Factories cannot meet their targets if fuel and raw materials remain uncertain. Establish a resource-security program and choose whether self-sufficiency, overseas extraction or open commerce will sustain industry."
 EOR_develop_oceanic_territories:0 "Develop the Imperial Oceanic Territories"
 EOR_develop_oceanic_territories_desc:0 "The Oceanic Territories need ports, industry and services connected to the regional logistics system. Authorize targeted investments that require the local government's continued subject relationship and control of its capital."
 EOR_the_technological_co-development_initiative:0 "Technological Co-Development Initiative"
 EOR_the_technological_co-development_initiative_desc:0 "Infrastructure and joint development make a shared research program practical. Extend technical cooperation with participating dependencies while allowing its benefits to end when the relationship changes."
 EOR_tennoheika_banzai:0 "Imperial Centralization"
 EOR_tennoheika_banzai_desc:0 "The centralized sphere will be held together by loyalty to the throne. Commit to stronger Imperial authority, accepting the administrative pressure created by deeper extraction and control."
 EOR_reform_coprosperity_sphere:0 "Imperial Partnership"
 EOR_reform_coprosperity_sphere_desc:0 "The sphere can endure through cooperation rather than unconditional obedience. Choose a partnership policy that increases autonomy and accepts limits on immediate Imperial extraction."
 EOR_nanocore_state:0 "Construction Nanocores"
 EOR_forward_mecha_state:0 "Forward Mecha Bay"
 EOR_reconstruction_state:0 "Emergency Nanocore Reconstruction"
 EOR_omega_assault_state:0 "Yuriko: Psionic Assault"
 EOR_hawaii_defense:0 "Pearl Harbor Emergency Defense"
 EOR_capital_defense:0 "Defend the Imperial Capital"
 EOR_soviet_planning:0 "Soviet Campaign Preparations"
 EOR_soviet_offensive:0 "Moscow Offensive"
 EOR_subject_centralized_state:0 "Centralized Imperial Administration"
 EOR_nanocore_construction:0 "Construction Nanocores"
 EOR_omega_assault:0 "Yuriko: Psionic Assault"
 eor.1.t:0 "The Imperial Dawn"
 eor.1.d:0 "A new era has begun.\n\nFor years, the Empire of the Rising Sun has quietly expanded its military capabilities while the Soviet Union and Allied Nations exhausted themselves through conflict.\n\nThe Emperor has summoned the Imperial Court to announce the beginning of a new strategic offensive.\n\nThe Imperial Armed Forces stand ready."
 eor.1.a:0 "The Rising Sun Shall Illuminate the World"
 eor.2.t:0 "The Emperor's Address"
 eor.2.d:0 "Emperor Yoshiro has addressed the nation, declaring that the Empire's rise represents the fulfillment of its divine destiny.\n\nAcross Japan, citizens gather to celebrate the achievements of the Imperial Armed Forces and express their loyalty to the throne."
 eor.2.a:0 "Tenno Heika Banzai"
 eor.3.t:0 "The Crown Prince's Proposal"
 eor.3.d:0 "Crown Prince Tatsu has presented the Imperial Court with an ambitious program of military modernization.\n\nHis proposal emphasizes robotics, advanced manufacturing, and scientific research.\n\nAlthough the Emperor supports technological progress, several traditionalist officials have expressed concern over the Crown Prince's growing influence."
 eor.3.a:0 "Support the Crown Prince"
 eor.3.b:0 "Preserve the Existing Military Hierarchy"
 eor.4.t:0 "Council of Shoguns"
 eor.4.d:0 "The Empire's senior military commanders have assembled to discuss the coming war.\n\nThe Imperial Army advocates rapid continental expansion, while the Navy emphasizes control of the Pacific.\n\nThe Crown Prince recommends maintaining sufficient flexibility to respond to both threats."
 eor.4.a:0 "Prioritize Continental Warfare"
 eor.4.b:0 "Prioritize Naval Supremacy"
 eor.4.c:0 "Maintain Strategic Flexibility"
 eor.10.t:0 "The Northern Offensive"
 eor.10.d:0 "The Imperial General Staff has completed preparations for a major offensive against the Soviet Union.\n\nThe operation will seek to disrupt Soviet military infrastructure and establish a strategic advantage in eastern Russia.\n\nThe Emperor demands a decisive victory."
 eor.10.a:0 "Begin the Offensive"
 eor.10.b:0 "Continue Preparations"
 eor.11.t:0 "The Fall of Vladivostok"
 eor.11.d:0 "Vladivostok has fallen before the Imperial Armed Forces.\n\nThe capture of the Soviet Union's principal Pacific naval base represents a major strategic victory.\n\nImperial naval engineers have already begun preparing the port for military operations."
 eor.11.a:0 "A Glorious Victory"
 eor.12.t:0 "The Battle for Stalingrad"
 eor.12.d:0 "Imperial forces have captured Stalingrad.\n\nThe city's fall has damaged Soviet morale and provided the Empire with an opportunity to exploit the enemy's weakened defensive position.\n\nThe Emperor has ordered celebrations throughout Japan."
 eor.12.a:0 "The Emperor's Will Is Absolute"
 eor.12.b:0 "Exploit Our Strategic Advantage"
 eor.13.t:0 "The Shogun Executioner"
 eor.13.d:0 "Engineers of the Imperial Weaponry Institute have completed a prototype of the Shogun Executioner.\n\nThe enormous combat machine possesses exceptional firepower and defensive capabilities.\n\nHowever, its deployment will require substantial industrial resources and logistical support."
 eor.13.a:0 "Deploy the Executioner Immediately"
 eor.13.b:0 "Continue Development"
 eor.13.c:0 "Redirect the Resources"
 eor.14.t:0 "The Fall of Moscow"
 eor.14.d:0 "The Imperial Armed Forces have captured Moscow.\n\nThe Soviet capital, once the center of a global revolutionary movement, now lies under Imperial occupation.\n\nAcross the Empire, celebrations mark what may be the greatest military victory in modern Japanese history.\n\nYet the remaining Soviet forces continue to resist, and the Allied Nations are watching developments with growing concern."
 eor.14.a:0 "The Soviet Empire Is Broken"
 eor.20.t:0 "The Attack on Pearl Harbor"
 eor.20.d:0 "Allied forces have launched a major offensive against Pearl Harbor.\n\nThe Imperial naval garrison is preparing to defend the installation, while reinforcements are being dispatched from surrounding bases.\n\nThe loss of Pearl Harbor would threaten Imperial control of the central Pacific."
 eor.20.a:0 "Hold Pearl Harbor at All Costs"
 eor.20.b:0 "Preserve the Fleet"
 eor.21.t:0 "The Black Tortoise Project"
 eor.21.d:0 "Imperial naval engineers have completed plans for an enormous floating military installation.\n\nThe Black Tortoise Fortress will extend the operational reach of the Imperial Navy and provide a powerful forward military platform.\n\nHowever, the project requires substantial resources."
 eor.21.a:0 "Construct the Fortress"
 eor.21.b:0 "Expand the Conventional Fleet"
 eor.22.t:0 "Operation Santa Monica"
 eor.22.d:0 "The Imperial General Staff has authorized a major operation against the American Pacific coastline.\n\nNaval forces are assembling while amphibious assault formations complete their final preparations.\n\nA successful landing could transform the balance of the war."
 eor.22.a:0 "Begin the Landing"
 eor.22.b:0 "Await Reinforcements"
 eor.23.t:0 "The Defeat of the Allied Nations"
 eor.23.d:0 "The Allied Nations have suffered a catastrophic military defeat.\n\nTheir principal military forces have been overwhelmed, and the Empire now controls strategic territories once considered beyond its reach.\n\nThe Emperor has declared that the Rising Sun has entered a new age of greatness.\n\nNevertheless, the future of the world remains uncertain."
 eor.23.a:0 "Glory to the Empire"
 eor.30.t:0 "An Alliance of Necessity"
 eor.30.d:0 "Extraordinary diplomatic negotiations have begun between the Allied Nations and Soviet Union.\n\nDespite their longstanding rivalry, both powers increasingly regard the Empire of the Rising Sun as a threat to their continued existence.\n\nTheir representatives are discussing the possibility of coordinated military action.\n\nThe Imperial Intelligence Service warns that a successful agreement could place Japan at war against the combined strength of its greatest enemies."
 eor.30.a:0 "Warn the Imperial War Council"
 eor.31.t:0 "The Siege of Yokohama"
 eor.31.d:0 "Enemy forces have reached the approaches to the Imperial capital.\n\nFor the first time in the war, the heartland of the Empire faces a direct military threat.\n\nThe Imperial Court has ordered the immediate mobilization of available forces.\n\nThe Emperor has declared that the homeland must be defended regardless of the cost."
 eor.31.a:0 "Defend the Imperial Capital"
 eor.31.b:0 "Preserve the Imperial Government"
 eor.40.t:0 "The Truth Behind Our Existence"
 eor.40.d:0 "Captured Soviet evidence confirms that time travel changed the course of history. Yoshiro sees an assault upon Imperial destiny; Tatsu sees proof that people must shape their own future."
 eor.40.a:0 "Reject the Soviet claims"
 eor.40.b:0 "Accept the evidence"
 eor.40.c:0 "Conceal the truth"
 eor.41.t:0 "The Imperial Court Divided"
 eor.41.d:0 "A crisis has exposed the rivalry between the throne, the technocrats and the armed forces. The Court must hear all three factions before the Empire chooses its future."
 eor.41.a:0 "Support the Emperor"
 eor.41.b:0 "Support the Crown Prince"
 eor.41.c:0 "Strengthen the military establishment"
 eor.42.t:0 "Tatsu Assumes Command"
 eor.42.d:0 "The Crown Prince takes executive responsibility for the government and armed forces. Whether Yoshiro remains a ceremonial Emperor or formally abdicates will be settled by the coming reforms."
 eor.42.a:0 "Government must serve the future"
 eor.43.t:0 "Constitutional Reconstruction"
 eor.43.d:0 "Civilian delegates and regional representatives have formed a provisional council. The military will answer to constitutional institutions, while the future of the monarchy remains open."
 eor.43.a:0 "Begin reconstruction"
 eor.50.t:0 "The Imperial Conference"
 eor.50.d:0 "Representatives from the Empire's overseas territories have gathered in Tokyo to discuss economic development, military cooperation, and political administration.\n\nSome delegates advocate closer integration with the Imperial government.\n\nOthers argue that greater local autonomy would improve long-term stability and economic development.\n\nThe Imperial Court must determine the direction of future cooperation."
 eor.50.a:0 "Strengthen Imperial Administration"
 eor.50.b:0 "Promote Economic Cooperation"
 eor.51.t:0 "Demands from the Overseas Territories"
 eor.51.d:0 "Officials from several overseas territories have warned that increasingly strict Imperial policies are causing political discontent.\n\nLocal administrators are requesting greater economic support and limited administrative concessions.\n\nThe Imperial government must decide whether to accommodate these demands."
 eor.51.a:0 "The Emperor's Authority Is Absolute"
 eor.51.b:0 "Offer Limited Concessions"
 eor.51.c:0 "Invest in Local Development"
 eor.52.t:0 "Imperial Territorial Unrest"
 eor.52.d:0 "Reports indicate growing unrest in one of the Empire's overseas territories.\n\nLocal authorities warn that existing security measures may prove insufficient.\n\nThe Imperial government must respond before the situation deteriorates."
 eor.52.a:0 "Deploy Imperial Security Forces"
 eor.52.b:0 "Negotiate with Local Authorities"
 eor.52.c:0 "Implement Emergency Economic Measures"
 eor.60.t:0 "The Future of the Rising Sun"
 eor.60.d:0 "A Federation of Equals"
 eor.60.a:0 "The Eternal Empire shall endure"
 eor.60.b:0 "The Architect of Tomorrow"
 eor.60.c:0 "The Rule of the Shoguns"
 eor.70.t:0 "The Collapse of the Shogunate"
 eor.70.d:0 "The Empire of the Rising Sun has suffered a catastrophic defeat.\n\nImperial military formations have been shattered, strategic industrial centers have fallen, and foreign forces now occupy much of Japan.\n\nThe Shogunate can no longer exercise effective control over the nation.\n\nSurviving Imperial commanders are divided over the future.\n\nSome advocate surrender and reconstruction.\n\nOthers insist that the Empire must continue resisting.\n\nThe future of Japan remains uncertain."
 eor.70.a:0 "The Empire Has Fallen"
 eor.70.b:0 "The Rising Sun Shall Return"
 eor.80.t:0 "Project Omega"
 eor.80.d:0 "The Imperial Weaponry Institute has completed Project Omega. Yuriko Omega is ready for carefully prepared missions. Only one operation may be undertaken at a time."
 eor.80.a:0 "Authorize specialized operations"
 eor.32.t:0 "An Alliance of Necessity"
 eor.32.d:0 "The Empire threatens both the Allied Nations and the Soviet Union. Shall we propose military coordination?"
 eor.32.a:0 "Propose a military coalition"
 eor.32.b:0 "Offer limited cooperation"
 eor.32.c:0 "Break off negotiations"
 eor.33.t:0 "The Allied Coalition Proposal"
 eor.33.d:0 "The Allied Nations propose military coordination against the Empire. Our existing political alliances will remain intact."
 eor.33.a:0 "Coordinate the war effort"
 eor.33.b:0 "Limit cooperation to logistics"
 eor.33.c:0 "Reject the proposal"
 eor.34.t:0 "Limited Allied Cooperation"
 eor.34.d:0 "The Allies offer logistical and intelligence cooperation against the Empire."
 eor.34.a:0 "Accept limited cooperation"
 eor.34.b:0 "Reject the offer"
 EOR_imperial_administration:0 "Imperial Administration"
 EOR_imperial_administration_desc:0 "Overseas policy must have a clear institutional foundation. Review the administration before choosing direct Imperial control or a more autonomous cooperative settlement."
 EOR_research_investment:0 "Imperial Research Investment"
 EOR_subject_negotiation:0 "Imperial Negotiation"
 EOR_deploy_construction_nanocores:0 "Deploy Construction Nanocores"
 EOR_deploy_construction_nanocores_desc:0 "Pay 50 political power and reserve 3 civilian factories for 90 days. Nanocores improve construction in the selected state by 20%. Requires Nanocore research. Cooldown: 180 days."
 EOR_forward_mecha_bay:0 "Establish a Forward Mecha Bay"
 EOR_forward_mecha_bay_desc:0 "Invest 75 PP, 100 support equipment and 3 civilian factories for 90 days. Construct a military factory and add local supplies for 180 days in the selected controlled state. Cooldown: 180 days."
 EOR_mobile_naval_facilities:0 "Deploy Mobile Naval Facilities"
 EOR_mobile_naval_facilities_desc:0 "Reserve 3 civilian factories for 90 days to accelerate naval-base construction by 30% in a controlled coastal state. Cooldown: 180 days."
 EOR_emergency_reconstruction:0 "Emergency Nanocore Reconstruction"
 EOR_emergency_reconstruction_desc:0 "Pay 35 PP and 100 support equipment; reserve 3 civilian factories for 60 days. Repair infrastructure and factories 50% faster in the selected state. Cooldown: 120 days."
 EOR_imperial_administration_review:0 "Review Imperial Administration"
 EOR_imperial_administration_review_desc:0 "Spend 50 PP to stabilize the Mandate by 5 and ease overseas pressure by 10. Cooldown: 180 days."
 EOR_war_council_planning:0 "Convene the Imperial War Council"
 EOR_war_council_planning_desc:0 "Spend 50 PP for 90 days of improved planning and supply coordination. Cooldown: 180 days."
 EOR_technological_administration:0 "Coordinate Technological Ministries"
 EOR_technological_administration_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to gain 180 days of +3% research speed."
 EOR_investigate_soviet_research:0 "Investigate Soviet Temporal Research"
 EOR_investigate_soviet_research_desc:0 "An intelligence route to the truth: invest 100 PP and 3 civilian factories for 180 days after establishing the Weaponry Institute. The resulting intelligence unlocks the ideological crisis once the Crown Prince is established."
 EOR_begin_northern_war:0 "Authorize the Northern War"
 EOR_begin_northern_war_desc:0 "Declare war on the Soviet Union using the completed war preparations. The AI requires favorable estimated army strength and no existing war."
 EOR_prepare_soviet_offensive:0 "Prepare a Soviet Offensive"
 EOR_prepare_soviet_offensive_desc:0 "Spend 50 PP for 90 days of attack and planning support against the Soviet Union."
 EOR_begin_pacific_war:0 "Authorize the Pacific War"
 EOR_begin_pacific_war_desc:0 "Declare war on the USA. The AI requires favorable estimated strength and no existing war. This does not automatically declare war on the Soviet Union."
 EOR_pacific_operations:0 "Pacific Fleet Operations"
 EOR_pacific_operations_desc:0 "Spend 50 PP and 50 fuel to gain 90 days of convoy and invasion support. Cooldown: 180 days."
 EOR_mainland_invasion:0 "Prepare the American Landing"
 EOR_mainland_invasion_desc:0 "Spend 75 PP for 90 days of amphibious and logistical support. Cooldown: 180 days."
 EOR_global_strategy:0 "Review Global Strategy"
 EOR_global_strategy_desc:0 "Spend 50 PP for 20 army experience and 90 days of planning support."
 EOR_anti_coalition_readiness:0 "Prepare Homeland Reserves"
 EOR_anti_coalition_readiness_desc:0 "Spend 75 PP for 90 days of homeland defense and mobilization support."
 EOR_defend_pearl_harbor:0 "Reinforce Pearl Harbor"
 EOR_defend_pearl_harbor_desc:0 "Spend 50 PP and 2500 manpower to improve Hawaiian defense for 90 days."
 EOR_rebuild_vladivostok:0 "Reconstruct Vladivostok Port"
 EOR_rebuild_vladivostok_desc:0 "Reserve 3 civilian factories for 90 days to improve local naval-base repair by 50% for 180 days."
 EOR_procure_king_oni:0 "Procure King Oni"
 EOR_procure_king_oni_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days to deliver 30 equipment. Cooldown: 180 days."
 EOR_procure_infantry:0 "Procure Imperial Infantry"
 EOR_procure_infantry_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days to deliver 600 equipment. Cooldown: 180 days."
 EOR_shogun_construction_program:0 "Fund Shogun Shipbuilding"
 EOR_shogun_construction_program_desc:0 "Invest 100 PP and reserve 3 civilian factories for 180 days for 180 days of increased dockyard output. Ships still require normal construction and resources."
 EOR_mobilize_imperial_workforce:0 "Mobilize the Imperial Workforce"
 EOR_mobilize_imperial_workforce_desc:0 "Spend 50 PP and 2% stability for a 180-day factory output mobilization."
 EOR_expanded_economic_mobilization:0 "Expand Wartime Industry"
 EOR_expanded_economic_mobilization_desc:0 "Invest 75 PP and reserve 3 civilian factories for 180 days to add one military factory in the capital."
 EOR_develop_mal_resources:0 "Develop Malayan Resources"
 EOR_develop_mal_resources_desc:0 "Invest 75 PP and 3 civilian factories for 180 days. A current Imperial subject receives 8 resources in a controlled state. Dependency relief requires both Malayan and Indonesian projects while both remain subjects."
 EOR_develop_ins_resources:0 "Develop Indonesian Resources"
 EOR_develop_ins_resources_desc:0 "Invest 75 PP and 3 civilian factories for 180 days. A current Imperial subject receives 8 resources in a controlled state. Dependency relief requires both Malayan and Indonesian projects while both remain subjects."
 EOR_overseas_infrastructure:0 "Invest in Overseas Infrastructure"
 EOR_overseas_infrastructure_desc:0 "Invest 50 PP and 3 civilian factories for 90 days. A selected current Imperial subject state gains infrastructure and the subject gains 3% stability."
 EOR_overseas_ports:0 "Invest in Overseas Naval Industry"
 EOR_overseas_ports_desc:0 "Invest 75 PP and 3 civilian factories for 120 days to construct a dockyard in a selected coastal subject state."
 EOR_overseas_mobilization:0 "Coordinate Subject Mobilization"
 EOR_overseas_mobilization_desc:0 "Spend 50 PP to raise war support by 5% in current subjects and gain 10 army experience."
 EOR_centralization_administration:0 "Fund Centralized Administration"
 EOR_centralization_administration_desc:0 "Spend 75 PP to reduce overseas pressure by 20."
 EOR_partnership_investment:0 "Fund Imperial Partnership"
 EOR_partnership_investment_desc:0 "Invest 75 PP and 3 civilian factories for 120 days to improve current subject stability by 3% and support scientific cooperation."
 EOR_build_executioner:0 "Construct the Shogun Executioner"
 EOR_build_executioner_desc:0 "Invest 150 PP and reserve 8 civilian factories with a 10% factory-output penalty for 180 days. Then deploy a prototype for 60 days: +15% breakthrough, increased supply demand and attrition. Continued development improves reliability. One prototype operation per year."
 EOR_build_giga_fortress:0 "Construct the Giga Fortress"
 EOR_build_giga_fortress_desc:0 "Invest 200 PP and reserve 8 civilian factories with a 10% factory-output penalty for 240 days. Then gain air/naval attack support for 90 days, with increased fuel costs. One operation per 540 days."
 EOR_build_black_tortoise:0 "Construct the Black Tortoise"
 EOR_build_black_tortoise_desc:0 "Invest 150 PP and reserve 8 civilian factories with a 10% factory-output penalty for 180 days. Gain 180 days of naval range and convoy escort support. Cooldown: 365 days."
 EOR_omega_assault_desc:0 "Invest 100 PP to prepare Yuriko for 30 days. Gain 30 days of +10% breakthrough against the selected enemy and local organization recovery in its selected occupied state. All Yuriko operations share a 180-day cooldown."
 EOR_omega_command_disruption:0 "Yuriko: Disrupt Enemy Command"
 EOR_omega_command_disruption_desc:0 "Invest 100 PP and 30 days preparation. The selected current enemy receives -10% planning speed and -5% organization for 30 days. Shared 180-day cooldown."
 EOR_omega_sabotage:0 "Yuriko: Strategic Sabotage"
 EOR_omega_sabotage_desc:0 "Invest 100 PP and 30 days preparation to damage one military factory level in a selected enemy state. Shared 180-day cooldown."
 EOR_emergency_relocation:0 "Relocate the Imperial Government"
 EOR_emergency_relocation_desc:0 "Spend 75 PP to move government to a controlled Japanese core state and support continuity for 180 days."
 EOR_emergency_homeland_mobilization:0 "Emergency Homeland Mobilization"
 EOR_emergency_homeland_mobilization_desc:0 "Spend 75 PP and 3% stability for 90 days of defense and mobilization support."
 EOR_postwar_imperial:0 "Postwar Imperial Administration"
 EOR_postwar_imperial_desc:0 "Invest 75 PP and 3 civilian factories for 180 days to consolidate the chosen postwar order. Cooldown: 365 days."
 EOR_post_defeat_reconstruction:0 "Begin Imperial Reconstruction"
 EOR_post_defeat_reconstruction_desc:0 "Invest 50 PP and 3 civilian factories for 180 days to remove collapse penalties and recover 5% stability."
 EOR_imperial_resistance_preparation:0 "Organize Imperial Resistance"
 EOR_imperial_resistance_preparation_desc:0 "Spend 75 PP for 90 days of homeland defense preparation. This supports resistance and does not spawn a new country or army."
 EOR_mobile_naval_state:0 "Mobile Naval Facilities"
 EOR_port_repair:0 "Port Reconstruction"
 EOR_yoshiro:0 "Emperor Yoshiro"
 EOR_tatsu:0 "Crown Prince Tatsu"
 EOR_divine_ruler:0 "Divine Emperor"
 EOR_traditionalist:0 "Traditionalist"
 EOR_technocratic_leader:0 "Technocratic Reformer"
 EOR_yoshiro_desc:0 "Emperor Yoshiro is the supreme ruler of the Empire of the Rising Sun and the central figure of its political ideology.\n\nHe believes that Japan's rise to global power represents the fulfillment of a divine destiny. Under his rule, the Empire has developed into a technologically advanced military power capable of challenging both the Soviet Union and Allied Nations.\n\nAlthough Yoshiro possesses considerable political authority, his belief in destiny can influence his strategic judgment. He places great importance on symbolic victories and demonstrations of Imperial superiority.\n\nThe revelation that Soviet scientists altered history threatens the philosophical foundations of his rule. "
 EOR_tatsu_desc:0 "Crown Prince Tatsu is the son of Emperor Yoshiro and one of the Empire's most influential military leaders.\n\nUnlike his father, Tatsu places his confidence in science, engineering, and technological progress.\n\nHe advocates military modernization and prefers strategically decisive operations over symbolic demonstrations of power.\n\nHis scientific outlook increasingly brings him into conflict with the traditionalists of the Imperial Court.\n\nWhen evidence emerges that history has been manipulated through Soviet time travel, Tatsu becomes the central advocate for reforming the Empire's political and military institutions. "
 EOR_nanocores:0 "Nanocore Construction"
 EOR_nanocores_desc:0 "Nanocores permit paid, temporary state construction projects."
 EOR_nanotech_integration:0 "Nanotech Integration"
 EOR_nanotech_integration_desc:0 "The Mainframe integrates advanced manufacturing and unlocks experimental projects."
 EOR_transformable_airframes:0 "Transformable Airframes"
 EOR_transformable_airframes_desc:0 "Transforming systems are represented by dedicated aircraft and operational doctrines in HOI4."
 EOR_mecha_tengu:0 "Mecha Tengu"
 EOR_mecha_tengu_desc:0 "An advanced dedicated fighter supported by transformable-unit doctrine."
 EOR_mecha_tengu_equipment:0 "Mecha Tengu"
 EOR_mecha_tengu_equipment_short:0 "Mecha Tengu"
 EOR_mecha_tengu_equipment_desc:0 "An advanced dedicated fighter supported by transformable-unit doctrine."
 EOR_striker_vx:0 "Striker-VX"
 EOR_striker_vx_desc:0 "A dedicated close-air-support aircraft with advanced defensive systems."
 EOR_striker_vx_equipment:0 "Striker-VX"
 EOR_striker_vx_equipment_short:0 "Striker-VX"
 EOR_striker_vx_equipment_desc:0 "A dedicated close-air-support aircraft with advanced defensive systems."
 EOR_kurikara_robotics_unlock_tt:0 "Kurikara Robotics is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_tenzai_robotics_unlock_tt:0 "Tenzai Robotics is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_kanegawa_industries_unlock_tt:0 "Kanegawa Industries is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_shirada_shipworks_unlock_tt:0 "Shirada Shipworks is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_WAR_OF_THE_THREE_POWERS_DESC:0 "Emperor Yoshiro's technological empire prepares to challenge the Soviets and Allied Nations. Advanced robotics and a powerful navy promise victory, but resources, overseas unrest and rival political factions threaten its ambitions. Preserve divine Imperial rule, support Tatsu's technocrats, or back Shinzo's military government while choosing the Empire's doctrines, economic strategy and place in Asia."
 EOR_kenji_tenzai_desc:0 "Kenji Tenzai is an Imperial commander associated with the Empire's advanced military operations.\n\nHe specializes in mechanized warfare and the deployment of sophisticated combat equipment.\n\nHis tactical approach emphasizes speed, concentrated firepower, and the exploitation of technological advantages."
 EOR_shinzo_nagama_desc:0 "Shinzo Nagama is an experienced Imperial commander specializing in amphibious operations and the coordination of infantry formations.\n\nHis expertise makes him particularly valuable during the Empire's campaigns against coastal territories and strategically important islands."
 EOR_naomi_shirada_desc:0 "Naomi Shirada is one of the Empire's most capable naval commanders.\n\nShe combines aggressive naval tactics with extensive knowledge of modern naval engineering and advanced fleet operations.\n\nHer leadership is particularly valuable during large-scale naval confrontations and operations involving the Empire's advanced capital ships."
