 EOR_subject_phi_local_military_administration_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Delivery requires the same recipient to remain an Imperial subject and retain ownership and control of the original project capital. If invalidated, no reward or refund is granted; the reservation expires on schedule. Successful completion also adds two points of monthly administrative relief, within the national cap of six."
