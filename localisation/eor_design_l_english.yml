 EOR_v2_establish_imperial_intelligence:0 "Imperial Intelligence Bureau"
 EOR_v2_establish_imperial_intelligence_desc:0 "The intelligence bureau compares military reporting with intercepted communications. Its staff protect sensitive programs and support decryption."
 EOR_v2_restore_imperial_authority:0 "Restored Imperial Authority"
 EOR_v2_restore_imperial_authority_desc:0 "Court offices have restored the reach of Imperial authority. Political institutions coordinate more effectively beneath the throne."
 EOR_v2_scientific_purge:0 "The Scientific Purge"
 EOR_v2_scientific_purge_desc:0 "Scientific skeptics have been removed from positions of influence. The purge protects orthodoxy while damaging research and political cooperation."
 EOR_v2_absolute_loyalty:0 "Absolute Loyalty"
 EOR_v2_absolute_loyalty_desc:0 "Military institutions demand obedience to the throne. Discipline strengthens organization while consuming political effort."
 EOR_v2_imperial_unity:0 "Imperial Unity"
 EOR_v2_imperial_unity_desc:0 "The court has reconciled competing loyalist institutions. Their cooperation broadens the manpower available for service."
 EOR_v2_sacred_offensive:0 "The Sacred Offensive"
 EOR_v2_sacred_offensive_desc:0 "A sacred offensive concentrates military effort around Yoshiro’s public mission. The temporary attack advantage increases supply demands."
 EOR_v2_defend_the_homeland:0 "Defend the Sacred Homeland"
 EOR_v2_defend_the_homeland_desc:0 "Homeland defense institutions prioritize positions on Imperial cores. Their defensive advantage comes at the expense of movement."
 EOR_v2_warriors_of_destiny:0 "Warriors of Destiny"
 EOR_v2_warriors_of_destiny_desc:0 "Elite infantry and special forces embody the court’s military ideal. Their training strengthens attacks without restricting common equipment access."
 EOR_v2_imperial_fortresses:0 "Imperial Fortresses"
 EOR_v2_imperial_fortresses_desc:0 "Military engineers maintain a program of protected homeland positions. Fortifications reinforce defensive operations on Imperial cores."
 EOR_v2_question_the_old_order:0 "Question the Old Order"
 EOR_v2_question_the_old_order_desc:0 "Technical officials challenge inherited political assumptions. Research gains influence while public institutions absorb the resulting instability."
 EOR_v2_abdication_instability:0 "The Abdication Crisis"
 EOR_v2_abdication_instability_desc:0 "The forced abdication has unsettled the court and public administration. This temporary crisis reflects the political cost of succession."
 EOR_v2_a_new_emperor:0 "A New Emperor"
 EOR_v2_a_new_emperor_desc:0 "Tatsu rules through a new Imperial settlement. His political authority grows while unresolved opposition continues to burden stability."
 EOR_v2_the_silent_throne:0 "The Silent Throne"
 EOR_v2_the_silent_throne_desc:0 "Yoshiro retains a ceremonial place within Tatsu’s government. The accommodation reassures court institutions but restrains scientific independence."
 EOR_v2_empower_the_technocrats:0 "Empowered Technocrats"
 EOR_v2_empower_the_technocrats_desc:0 "Technical specialists coordinate production learning and advanced research. Their ministries institutionalize Tatsu’s modernization program."
 EOR_v2_automated_warfare:0 "Automated Warfare"
 EOR_v2_automated_warfare_desc:0 "Automated production supports armored warfare at lower construction cost. Its output demands additional steel and supplies."
 EOR_v2_human_machine_doctrine:0 "Human-Machine Doctrine"
 EOR_v2_human_machine_doctrine_desc:0 "Professional troops operate alongside advanced machinery. Standardized procurement and training support their organization."
 EOR_v2_robotic_legions:0 "Robotic Legions"
 EOR_v2_robotic_legions_desc:0 "Robotic formations coordinate armored assaults. Their operating doctrine concentrates heavy firepower against defended positions."
 EOR_v2_professional_armed_forces:0 "Professional Armed Forces"
 EOR_v2_professional_armed_forces_desc:0 "A professional staff coordinates military planning and supply. Service institutions emphasize sustained readiness over improvised mobilization."
 EOR_v2_army_supremacy:0 "Army Supremacy"
 EOR_v2_army_supremacy_desc:0 "The army takes priority in industrial planning. Land-force production and organization improve at the expense of dockyard output."
 EOR_v2_naval_supremacy:0 "Naval Supremacy"
 EOR_v2_naval_supremacy_desc:0 "The navy directs strategic procurement. Dockyards and amphibious operations gain support while military factory output bears the cost."
 EOR_v2_the_land_shogunate:0 "The Land Shogunate"
 EOR_v2_the_land_shogunate_desc:0 "Shinzo’s land commands coordinate mobile warfare and supply. The military settlement prioritizes the practical needs of field formations."
 EOR_v2_the_oceanic_shogunate:0 "The Oceanic Shogunate"
 EOR_v2_the_oceanic_shogunate_desc:0 "Shinzo’s naval commands coordinate protected fleet operations and landings. The military settlement prioritizes maritime campaigning."
 EOR_v2_supreme_shogunate:0 "The Supreme Shogunate"
 EOR_v2_supreme_shogunate_desc:0 "The armed services dominate national administration under Shinzo. Military output and organization gain strength while civilian stability and research bear the cost."
 EOR_v2_secure_the_far_east:0 "Far Eastern Logistics"
 EOR_v2_secure_the_far_east_desc:0 "Forward supply organizations consolidate the Far Eastern campaign. Their support reduces the supply burden of military operations."
 EOR_cooperative_zaibatsus:0 "Corporate Partnership"
 EOR_cooperative_zaibatsus_desc:0 "Corporate laboratories and factories retain initiative within national procurement. Research and output improve, while bargaining with the industrial combines consumes political authority."
 EOR_v2_industrial_autonomy:0 "Industrial Autonomy"
 EOR_v2_industrial_autonomy_desc:0 "Industrial combines retain discretion within strategic contracts. Production learning improves while political bargaining continues to consume authority."
 EOR_controlled_zaibatsus:0 "State-Controlled Industry"
 EOR_controlled_zaibatsus_desc:0 "The state directs strategic industrial contracts and factory expansion. Tighter control raises output but burdens consumers and independent research."
 EOR_v2_imperial_planning:0 "Imperial Planning"
 EOR_v2_imperial_planning_desc:0 "State planning coordinates factory learning and infrastructure development. Public institutions supervise the industrial settlement."
 EOR_v2_resource_autarky:0 "Resource Autarky"
 EOR_v2_resource_autarky_desc:0 "Synthetic production and refining reduce reliance on imported fuel. Domestic security requires an additional consumer burden."
 EOR_v2_overseas_extraction:0 "Overseas Extraction"
 EOR_v2_overseas_extraction_desc:0 "Imperial procurement draws resources from overseas dependencies. Favorable access consumes political authority and contributes to administrative pressure."
 EOR_v2_imperial_supply:0 "Imperial Supply"
 EOR_v2_imperial_supply_desc:0 "Supply offices coordinate protected shipping routes. Logistics and convoy escorts support the overseas resource network."
 EOR_v2_open_trade:0 "Open Trade"
 EOR_v2_open_trade_desc:0 "Commercial agreements improve access to international resources. Peaceful markets support the political case for economic openness."
 EOR_v2_maritime_commerce:0 "Maritime Commerce"
 EOR_v2_maritime_commerce_desc:0 "Protected trade routes connect Imperial industry to world markets. Escort coordination and dockyard support sustain commercial access."
 EOR_v2_trade_disruption:0 "Maritime Trade Disruption"
 EOR_v2_trade_disruption_desc:0 "War with a principal trading power has disrupted commercial access. Industry and fuel supply remain under pressure while that conflict continues."
 EOR_v2_the_futuristic_bushido:0 "Futuristic Bushido"
 EOR_v2_the_futuristic_bushido_desc:0 "Elite infantry combine disciplined service with advanced weapons. Training and procurement institutions sustain their specialized role."
 EOR_v2_warriors_of_the_rising_sun:0 "Warriors of the Rising Sun"
 EOR_v2_warriors_of_the_rising_sun_desc:0 "Infantry formations maintain a coordinated assault doctrine. Their institutions strengthen the army’s offensive performance."
 EOR_v2_a_highly_mechanized_army:0 "Mechanized Warfare"
 EOR_v2_a_highly_mechanized_army_desc:0 "Mechanized formations organize around armor and protected mobility. Their doctrine supports concentrated land operations."
 EOR_v2_the_shadow_warriors:0 "Asymmetric Warfare"
 EOR_v2_the_shadow_warriors_desc:0 "Specialist formations coordinate intelligence and precise attacks. Their doctrine supports operations against exposed enemy systems."
 EOR_v2_shinobi_intelligence_network:0 "Shinobi Intelligence Network"
 EOR_v2_shinobi_intelligence_network_desc:0 "Shinobi networks connect intelligence collection with special operations. Their institutions support preparation and operational security."
 EOR_v2_rapid_deployment_doctrine:0 "Rapid Deployment Doctrine"
 EOR_v2_rapid_deployment_doctrine_desc:0 "Specialist formations prepare to concentrate quickly. Their operating doctrine supports rapid deployment and mobile action."
 EOR_v2_strike_from_the_shadows:0 "Strike from the Shadows"
 EOR_v2_strike_from_the_shadows_desc:0 "Special operations commands coordinate attacks against vulnerable positions. Their doctrine rewards preparation and concentrated action."
 EOR_v2_shogun_battlefleet:0 "Shogun Battlefleet"
 EOR_v2_shogun_battlefleet_desc:0 "The fleet concentrates heavy ships around decisive surface engagements. Its doctrine supports battleship firepower and protection."
 EOR_v2_decisive_naval_battle:0 "Decisive Naval Battle"
 EOR_v2_decisive_naval_battle_desc:0 "Naval commands concentrate for a decisive engagement. Their doctrine coordinates fleet attacks and heavy surface forces."
 EOR_v2_carrier_fleet:0 "Carrier Fleet"
 EOR_v2_carrier_fleet_desc:0 "Carrier forces coordinate conventional embarked aircraft with fleet operations. Dedicated Tengu fighters provide land-based cover from airfields."
 EOR_v2_tenzai_naval_aviation:0 "Tenzai Naval Aviation"
 EOR_v2_tenzai_naval_aviation_desc:0 "Naval aviation offices coordinate technical development with fleet requirements. Their work supports conventional carrier aircraft and land-based air cover."
 EOR_v2_air_sea_battle_doctrine:0 "Air-Sea Battle Doctrine"
 EOR_v2_air_sea_battle_doctrine_desc:0 "Naval and air commands share operational planning. Land-based Tengu cover complements conventional fleet aviation."
 EOR_v2_submarine_warfare:0 "Submarine Warfare"
 EOR_v2_submarine_warfare_desc:0 "Submarine commands concentrate against enemy shipping. Their doctrine supports concealed attacks on maritime supply routes."
 EOR_v2_torpedo_warfare_doctrine:0 "Torpedo Warfare Doctrine"
 EOR_v2_torpedo_warfare_doctrine_desc:0 "Submarine crews coordinate torpedo attacks and target selection. Specialized training supports their offensive role."
 EOR_v2_disrupt_enemy_commerce:0 "Disrupt Enemy Commerce"
 EOR_v2_disrupt_enemy_commerce_desc:0 "Submarine commands prioritize merchant routes and supply traffic. Their doctrine sustains pressure on enemy commerce."
 EOR_v2_the_silent_pacific:0 "The Silent Pacific"
 EOR_v2_the_silent_pacific_desc:0 "Submarine patrols coordinate a sustained Pacific campaign. Concealed operations threaten shipping across the theater."
 EOR_v2_air_superiority:0 "Air Superiority"
 EOR_v2_air_superiority_desc:0 "Fighter commands prioritize control of contested skies. Their doctrine supports air combat independently of the common equipment program."
 EOR_v2_dominate_the_skies:0 "Dominate the Skies"
 EOR_v2_dominate_the_skies_desc:0 "Fighter formations coordinate a sustained aerial contest. Operational institutions concentrate support on winning air superiority."
 EOR_v2_tactical_support:0 "Tactical Support"
 EOR_v2_tactical_support_desc:0 "Ground-attack commands coordinate closely with army formations. Their doctrine supports battlefield air operations."
 EOR_v2_support_the_army:0 "Support the Army"
 EOR_v2_support_the_army_desc:0 "Air and army staffs share tactical priorities. Coordinated support strengthens the contribution of ground-attack aircraft."
 EOR_v2_resource_mobilization:0 "Imperial Resource Mobilization"
 EOR_v2_resource_mobilization_desc:0 "Imperial offices mobilize overseas resources for national procurement. The policy depends on continued administrative control of dependencies."
 EOR_v2_fortify_the_empire:0 "Fortify the Empire"
 EOR_v2_fortify_the_empire_desc:0 "Military planning prioritizes protected bases and defensive positions. Its institutions prepare the Empire for prolonged pressure."
 EOR_v2_total_defense:0 "Total Defense"
 EOR_v2_total_defense_desc:0 "Defense planning coordinates military institutions across threatened regions. National preparations support a sustained defensive campaign."
 EOR_v2_war_of_attrition:0 "War of Attrition"
 EOR_v2_war_of_attrition_desc:0 "Commanders organize for prolonged resistance and recovery. Their doctrine sustains operations when a rapid conclusion is unavailable."
 eor.100.t:0 "The Emperor's Shadow"
 eor.100.d:0 "Shinzo presents a command failure: contradictory court and procurement orders have left officers unable to plan a common mobilization. He demands a single responsible chain of command and protected military appointments. His supporters distrust both sacred assurances and ministries that promise machines without a deployment timetable. Suki warns that intervention will deepen the political dispute."
 eor.100.a:0 "Support military intervention"
 eor.100.b:0 "Reject the proposal"
 eor.100.c:0 "Negotiate a compromise"
 eor.101.t:0 "The Emperor's Abdication"
 eor.101.d:0 "Tatsu asks Yoshiro to relinquish the throne in the name of Imperial modernization. Suki reports that strong technical support can secure a negotiated succession. A contested assumption of the title risks instability and renewed military opposition."
 eor.101.a:0 "Secure a peaceful succession"
 eor.101.b:0 "Press ahead despite the opposition"
 eor.102.t:0 "The Shogunate Coup"
 eor.102.d:0 "Shinzo’s officers demand control of emergency orders and a binding settlement with the dynasty. Strong military support permits a peaceful transfer; bargaining costs political authority. Armed seizure will damage stability and divide forces against Yoshiro’s loyalists. Standing down restores Yoshiro’s route while preserving completed preparations. A weak conspiracy may already have been exposed."
 eor.102.a:0 "Secure a peaceful transfer; honor the court settlement"
 eor.102.b:0 "Negotiate guarantees with the court — 100 PP"
 eor.102.c:0 "Prepare armed seizure; accept civil-war losses"
 eor.103.t:0 "The Supreme Shogun"
 eor.103.d:0 "Shinzo’s commanders have consolidated the military settlement and secured a major success. They offer him the Supreme Shogun title. Suki records the honor while warning that the costs of military supremacy still fall on civilian administration."
 eor.103.a:0 "The Rule of the Shoguns"
 eor.104.t:0 "The World Grows Fearful"
 eor.104.d:0 "Suki reports that Imperial expansion has alarmed rival governments. Tatsu proposes dividing their interests, while Shinzo asks whether the armed services can sustain another front. A coalition remains a possible response to Imperial threat, not a predetermined campaign ending."
 eor.104.a:0 "Convene the General Staff"
 eor.105.t:0 "Imperial Diplomacy"
 eor.105.d:0 "Suki reports that fear of the Empire may bring its rivals together. Tatsu proposes individual agreements to keep them divided; no government will accept merely because the Empire demands it. Envoys may seek a pact only when the stated eligibility conditions hold."
 eor.105.a:0 "Authorize negotiations"
 eor.107.t:0 "Institutional Confidence Falters"
 eor.107.d:0 "Suki reports that support for the governing institutions has fallen below thirty. Officers question orders and ministries dispute responsibility. The government can rally its supporters or hear technical proposals within the existing political settlement."
 eor.107.a:0 "Rally the Imperial loyalists"
 eor.107.b:0 "Hear the technical administrators"
 eor.108.t:0 "A Shogunate Counter-Conspiracy"
 eor.108.d:0 "Suki reports that military traditionalists are organizing against Tatsu’s administration. Shinzo demands guarantees for command appointments; technical ministers resist another veto over procurement. A sufficiently weak government and powerful military may allow the existing conspiracy to replace technical rule."
 eor.108.a:0 "Offer military guarantees"
 eor.108.b:0 "Stand behind the reforms"
 eor.108.c:0 "Concede executive authority to the military"
 eor.109.t:0 "The Conspiracy Stands Down"
 eor.109.d:0 "Shinzo has abandoned the coup. The military will submit to the throne, and Yoshiro will resume the path of Imperial consolidation. Completed preparations remain part of the country’s history."
 eor.109.a:0 "Restore Imperial government"
 eor.110.t:0 "A Proposal from the Rising Sun"
 eor.110.d:0 "Imperial envoys offer cooperation against common dangers. Chinese representatives must decide whether the proposed access and coordination serve China’s interests, require concessions or should be refused. No territorial concession is presumed by this briefing."
 eor.110.a:0 "Accept the partnership"
 eor.110.b:0 "Demand economic concessions"
 eor.110.c:0 "Reject the Imperial offer"
 eor.111.t:0 "The Imperial Ultimatum"
 eor.111.d:0 "Imperial envoys demand Chinese submission to an Imperial protectorate. Chinese representatives weigh their independence against the threatened campaign. Acceptance creates a subject relationship; refusal may give the Empire a war goal and does not itself begin a war."
 eor.111.a:0 "Accept the protectorate"
 eor.111.b:0 "China will not submit"
 eor.114.t:0 "A Strategic Settlement"
 eor.114.d:0 "Imperial envoys propose a non-aggression pact and one-year truce. Our representatives must weigh the security it offers against recognition of Imperial strength. Acceptance is available only under the stated legal conditions; refusal remains possible and no custom campaign result follows."
 eor.114.a:0 "Accept the settlement"
 eor.114.b:0 "Reject the proposal"
 EOR_bolster_imperial_legitimacy:0 "Rally Imperial Legitimacy"
 EOR_bolster_imperial_legitimacy_desc:0 "Spend 50 PP to raise Imperial Legitimacy by 10 and the Mandate by 5. Cooldown: 180 days."
 EOR_support_technocrats:0 "Support the Technocrats"
 EOR_support_technocrats_desc:0 "Spend 50 PP and 2% stability to raise technocratic influence by 10. Cooldown: 180 days."
 EOR_support_military_establishment:0 "Support the Military Establishment"
 EOR_support_military_establishment_desc:0 "Spend 50 PP to raise military influence by 10, reducing civilian legitimacy by 5. Cooldown: 180 days."
 EOR_colonial_administrative_review:0 "Review Colonial Demands"
 EOR_colonial_administrative_review_desc:0 "Spend 50 PP to reduce overseas pressure by 15 and improve current subject stability by 2%."
 EOR_intelligence_crisis_investigation:0 "Investigate the Imperial Crisis"
 EOR_intelligence_crisis_investigation_desc:0 "Spend 100 PP and reserve 3 civilian factories for 120 days to investigate intercepts once Imperial threat exceeds 19. Completed intelligence can reveal evidence and trigger a succession crisis. For a peaceful debate without discovered evidence, use Schedule a Court Review in political decisions instead."
 EOR_negotiate_coup_transition:0 "Negotiate the Military Transition"
 EOR_negotiate_coup_transition_desc:0 "Spend 100 PP to raise military influence by 10. Once support reaches 70, a negotiated bloodless transfer becomes available. The armed route remains a costly alternative."
 EOR_diplomatic_concessions:0 "Authorize Diplomatic Concessions"
 EOR_diplomatic_concessions_desc:0 "Yoshiro or Shinzo can authorize pragmatic diplomacy for 100 PP and 5 points of military influence. This opens restricted cooperation without changing the chosen political route."
 EOR_military_partnership_concessions:0 "Obtain Military Consent for Partnership"
 EOR_military_partnership_concessions_desc:0 "Shinzo can authorize overseas partnership after paying 100 PP and reducing military influence by 10."
 EOR_imperial_prestige_project:0 "Fund an Overseas Prestige Investment"
 EOR_imperial_prestige_project_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to build one civilian factory in a selected subject state. Completion grants 5 mandate and legitimacy; the first successful contract adds one point of monthly administrative relief. Shares Sacred Mobilization's 365-day authorization cooldown. The original subject, state control and Yoshiro government are rechecked; invalidation gives no reward or refund."
 EOR_research_warrior:0 "Imperial Warrior Equipment"
 EOR_research_warrior_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to research this equipment, independently of the primary army doctrine."
 EOR_research_tsunami:0 "Tsunami Tank Equipment"
 EOR_research_tsunami_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to research this equipment, independently of the primary army doctrine."
 EOR_research_oni:0 "King Oni Equipment"
 EOR_research_oni_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to research this equipment, independently of the primary army doctrine."
 EOR_additional_project_omega:0 "Authorize an Additional Project Omega"
 EOR_additional_project_omega_desc:0 "Late-game exception: requires 60 military and 40 civilian factories. Spend 300 PP and reserve 8 civilian factories with a 10% factory-output penalty for 360 days. The program becomes available without completing its mutually exclusive primary focus."
 EOR_additional_project_executioner:0 "Authorize an Additional Shogun Executioner"
 EOR_additional_project_executioner_desc:0 "Late-game exception: requires 60 military and 40 civilian factories. Spend 300 PP and reserve 8 civilian factories with a 10% factory-output penalty for 360 days. The program becomes available without completing its mutually exclusive primary focus."
 EOR_additional_project_giga:0 "Authorize an Additional Giga Fortress"
 EOR_additional_project_giga_desc:0 "Late-game exception: requires 60 military and 40 civilian factories. Spend 300 PP and reserve 8 civilian factories with a 10% factory-output penalty for 360 days. The program becomes available without completing its mutually exclusive primary focus."
 EOR_renew_china_cooperation:0 "Renew Negotiations with China"
 EOR_renew_china_cooperation_desc:0 "Spend 75 PP to renew a rejected partnership offer. The Empire must not be at war with China; China remains free to refuse."
 EOR_seek_settlement_sov:0 "Seek a Settlement with the Soviet Union"
 EOR_seek_settlement_sov_desc:0 "Spend 100 PP to request a non-aggression pact and a one-year truce. A legal request requires an independent target outside our faction without an existing settlement: either an enemy above 35% surrender progress, or a peaceful target weaker than the Empire while our government has neither capitulated nor entered civil war. Acceptance can still be refused, costing an additional 25 PP."
 EOR_seek_settlement_usa:0 "Seek a Settlement with the United States"
 EOR_seek_settlement_usa_desc:0 "Spend 100 PP to request a non-aggression pact and a one-year truce. A legal request requires an independent target outside our faction without an existing settlement: either an enemy above 35% surrender progress, or a peaceful target weaker than the Empire while our government has neither capitulated nor entered civil war. Acceptance can still be refused, costing an additional 25 PP."
 EOR_seek_settlement_eng:0 "Seek a Settlement with Britain"
 EOR_seek_settlement_eng_desc:0 "Spend 100 PP to request a non-aggression pact and a one-year truce. A legal request requires an independent target outside our faction without an existing settlement: either an enemy above 35% surrender progress, or a peaceful target weaker than the Empire while our government has neither capitulated nor entered civil war. Acceptance can still be refused, costing an additional 25 PP."
