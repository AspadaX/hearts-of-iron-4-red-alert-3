 eor.100.t:0 "The Emperor's Shadow"
 eor.100.d:0 "Shinzo Nagama argues that the Empire needs emergency military measures. Supporting him strengthens the armed forces politically; rejecting him may preserve civilian authority but deepen military resentment."
 eor.100.a:0 "Support military intervention"
 eor.100.b:0 "Reject the proposal"
 eor.100.c:0 "Negotiate a compromise"
 eor.101.t:0 "The Emperor's Abdication"
 eor.101.d:0 "Tatsu asks his father to surrender the throne. Broad reformist support can secure a peaceful succession; weak support risks instability and a renewed military conspiracy."
 eor.101.a:0 "Secure a peaceful succession"
 eor.101.b:0 "Press ahead despite the opposition"
 eor.102.t:0 "The Shogunate Coup"
 eor.102.d:0 "Abandon the coup"
 eor.102.a:0 "Accept the peaceful transfer"
 eor.102.b:0 "Negotiate with the Imperial Court"
 eor.102.c:0 "Prepare an armed uprising"
 eor.103.t:0 "The Supreme Shogun"
 eor.103.d:0 "With the military government consolidated and a great rival defeated, the council honors Shinzo Nagama as Supreme Shogun. Civilian administration now bears the full cost of military supremacy."
 eor.103.a:0 "The Rule of the Shoguns"
 eor.104.t:0 "The World Grows Fearful"
 eor.104.d:0 "Imperial expansion has alarmed governments across the world. Our rivals are weighing cooperation against the Empire. We must decide whether to strike, divide them diplomatically, or fortify our position."
 eor.104.a:0 "Convene the General Staff"
 eor.105.t:0 "Imperial Diplomacy"
 eor.105.d:0 "An agreement with one rival may buy time and prevent a united front. Neither the Allies nor the Soviets will accept terms simply because we demand them. Diplomats now have authority to seek individual settlements."
 eor.105.a:0 "Authorize negotiations"
 eor.106.t:0 "The Sun Sets on the Old Empire"
 eor.106.d:0 "Defeat, severe unrest and a collapse of Imperial legitimacy have brought civilian reformers and overseas delegates together. They demand constitutional reconstruction and an end to colonial rule."
 eor.106.a:0 "Suppress the movement"
 eor.106.b:0 "Negotiate limited reforms"
 eor.106.c:0 "Support constitutional reconstruction"
 eor.107.t:0 "The Mandate Nears Collapse"
 eor.107.d:0 "Imperial legitimacy has fallen below thirty. Continuing repression, defeats or colonial unrest may open a constitutional crisis. The government can still seek reconciliation before the crisis becomes irreversible."
 eor.107.a:0 "Rally the Imperial loyalists"
 eor.107.b:0 "Hear the reformers"
 eor.108.t:0 "A Shogunate Counter-Conspiracy"
 eor.108.d:0 "Traditionalist officers have rallied around Shinzo as Tatsu challenges the old order. The government must either accommodate military concerns or reduce the conspirators’ influence."
 eor.108.a:0 "Offer military guarantees"
 eor.108.b:0 "Stand behind the reforms"
 eor.108.c:0 "Concede executive authority to the military"
 eor.109.t:0 "The Conspiracy Stands Down"
 eor.109.d:0 "Shinzo has abandoned the coup. The military will submit to the throne, and Yoshiro will resume the path of Imperial consolidation. Completed preparations remain part of the country’s history."
 eor.109.a:0 "Restore Imperial government"
 eor.110.t:0 "A Proposal from the Rising Sun"
 eor.110.d:0 "The Empire offers military consultation, economic cooperation and a regional partnership. China may accept, demand concessions, or reject this proposal."
 eor.110.a:0 "Accept the partnership"
 eor.110.b:0 "Demand economic concessions"
 eor.110.c:0 "Reject the Imperial offer"
 eor.111.t:0 "The Imperial Ultimatum"
 eor.111.d:0 "The Empire demands a Chinese protectorate. Submission avoids war at the price of sovereignty. Refusal leaves the Empire free to pursue its demands through war, without transferring a single state in advance."
 eor.111.a:0 "Accept the protectorate"
 eor.111.b:0 "China will not submit"
 eor.112.t:0 "The Colonial Question"
 eor.112.d:0 "The Reform Council offers a negotiated end to Imperial control. We may join a voluntary defensive partnership, seek independence outside it, or request further negotiations."
 eor.112.a:0 "Independence and a regional partnership"
 eor.112.b:0 "Independence without an alliance"
 eor.112.c:0 "Continue negotiations"
 eor.113.t:0 "The Asian Congress"
 eor.113.d:0 "The Reform Council invites independent regional governments to form a voluntary defensive community. Participation preserves sovereignty and supports shared development."
 eor.113.a:0 "Join the voluntary community"
 eor.113.b:0 "Maintain a separate course"
 eor.114.t:0 "A Strategic Settlement"
 eor.114.d:0 "Imperial diplomats propose a non-aggression settlement. Accepting can secure our borders, but will acknowledge the Empire as a major power. We will not be compelled to accept."
 eor.114.a:0 "Accept the settlement"
 eor.114.b:0 "Reject the proposal"
 EOR_bolster_imperial_legitimacy:0 "Rally Imperial Legitimacy"
 EOR_bolster_imperial_legitimacy_desc:0 "Spend 50 PP to raise Imperial Legitimacy by 10 and the Mandate by 5. Cooldown: 180 days."
 EOR_support_technocrats:0 "Support the Technocrats"
 EOR_support_technocrats_desc:0 "Spend 50 PP and 2% stability to raise technocratic influence by 10. Cooldown: 180 days."
 EOR_support_military_establishment:0 "Support the Military Establishment"
 EOR_support_military_establishment_desc:0 "Spend 50 PP to raise military influence by 10, reducing civilian legitimacy by 5. Cooldown: 180 days."
 EOR_hear_constitutional_reformers:0 "Hear the Constitutional Reformers"
 EOR_hear_constitutional_reformers_desc:0 "Before choosing a political route, spend 50 PP and 3% stability to support a reform movement and reduce Imperial legitimacy by 10. Severe unrest and defeat or domestic instability are still required to reveal New Dawn."
 EOR_colonial_administrative_review:0 "Review Colonial Demands"
 EOR_colonial_administrative_review_desc:0 "Spend 50 PP to reduce overseas pressure by 15 and improve current subject stability by 2%."
 EOR_intelligence_crisis_investigation:0 "Investigate the Imperial Crisis"
 EOR_intelligence_crisis_investigation_desc:0 "Spend 100 PP and reserve 3 civilian factories for 120 days. Once the war has escalated, the investigation can trigger the succession crisis without recovering Soviet time-travel evidence."
 EOR_negotiate_coup_transition:0 "Negotiate the Military Transition"
 EOR_negotiate_coup_transition_desc:0 "Spend 100 PP to raise military influence by 10. Once support reaches 70, a negotiated bloodless transfer becomes available. The armed route remains a costly alternative."
 EOR_diplomatic_concessions:0 "Authorize Diplomatic Concessions"
 EOR_diplomatic_concessions_desc:0 "Yoshiro or Shinzo can authorize pragmatic diplomacy for 100 PP and 5 points of military influence. This opens restricted cooperation without changing the chosen political route."
 EOR_civilian_industry_oversight:0 "Negotiate Civilian Industrial Oversight"
 EOR_civilian_industry_oversight_desc:0 "The Reform Council can retain state-directed industry after paying 150 PP and 3% stability to establish constitutional oversight."
 EOR_military_partnership_concessions:0 "Obtain Military Consent for Partnership"
 EOR_military_partnership_concessions_desc:0 "Shinzo can authorize overseas partnership after paying 100 PP and reducing military influence by 10."
 EOR_imperial_prestige_project:0 "Fund an Imperial Prestige Project"
 EOR_imperial_prestige_project_desc:0 "Spend 100 PP and reserve 3 civilian factories for 90 days to gain 5 Mandate and 5 legitimacy. Cooldown: 365 days."
 EOR_research_warrior:0 "Imperial Warrior Equipment"
 EOR_research_warrior_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to research this equipment, independently of the primary army doctrine."
 EOR_research_tsunami:0 "Tsunami Tank Equipment"
 EOR_research_tsunami_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to research this equipment, independently of the primary army doctrine."
 EOR_research_oni:0 "King Oni Equipment"
 EOR_research_oni_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to research this equipment, independently of the primary army doctrine."
 EOR_additional_project_omega:0 "Authorize an Additional Project Omega"
 EOR_additional_project_omega_desc:0 "Late-game exception: requires 60 military and 40 civilian factories. Spend 300 PP and reserve 8 civilian factories with a 10% factory-output penalty for 360 days. The program becomes available without completing its mutually exclusive primary focus."
 EOR_additional_project_executioner:0 "Authorize an Additional Shogun Executioner"
 EOR_additional_project_executioner_desc:0 "Late-game exception: requires 60 military and 40 civilian factories. Spend 300 PP and reserve 8 civilian factories with a 10% factory-output penalty for 360 days. The program becomes available without completing its mutually exclusive primary focus."
 EOR_additional_project_giga:0 "Authorize an Additional Giga Fortress"
 EOR_additional_project_giga_desc:0 "Late-game exception: requires 60 military and 40 civilian factories. Spend 300 PP and reserve 8 civilian factories with a 10% factory-output penalty for 360 days. The program becomes available without completing its mutually exclusive primary focus."
 EOR_renew_decolonization_talks:0 "Renew Independence Negotiations"
 EOR_renew_decolonization_talks_desc:0 "Spend 75 PP to resume overseas territorial handovers and reopen independence talks with current subjects. Available under the Reform Council. Handovers wait for full control, peace with the recipient and freedom from any third-party overlord; subject responses remain voluntary."
 EOR_renew_asian_congress:0 "Renew the Asian Congress"
 EOR_renew_asian_congress_desc:0 "Spend 75 PP to invite independent former subjects to the voluntary community again."
 EOR_renew_china_cooperation:0 "Renew Negotiations with China"
 EOR_renew_china_cooperation_desc:0 "Spend 75 PP to renew a rejected partnership offer. The Empire must not be at war with China; China remains free to refuse."
 EOR_seek_settlement_sov:0 "Seek a Settlement with the Soviet Union"
 EOR_seek_settlement_sov_desc:0 "Spend 100 PP to seek a negotiated non-aggression settlement. The recipient may refuse. Acceptance requires either more than 35% surrender progress, or peace with a secure, technologically established Empire. War invalidates a settlement for victory purposes."
 EOR_seek_settlement_usa:0 "Seek a Settlement with the United States"
 EOR_seek_settlement_usa_desc:0 "Spend 100 PP to seek a negotiated non-aggression settlement. The recipient may refuse. Acceptance requires either more than 35% surrender progress, or peace with a secure, technologically established Empire. War invalidates a settlement for victory purposes."
 EOR_seek_settlement_eng:0 "Seek a Settlement with Britain"
 EOR_seek_settlement_eng_desc:0 "Spend 100 PP to seek a negotiated non-aggression settlement. The recipient may refuse. Acceptance requires either more than 35% surrender progress, or peace with a secure, technologically established Empire. War invalidates a settlement for victory purposes."
