 EOR_subject_ins_imperial_energy_security_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Delivery requires the same recipient to remain an Imperial subject and retain ownership and control of the original project capital. If invalidated, no reward or refund is granted; the reservation expires on schedule."
 EOR_subject_ins_regional_naval_bases:0 "Regional Naval Bases — INS"
 EOR_subject_ins_regional_naval_bases_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Delivery requires the same recipient to remain an Imperial subject and retain ownership and control of the original project capital. If invalidated, no reward or refund is granted; the reservation expires on schedule."
 EOR_postwar_military:0 "Fund Military Administration"
 EOR_postwar_military_desc:0 "Spend 75 PP and reserve 3 civilian factories for 180 days. Under Shinzo, gain 3 percentage points of stability and a service program: naval supremacy gives 30 navy experience and 180 days of shipbuilding/repair support; army supremacy gives 30 army experience, 150 support equipment and 180 days of mobile planning. Annual authorization cooldown; a government change invalidates delivery without refund."
 EOR_reassert_civilian_authority:0 "Reassert Civilian Authority"
 EOR_reassert_civilian_authority_desc:0 "Spend 50 PP to reduce military influence by 10 and raise Imperial legitimacy by 5. This can stabilize civilian government, but a later poorly supported coup becomes more dangerous."
 EOR_shinzo:0 "Shinzo Nagama"
 EOR_military_ruler:0 "Supreme Military Administration"
 EOR_technical_minister:0 "Technocratic Advocate"
 EOR_military_minister:0 "Shogunate Advocate"
 EOR_imperial_decisions:0 "Court"
 EOR_strategic_settlement:0 "Strategic Settlement"
 EOR_asian_community:0 "Asian Community"
 EOR_LOYALISTS_neutrality:0 "Imperial Loyalists"
 EOR_LOYALISTS_neutrality_DEF:0 "Imperial Loyalists"
 EOR_LOYALISTS_neutrality_ADJ:0 "Imperial Loyalist"
 EOR_emperor_tatsu:0 "Emperor Tatsu"
 EOR_convene_the_imperial_court_desc:0 "The Emperor, crown prince and military establishment command different sources of authority. Hear their immediate proposals and open a scheduled court review that can begin the succession debate without defeat or war."
 EOR_convene_the_imperial_court_decisions_tt:0 "Unlocks a Scheduled Court Review: 75 PP and 60 days to open the succession debate while no route is selected. Yoshiro can consolidate directly; discoveries and defeat remain alternative crisis triggers. Also opens legitimacy, civilian-authority and emergency government decisions."
 EOR_the_crown_prince_decisions_tt:0 "Unlocks decisions: Support the Technocrats."
 EOR_the_emperors_shadow_desc:0 "Shinzo's officers have served the throne without receiving a voice equal to their power. Bring the military establishment into the court's deliberations, while recognizing that its ambitions may outgrow its loyalty."
 EOR_the_emperors_shadow_decisions_tt:0 "Unlocks decisions: Support the Military Establishment."
 EOR_establish_imperial_intelligence_desc:0 "The court cannot answer threats it cannot see. Organize an Imperial intelligence service to uncover foreign secrets, detect hostile agents and investigate the evidence behind the growing political crisis."
 EOR_establish_imperial_intelligence_decisions_tt:0 "Unlocks decisions: Investigate the Imperial Crisis."
 EOR_purge_the_doubters_desc:0 "Scientific skeptics and reformist advisors have challenged the foundations of Imperial rule. Remove their influence from the court, accepting the damage that a political purge will inflict on research and open debate."
 EOR_absolute_loyalty_desc:0 "An army divided in its allegiance cannot carry out the Emperor's will. Bind its institutions more closely to the throne, strengthening discipline while narrowing the government's political freedom."
 EOR_reconcile_the_court_desc:0 "Moderate critics can serve the dynasty without surrendering all their convictions. Negotiate either a technical advisory settlement or a joint service compact, preserving Tatsu's eligibility as an advisor and commander."
 EOR_the_emperors_sacred_will_desc:0 "Public loyalty must support practical national service. Authorize either a homeland equipment and manpower program or an overseas industrial prestige investment, sharing a yearly program allocation."
 EOR_the_emperors_sacred_will_decisions_tt:0 "Unlocks decisions: Fund an Imperial Prestige Project."
 EOR_sacred_offensive_desc:0 "The Emperor's supporters demand a decisive demonstration of strength. Prepare a period of concentrated offensive effort, accepting the additional supply burden that an ambitious advance will impose."
 EOR_warriors_of_destiny_desc:0 "Technology must serve the resolve of the soldiers who carry it into battle. Strengthen the infantry and special forces entrusted with the Emperor's offensive strategy."
 EOR_defend_the_homeland_desc:0 "The dynasty's first obligation is to preserve the country from which its authority flows. Concentrate the armed forces on the defense of Japan, even at the expense of operational mobility abroad."
 EOR_imperial_fortresses_desc:0 "Defensive doctrine needs engineers, concrete and protected industry. Fund two construction grants in selected homeland industrial regions, reserving civilian capacity while fortifications and air defenses are prepared."
 EOR_tatsu_assumes_command_desc:0 "The Empire's future cannot depend on inherited certainty alone. Entrust national leadership to Tatsu and begin replacing the old balance of court factions with government directed by scientific achievement."
 EOR_question_the_old_order_desc:0 "The institutions that secured Japan's rise may now be obstructing its progress. Permit a systematic challenge to inherited practices, gaining scientific freedom while disturbing the old political settlement."
 EOR_force_abdication_desc:0 "A new program cannot advance while the old Emperor retains the final word. Compel Yoshiro to abdicate and place Tatsu on the throne, accepting the immediate instability of a forced succession."
 EOR_a_new_emperor_desc:0 "Tatsu must establish authority as a ruler as well as an innovator. Build a government around the new Emperor's program while traditionalists organize against the manner of his accession."
 EOR_preserve_the_emperor_desc:0 "The throne can reassure traditionalists or participate in technical administration. Negotiate the terms of Yoshiro's preserved position, choosing ceremonial stability or a more ambitious scientific settlement with political risks."
 EOR_empower_the_technocrats_decisions_tt:0 "Unlocks decisions: Coordinate Technological Ministries."
 EOR_automated_warfare_desc:0 "Automated industry supports armored production through cheaper equipment and faster technical development. Fund armored contracts to equip formations, while accepting additional steel and supply costs without a direct reduction in battalion manpower requirements."
 EOR_robotic_legions_desc:0 "Experimental machines must become equipment that formations can maintain and deploy. Develop the industrial and technical base for mechanized forces and heavy robotic warfare."
 EOR_human_machine_doctrine_desc:0 "Technical superiority depends on trained troops as well as machines. Standardize mixed formations and authorize funded infantry and support-equipment contracts, strengthening the organization of a professional army."
 EOR_professional_armed_forces_desc:0 "Advanced equipment cannot compensate for confused orders and poorly trained formations. Establish a professional force whose planning and operational experience match its technological resources."
 EOR_the_military_conspiracy_desc:0 "Shinzo believes the court can no longer defend Japan. Organize a military challenge to its authority; strong military influence may secure a peaceful transfer, while weak support risks an armed loyalist response."
 EOR_proclaim_national_emergency_desc:0 "The military must present its intervention as an answer to an immediate national danger. Declare an emergency and rally support, accepting the instability created by suspending normal political restraints."
 EOR_the_shogunate_coup_desc:0 "Present the military ultimatum to the Imperial Court. Support within the armed forces determines whether Shinzo can negotiate a bloodless transfer or must confront an Imperial-loyalist rebellion; abandoning the attempt can restore Yoshiro."
 EOR_the_shogunate_coup_decisions_tt:0 "Unlocks decisions: Negotiate the Military Transition."
 EOR_bloodless_coup_desc:0 "Enough of the establishment has accepted the new balance of power to make open fighting unnecessary. Complete the negotiated transfer and place the military government in command of the state."
 EOR_march_on_tokyo_desc:0 "The court has refused to yield and loyalist officers are preparing resistance. Commit to an armed seizure of power, keeping Shinzo's government in EOR while an Imperial-loyalist faction takes up arms."
 EOR_crush_the_loyalists_desc:0 "The loyalist rebellion must be defeated before the new government can claim effective control. Finish the civil conflict and dismantle the armed opposition to Shinzo's rule."
 EOR_military_government_desc:0 "The seizure of power must become a functioning administration. Consolidate the military government and place the surviving institutions of state under its authority."
 EOR_army_supremacy_desc:0 "Continental campaigns require a government that gives the army first claim on strategic resources. Make land warfare the organizing priority of Shinzo's military settlement."
 EOR_the_land_shogunate_desc:0 "Shinzo's army commands must turn their political priority into sustained field readiness. Establish mobile logistics and authorize paid armored and support-equipment contracts with an operational preparation period."
 EOR_naval_supremacy_desc:0 "The Empire's survival depends on the sea lanes between its scattered territories. Give the navy priority in strategic planning and the allocation of military resources."
 EOR_the_oceanic_shogunate_desc:0 "A naval government must keep ships serviceable between operations. Coordinate fleet protection and authorize funded shipyard, repair and readiness programs before the next maritime campaign."
 EOR_the_imperial_war_plan_desc:0 "The armed services cannot pursue every objective at once. Establish a common war plan and choose the first theater to receive the Empire's concentrated effort."
 EOR_northern_thunder_desc:0 "The Soviet Far East offers a continental challenge to Imperial power. Give the northern campaign priority as our first major strategic commitment."
 EOR_pacific_storm_desc:0 "Allied sea power stands between the Empire and command of the Pacific. Make the oceanic struggle our first strategic priority and prepare its opening operations."
 EOR_consolidate_asia_desc:0 "Regional security must precede a distant confrontation with the superpowers. Choose consolidation in Asia as the Empire's first major strategic commitment."
 EOR_secure_the_far_east_desc:0 "A captured port is only the beginning of a stable continental position. Consolidate the Far Eastern campaign and strengthen the forces that must hold its approaches."
 EOR_regional_policy_desc:0 "Asia contains partners, dependencies and potential rivals whose interests cannot be reduced to a single war plan. Establish the framework for our regional policy."
 EOR_the_china_question_desc:0 "China must decide how it will respond to the Empire. Prepare either a consensual partnership or a coercive approach, preserving the accepted borders until ordinary diplomacy or war changes the relationship."
 EOR_cooperate_with_china_desc:0 "Cooperation requires Chinese consent rather than an Imperial declaration. Offer partnership; Chinese willingness responds to relative strength, shared enemies and existing faction commitments, while additional economic concessions require a separate Imperial decision."
 EOR_the_asian_accord_desc:0 "An accord has substance only if China agrees to cooperate. Establish reciprocal industrial research exchanges with the current Chinese partner, while strengthening diplomatic confidence between the two governments."
 EOR_joint_military_plan_desc:0 "Military access alone cannot coordinate two armies. Conduct joint staff exercises with the current Chinese partner, developing service experience and a temporary shared planning advantage."
 EOR_partners_in_asia_desc:0 "Independent partners need reciprocal arrangements suited to their relationship. Exchange limited electronics and armor research support with China, without admitting an independent country to the Imperial subject research group."
 EOR_subjugate_china_desc:0 "A continental campaign needs trained staff and specialist equipment before an ultimatum is delivered. Fund those preparations while accepting increased Imperial threat, then decide whether a refused demand should lead to ordinary war."
 EOR_imperial_ultimatum_desc:0 "Present China with the choice demanded by our policy of submission. Its government may accept dependency or refuse, in which case we must decide how to use the resulting war goal."
 EOR_the_chinese_campaign_desc:0 "A rejected demand requires practical military preparation rather than another copy of a war goal. Prepare a temporary China-specific offensive, while bypassing this stage if diplomacy has already secured the subject relationship."
 EOR_imperial_protectorate_desc:0 "A durable settlement needs industry and workable administration in territory actually controlled by its recipient. Build a civilian factory in the Chinese subject capital, or support reconstruction in an already owned Chinese core after annexation through normal war resolution."
 EOR_secure_southeast_asia_desc:0 "The southern approaches link the Empire to essential bases and resources. Prepare a regional security program that strengthens our position in Southeast Asia."
 EOR_reinforce_coprosperity_sphere_desc:0 "The sphere's members need coordination if they are to support a common strategy. Reinforce the institutions and military preparations that bind the existing regional system together."
 EOR_asian_strategic_resources_desc:0 "Regional influence is useful only if supplies can reach the factories and forces that need them. Improve access to the strategic resources on which an Asian campaign depends."
 EOR_establish_regional_supremacy_desc:0 "Our regional preparations must produce a position that can survive external pressure. Consolidate the strategic advantages gained through the Asian program."
 EOR_the_second_front_desc:0 "A wider war requires forces that can support simultaneous commitments. Organize the next front after the government has authorized a broader strategy."
 EOR_preemptive_strike_against_the_US_desc:0 "American intervention may become unavoidable as the war widens. Prepare an optional preemptive action, leaving the decision to declare war subject to the actual diplomatic situation."
 EOR_corporate_partnership_desc:0 "The zaibatsus can expand production through their own networks and technical expertise. Choose a cooperative industrial settlement that preserves corporate initiative under national strategic direction."
 EOR_industrial_autonomy_desc:0 "Corporate managers need room to organize production if partnership is to deliver results. Give the industrial combines greater operational autonomy within the agreed national program."
 EOR_corporate_innovation_desc:0 "Independent industrial laboratories can turn procurement demands into new processes. Support corporate research and development as the next stage of the partnership economy."
 EOR_the_zaibatsu_economy_desc:0 "The cooperative settlement must become a complete industrial system. Consolidate the zaibatsu economy before extending it into a national mobilization framework."
 EOR_state_control_desc:0 "Strategic production cannot be left to bargaining among private interests. Choose direct state oversight of the zaibatsus and bring industrial priorities under government authority."
 EOR_imperial_planning_desc:0 "State control requires a plan that factories can actually follow. Establish central production priorities and coordinate the allocation of industrial resources."
 EOR_nationalize_contracts_desc:0 "Private procurement arrangements must conform to the state's industrial program. Reorganize strategic contracts and make their obligations enforceable through public authority."
 EOR_synthetic_fuel_desc:0 "Imported oil may be interrupted at the moment it is most needed. Invest in synthetic-fuel research as the first step toward greater domestic energy security."
 EOR_refinery_network_desc:0 "Laboratory processes must be supported by practical refining capacity. Develop the infrastructure and expertise needed to sustain the synthetic-fuel program."
 EOR_resource_autarky_desc:0 "Domestic substitutes can reduce the leverage of foreign suppliers. Consolidate a policy of resource self-sufficiency while accepting its industrial and commercial trade-offs."
 EOR_overseas_extraction_desc:0 "The Empire's dependencies contain resources that domestic industry cannot easily replace. Make overseas extraction the central answer to our supply problem."
 EOR_resource_concessions_desc:0 "Resource concessions must produce material returns rather than another administrative permission. Add rubber in a controlled Malayan subject state and oil in a controlled Indonesian subject state, accepting higher overseas pressure."
 EOR_imperial_supply_desc:0 "Extraction is only useful when resources reach Imperial factories. Consolidate the overseas supply system and the administrative arrangements that support it."
 EOR_open_trade_desc:0 "Access to world markets may be more efficient than trying to produce everything at home. Choose commercial openness as the basis of resource security."
 EOR_commercial_access_desc:0 "Trade policy needs reliable relationships with external suppliers. Improve commercial access so that industry can obtain the materials it cannot source domestically."
 EOR_maritime_commerce_desc:0 "An open economy depends on shipping routes that remain usable in a crisis. Consolidate the maritime trading system while recognizing its exposure to naval disruption."
 EOR_kurikara_robotics_decisions_tt:0 "Unlocks decisions: King Oni Equipment."
 EOR_reform_the_imperial_army_desc:0 "The army must adapt its organization to the equipment now becoming available. Begin a common reform program before choosing the doctrine that will guide its specialized development."
 EOR_reform_the_imperial_army_decisions_tt:0 "Unlocks decisions: Convene the Imperial War Council."
 EOR_imperial_warrior_armaments_desc:0 "Modern infantry equipment must reach formations as well as drawing boards. Introduce Imperial Warrior production if necessary and deliver an initial equipment batch, even if the technology is already known."
 EOR_tankbuster_formations_desc:0 "Enemy armor cannot be left solely to our heaviest machines. Organize infantry anti-tank specialists and improve the ability of foot soldiers to threaten armored formations."
 EOR_rocket_angel_corps_desc:0 "Vertical mobility offers elite troops new ways to reach difficult objectives. Develop the airborne organization that represents Rocket Angel formations within our conventional forces."
 EOR_amphibious_armored_formations_desc:0 "Amphibious formations require tanks that can be produced and maintained. Introduce Tsunami technology if necessary and deliver an initial equipment batch, preserving value when another program has already unlocked it."
 EOR_the_tsunami_tank_desc:0 "The armored program needs a vehicle suited to the Empire's operational environment. Develop the Tsunami Tank as a principal weapon of the mechanized force."
 EOR_heavy_robotic_warfare_desc:0 "Some enemy positions demand firepower and protection beyond conventional armor. Extend the mechanized program into heavy robotic warfare."
 EOR_the_shadow_warriors_desc:0 "A smaller force can achieve disproportionate results through intelligence and precise action. Choose a doctrine centered on special operations, mobility and attacks against vulnerable targets."
 EOR_shinobi_intelligence_network_desc:0 "Special operations require information before they require force. Build the intelligence network that will identify targets and support Shinobi-style operations."
 EOR_rapid_deployment_doctrine_desc:0 "Opportunities disappear when specialist forces arrive too late. Improve deployment methods so that selected units can respond quickly to intelligence and battlefield openings."
 EOR_special_operations_command_desc:0 "Scattered specialist units need a headquarters able to plan and sustain their missions. Establish a command structure for the army's special operations program."
 EOR_strike_from_the_shadows_desc:0 "Special operations depend on command reserves and specialist equipment as well as doctrine. Supply support equipment and command capacity while strengthening the preparation of elite formations."
 EOR_imperial_naval_reform_desc:0 "The navy must decide how to turn advanced hulls into effective maritime power. Begin a common reform program before choosing battleships, carriers or submarine warfare as its main emphasis."
 EOR_shogun_battlefleet_desc:0 "Heavy surface ships can concentrate decisive firepower at sea and along hostile coasts. Choose a battlefleet doctrine centered on the Shogun battleship."
 EOR_advanced_naval_artillery_desc:0 "A battlefleet is only as effective as its guns and fire-control systems. Develop the naval artillery expertise needed for heavy surface combat."
 EOR_decisive_naval_battle_desc:0 "Heavy naval strength must be concentrated at the moment it can decide a campaign. Consolidate the battlefleet's doctrine for defeating an opposing fleet in a major engagement."
 EOR_carrier_fleet_desc:0 "Aircraft can extend naval power beyond the reach of heavy guns. Choose a carrier-centered doctrine and organize the fleet around its embarked air groups."
 EOR_imperial_carrier_modernization_desc:0 "Carrier operations depend on ships designed to sustain continuous flight activity. Modernize their equipment and operating practices to support the naval air program."
 EOR_tenzai_naval_aviation_desc:0 "Naval aircraft must be developed alongside the ships and crews that operate them. Bring Tenzai's expertise into a coordinated program for fleet aviation."
 EOR_mecha_tengu_squadrons_desc:0 "Land-based fighter squadrons can protect the fleet from nearby airfields. Deliver Tengu aircraft and train their crews, retaining the technology unlock as a fallback without promising carrier embarkation."
 EOR_air_sea_battle_doctrine_desc:0 "Carriers, aircraft and escorts must fight as a single system. Consolidate a doctrine that coordinates air strikes with the movement and protection of the fleet."
 EOR_submarine_warfare_desc:0 "The enemy's supply system may be more vulnerable than its battlefleet. Choose a naval doctrine that places submarines and commerce disruption at its center."
 EOR_advanced_yari_submarines_desc:0 "A submarine strategy needs crews and technology suited to sustained underwater operations. Develop the research and doctrine that represent the Yari program."
 EOR_torpedo_warfare_doctrine_desc:0 "Submarines must make each attack count before the enemy can respond. Improve torpedo tactics and the operational methods supporting underwater warfare."
 EOR_disrupt_enemy_commerce_desc:0 "The submarine force should threaten the movement of supplies across the ocean. Organize sustained attacks on enemy commerce and the shipping routes that sustain its war effort."
 EOR_the_silent_pacific_desc:0 "Submarines need trained staffs and safe maintenance cycles between patrols. Consolidate their defensive doctrine, gain naval experience and support fleet repair and withdrawal for six months."
 EOR_imperial_air_modernization_desc:0 "Advanced aircraft need an air force organized to use them effectively. Begin a common modernization program and choose whether air superiority or battlefield support will receive doctrinal priority."
 EOR_air_superiority_desc:0 "Our other forces cannot operate freely while hostile aircraft control the sky. Choose a fighter-centered doctrine that prioritizes winning the aerial contest."
 EOR_advanced_fighters_desc:0 "A successful fighter force must continue improving as enemy aircraft evolve. Extend the air-superiority program into the next generation of fighter development."
 EOR_dominate_the_skies_desc:0 "A mature fighter service needs reliable operations as well as agile aircraft. Upgrade the air-superiority doctrine into an integrated interception and mission-efficiency program, supported by temporary Tengu training."
 EOR_tactical_support_desc:0 "Air power can decide a land battle by striking where the army needs it most. Choose a doctrine centered on close cooperation with ground forces."
 EOR_close_air_support_desc:0 "Effective support depends on finding targets and coordinating attacks with friendly troops. Improve the methods that connect our ground-attack aircraft to the army's operations."
 EOR_support_the_army_desc:0 "Ground support succeeds when pilots and field formations share a practical doctrine. Upgrade the earlier tactical-support institution and fund a temporary Striker-VX training initiative for the air service."
 EOR_yuriko_omega_desc:0 "Omega's results must be concentrated in a single trained operative rather than dispersed among ordinary formations. Authorize Yuriko's specialized missions, each requiring preparation and sharing a recovery period."
 EOR_deploy_the_executioner_desc:0 "The prototype needs maintenance crews, supplies and a costly preparation effort. Authorize its construction as a ready asset, then activate the temporary Executioner operation separately when a war requires it."
 EOR_deploy_the_giga_fortress_desc:0 "The fortress requires substantial industrial and logistical support. Authorize paid preparation into a ready asset, then activate its temporary national operation separately during war and accept the long recovery afterward."
 EOR_imperial_administration_decisions_tt:0 "Unlocks decisions: Pacific Naval Research — IOT, Advanced Shipbuilding — IOT, Joint Military Laboratories — IOT, Southern Pacific Defense Network — IOT, Imperial Recruitment Centers — PHI, Naval Infrastructure — PHI, Pacific Logistics Command — PHI, Local Military Administration — PHI, Rubber Development — MAL, Industrial Expansion — MAL, Strategic Resource Export — MAL, Local Administrative Reform — MAL, Oil Development — INS, Maritime Infrastructure — INS, Imperial Energy Security — INS, Regional Naval Bases — INS."
 EOR_direct_imperial_rule_desc:0 "Centralization requires officials able to enforce the government's decisions. Extend direct administrative oversight across the existing dependencies and strengthen the institutions of control."
 EOR_resource_mobilization_desc:0 "A centralized administration can demand more coordinated access to strategic supplies. Organize the resource contribution of the sphere to support Imperial production."
 EOR_imperial_integration_desc:0 "The centralized policy must become a durable administrative system. Consolidate its institutions before expanding the shared logistics and development program."
 EOR_regional_autonomy_desc:0 "Local governments need practical authority if partnership is to be credible. Expand their administrative freedom within the cooperative regional settlement."
 EOR_joint_development_desc:0 "Partners need a reason to see regional cooperation as a shared investment. Establish development arrangements that improve the sphere's economic and technical prospects."
 EOR_asian_cooperation_desc:0 "Autonomy and joint investment must be supported by lasting institutions. Consolidate the cooperative settlement before extending the shared overseas infrastructure program."
 EOR_imperial_global_expansion_desc:0 "A wider campaign requires practical preparation across the armed services. Train army and naval staffs and support offensive logistics, while accepting that expansion increases the threat perceived by rival governments."
 EOR_the_world_grows_fearful_desc:0 "Our growing power is giving otherwise hostile governments a common concern. Assess the danger that Imperial expansion will unite rivals against us."
 EOR_the_coalition_crisis_desc:0 "The international response now requires a deliberate strategic choice. Prepare to confront a coalition through a preemptive offensive, diplomatic division or sustained defense."
 EOR_the_coalition_crisis_decisions_tt:0 "Unlocks decisions: Prepare Homeland Reserves."
 EOR_strike_first_desc:0 "A coalition may be weakest before its members complete their preparations. Choose an offensive response intended to seize the initiative before their cooperation matures."
 EOR_preemptive_war_desc:0 "An early offensive requires clear objectives and preparations suited to the intended targets. Develop the operational basis for a preemptive war while retaining control over its actual declaration."
 EOR_crush_the_coalition_desc:0 "The offensive strategy must be capable of breaking organized resistance. Consolidate preparations for defeating the coalition rather than merely disrupting its formation."
 EOR_exploit_rivalries_desc:0 "Our opponents' fear of the Empire does not erase their conflicting interests. Choose a diplomatic strategy aimed at widening those divisions."
 EOR_imperial_diplomacy_desc:0 "Rivalries become useful only when supported by credible negotiations. Strengthen the diplomatic machinery needed to pursue separate understandings with opposing powers."
 EOR_divide_our_enemies_desc:0 "Individual agreements require work beyond opening diplomatic channels. Authorize country-specific envoy preparations that improve a rival's willingness to accept a later eligible settlement request, while preserving its right to refuse."
 EOR_fortify_the_empire_desc:0 "The Empire may survive a wider war by making its positions too costly to attack. Choose a defensive strategy built around protected bases and sustained resistance."
 EOR_total_defense_desc:0 "A defensive strategy must organize industry and the armed services around endurance. Extend preparations from individual strongpoints to a national system of defense."
 EOR_war_of_attrition_desc:0 "A long war will test supply, replacement and political resolve. Consolidate the preparations needed to exhaust an opposing coalition without abandoning the Empire's core positions."
 EOR_a_world_beneath_the_emperor_desc:0 "The court needs a lasting division of responsibilities beneath Yoshiro’s throne. Consolidate the political settlement and authorize continuing administrative work while the normal struggle between states continues."
 EOR_a_world_beneath_the_emperor_decisions_tt:0 "Unlocks decisions: Postwar Imperial Administration."
 EOR_the_architect_of_tomorrow_desc:0 "Tatsu’s modernization program needs institutions that can outlast a single project. Establish continuing technical administration and authorize research investment as an ordinary policy of government."
 EOR_the_architect_of_tomorrow_decisions_tt:0 "Unlocks decisions: Postwar Scientific Development."
 EOR_the_rule_of_the_shoguns_desc:0 "Shinzo’s commands must translate military authority into everyday administration. Consolidate their responsibilities and authorize continuing institutional investment without prescribing how the wider war must end."
 EOR_the_rule_of_the_shoguns_decisions_tt:0 "Unlocks decisions: Postwar Military Administration."
 EOR_modernization_ascendancy:0 "Confidence in Modernization — High"
 EOR_military_ascendancy:0 "Military Authority — High"
 EOR_sacred_ascendancy:0 "Divine Mandate — High"
 EOR_modernization_confidence:0 "Confidence in Modernization — Secure"
 EOR_military_confidence:0 "Military Authority — Secure"
 EOR_sacred_confidence:0 "Divine Mandate — Secure"
 EOR_modernization_doubts:0 "Confidence in Modernization — Contested"
 EOR_military_doubts:0 "Military Authority — Contested"
 EOR_sacred_doubts:0 "Divine Mandate — Contested"
 EOR_modernization_crisis:0 "Confidence in Modernization — Low"
 EOR_military_crisis:0 "Military Authority — Low"
 EOR_sacred_crisis:0 "Divine Mandate — Low"
 EOR_modernization_shattered:0 "Confidence in Modernization — Broken"
 EOR_military_shattered:0 "Military Authority — Broken"
 EOR_sacred_shattered:0 "Divine Mandate — Broken"
 EOR_modernization_authority_desc:0 "Confidence in Tatsu’s technical administration follows institutional legitimacy. The thresholds are 20, 40, 60 and 80; only one authority tier applies. Sacred belief is retained as historical information and grants no separate tier."
 EOR_military_authority_desc:0 "Confidence in Shinzo’s governing command follows institutional legitimacy. The thresholds are 20, 40, 60 and 80; only one authority tier applies. The dynasty may retain a symbolic role without granting another authority tier."
 EOR_sacred_authority_desc:0 "Belief in Yoshiro’s sacred mission determines this tier. The thresholds are 20, 40, 60 and 80; institutional legitimacy separately controls political access and succession disputes."
 eor.40.investigation:0 "Suki’s completed investigation has authenticated Soviet research records describing an alteration of history. Yoshiro sees an attack on sacred destiny; Tatsu sees an Imperial future that only deliberate technical power can secure."
 eor.40.intercepts:0 "Suki’s analysts have cross-checked intercepted communications describing Soviet intervention in history. The origin of every document remains uncertain, but the central finding is verified. Yoshiro and Tatsu disagree about what it means for Imperial authority."
 eor.102.option_abandon:0 "Abandon the coup"
 eor.report_ack:0 "Acknowledge the report."
 EOR_operations_decisions:0 "Operations"
 EOR_operations_decisions_desc:0 "Military operations and Yuriko assignments. All Yuriko missions share one 180-day cooldown from authorization; each prepares for 30 days. Target eligibility is checked again at completion. Prepared great machines remain ready until separately activated during war. Active support and recovery prevent another preparation of the same asset."
 EOR_research_decisions:0 "Research and Prototypes"
 EOR_research_decisions_desc:0 "Central development reserves 3 civilian factories and is shared with civil and overseas investments. Procurement reserves a separate 3 factories. Grand projects reserve 8 factories and reduce factory output; only one can prepare at once. Active decisions show remaining preparation; investment spirits show reservations. Costs are sunk if a target becomes invalid."
 EOR_overseas_decisions:0 "Overseas Administration"
 EOR_diplomacy_decisions:0 "Diplomacy"
 eor.115.t:0 "Settlement Accepted"
 eor.115.d:0 "Suki confirms that the recipient has accepted a non-aggression pact and a one-year truce. The agreement changes diplomatic relations and does not declare a campaign result."
 eor.116.t:0 "Settlement Refused"
 eor.116.d:0 "Suki reports that the recipient has rejected the offer. The envoy’s costs are sunk and the refusal consumes an additional 25 political power."
 eor.117.t:0 "Rivals Agree Full Cooperation"
 eor.117.d:0 "Suki confirms that Soviet and Allied representatives have agreed operational cooperation. Their shared support may lead them to join an existing war against the Empire."
 eor.118.t:0 "Rivals Limit Their Cooperation"
 eor.118.d:0 "Suki reports that the rivals will coordinate preparations without accepting a full joint commitment. Their temporary support strengthens readiness."
 eor.119.t:0 "Coalition Talks Fail"
 eor.119.d:0 "Suki reports that the rivals have refused the proposed cooperation. No common operational agreement has been established."
 EOR_spirit_text_loyal_to_the_empire:0 "loyal_to_the_empire"
 EOR_spirit_text_loyal_to_the_empire_desc:0 "The local establishment accepts Imperial supervision and contributes resources to its overlord. These obligations end with the subject relationship."
 EOR_spirit_text_loyal_to_the_empire_forever:0 "loyal_to_the_empire_forever"
 EOR_spirit_text_loyal_to_the_empire_forever_desc:0 "Entrenched local officials bind administration to Imperial demands. Their exceptional obligations depend on continued subjection to the Empire."
 EOR_spirit_text_EOR_divine_emperor:0 "The Divine Emperor"
 EOR_spirit_text_EOR_divine_emperor_desc:0 "The throne binds military duty and public obedience to Yoshiro's claim of sacred destiny. Victories strengthen that conviction; a crisis of faith can shake the institutions that depend upon it."
 EOR_spirit_text_the_shogunate:0 "The Imperial Shogunate"
 EOR_spirit_text_the_shogunate_desc:0 "The shogunate connects military command to Imperial ministries. Its offices coordinate administration and the responsibilities of the armed services."
 EOR_spirit_text_EOR_technological_superiority:0 "Technological Superiority"
 EOR_spirit_text_EOR_technological_superiority_desc:0 "Advanced industrial laboratories sustain the Empire’s technical advantage. Their research supports equipment development across the armed services."
 EOR_spirit_text_traditional_zaibatsus:0 "Traditional Zaibatsus"
 EOR_spirit_text_traditional_zaibatsus_desc:0 "Established industrial combines dominate strategic procurement. Their traditional contracts shape factory output until a corporate or state settlement replaces them."
 EOR_spirit_text_EOR_imperial_resource_dependency:0 "Imperial Resource Dependency"
 EOR_spirit_text_EOR_imperial_resource_dependency_desc:0 "Advanced industry depends on overseas raw materials. Autarky, peaceful commerce, or completed Malayan and Indonesian resource programs can ease this burden; lost access restores it."
 EOR_spirit_text_EOR_coprosperity_administration:0 "The Co-Prosperity Sphere"
 EOR_spirit_text_EOR_coprosperity_administration_desc:0 "The overseas administration coordinates Imperial dependencies. Centralized extraction and cooperative investment offer different settlements; benefits follow current subject relationships."
 EOR_spirit_text_EOR_reinforced_shogunate:0 "Reinforced Shogunate"
 EOR_spirit_text_EOR_reinforced_shogunate_desc:0 "The shogunate coordinates officers and ministries beneath the throne. Reinforced institutions translate court authority into military discipline."
 EOR_spirit_text_EOR_eternal_empire:0 "The Eternal Empire"
 EOR_spirit_text_EOR_eternal_empire_desc:0 "Yoshiro’s court has established a durable political settlement. Public obedience and military service remain bound to the Emperor’s sacred mission."
 EOR_spirit_text_EOR_scientific_legitimacy:0 "Scientific Legitimacy"
 EOR_spirit_text_EOR_scientific_legitimacy_desc:0 "Technical achievement supplies a public argument for government authority. Laboratories and procurement offices gain standing alongside the older institutions of the court."
 EOR_spirit_text_EOR_scientific_shogunate:0 "The Scientific Shogunate"
 EOR_spirit_text_EOR_scientific_shogunate_desc:0 "Military command and scientific administration share responsibility for Imperial modernization. Their institutions coordinate research with the demands of the armed forces."
 EOR_spirit_text_EOR_empire_of_tomorrow:0 "The Empire of Tomorrow"
 EOR_spirit_text_EOR_empire_of_tomorrow_desc:0 "Tatsu’s ministries direct industrial and military modernization. The throne’s future is defended through technical achievement and organized administration."
 EOR_spirit_text_EOR_modern_shogunate:0 "The Modern Shogunate"
 EOR_spirit_text_EOR_modern_shogunate_desc:0 "The Shogunate shall retain its traditions while incorporating modern administrative principles and advanced military planning."
 EOR_spirit_text_EOR_one_empire_one_future:0 "One Empire, One Future"
 EOR_spirit_text_EOR_one_empire_one_future_desc:0 "The Empire has overcome its ideological divisions. Under the guidance of Emperor Yoshiro and Crown Prince Tatsu, tradition and technological innovation shall together secure Japan's future."
 EOR_spirit_text_EOR_supremacy_of_technology:0 "Supremacy of Technology"
 EOR_spirit_text_EOR_supremacy_of_technology_desc:0 "Scientific investment supports the Empire’s answer to larger rival economies. Research institutions coordinate advanced military development."
 EOR_spirit_text_EOR_the_nano_construction:0 "Nanoconstruction"
 EOR_spirit_text_EOR_the_nano_construction_desc:0 "Nanoconstruction teams apply institute research to paid state projects. Their methods support construction and repair without creating free mobile buildings."
 EOR_spirit_text_EOR_the_robotic_production:0 "Robotic Assembly"
 EOR_spirit_text_EOR_the_robotic_production_desc:0 "Robotic assembly coordinates factory output and production learning. Automated processes support the industrial workforce."
 EOR_spirit_text_EOR_nanotech_mainframe:0 "Nanotech Mainframe"
 EOR_spirit_text_EOR_nanotech_mainframe_desc:0 "The mainframe connects institute research with advanced manufacturing. It supplies the technical foundation for experimental programs."
 EOR_spirit_text_EOR_a_highly_mechanized_army:0 "A Highly Mechanized Army"
 EOR_spirit_text_EOR_a_highly_mechanized_army_desc:0 "Mechanized formations organize around armor and protected mobility. Their doctrine supports concentrated land operations."
 EOR_spirit_text_EOR_the_futuristic_bushido:0 "The Futuristic Bushido"
 EOR_spirit_text_EOR_the_futuristic_bushido_desc:0 "Elite infantry combine disciplined service with advanced weapons. Training and procurement institutions sustain their specialized role."
 EOR_spirit_text_EOR_landing_combat_scheme:0 "Landing Combat Scheme"
 EOR_spirit_text_EOR_landing_combat_scheme_desc:0 "Army staffs maintain shared procedures for amphibious landings. These institutions support every retained army doctrine."
 EOR_spirit_text_EOR_multiple_terrains_combat_support:0 "Multi-Terrain Combat Support"
 EOR_spirit_text_EOR_multiple_terrains_combat_support_desc:0 "Logistics specialists prepare formations for varied terrain. Their support reduces environmental and supply burdens inland."
 EOR_spirit_text_EOR_fortified_fleet:0 "The Fortified Fleet"
 EOR_spirit_text_EOR_fortified_fleet_desc:0 "Fleet engineers prioritize detection, repair and protection. Their work keeps capital ships effective under sustained pressure."
 EOR_spirit_text_EOR_imperial_centralization:0 "Imperial Centralization"
 EOR_spirit_text_EOR_imperial_centralization_desc:0 "Closer integration increases subject resource and manpower access. Administrative pressure rises monthly; demands and unrest can follow. Occupied non-core territories also face increased resistance."
 EOR_spirit_text_EOR_imperial_partnership:0 "Imperial Partnership"
 EOR_spirit_text_EOR_imperial_partnership_desc:0 "Autonomy and investment improve cooperation and subject stability while reducing immediate resource extraction. Benefits end when a country ceases to be an Imperial subject."
 EOR_spirit_text_EOR_court_coordination:0 "Council of Shoguns"
 EOR_spirit_text_EOR_court_coordination_desc:0 "The council coordinates the armed services with the Imperial Court. Shared planning reduces disputes over strategic priorities."
 EOR_spirit_text_EOR_crown_prince:0 "The Crown Prince"
 EOR_spirit_text_EOR_crown_prince_desc:0 "Tatsu maintains a public platform for technical modernization. His supporters link the court to industrial and military specialists."
 EOR_spirit_text_EOR_warriors:0 "Warriors of the Rising Sun"
 EOR_spirit_text_EOR_warriors_desc:0 "The warrior establishment combines disciplined service with modern weapons. Its institutions sustain the infantry formations of the Empire."
 EOR_spirit_text_EOR_guard:0 "The Emperor’s Personal Guard"
 EOR_spirit_text_EOR_guard_desc:0 "The personal guard protects the throne and its political institutions. Its privileges tie an elite military formation directly to Yoshiro’s authority."
 EOR_spirit_text_EOR_prince_speaks:0 "The Crown Prince Speaks"
 EOR_spirit_text_EOR_prince_speaks_desc:0 "Tatsu’s public intervention gives scientific administrators a stronger political voice. Technical reform now has an advocate within the dynasty."
 EOR_spirit_text_EOR_reformed_war_council:0 "Reformed War Council"
 EOR_spirit_text_EOR_reformed_war_council_desc:0 "A reorganized war council coordinates strategic planning across the services. Officers share responsibility for translating policy into operations."
 EOR_spirit_text_EOR_empowered_technocrats:0 "Empowered Technocrats"
 EOR_spirit_text_EOR_empowered_technocrats_desc:0 "Technical ministries have gained authority over research and production. Their specialists coordinate industrial learning with national procurement."
 EOR_spirit_text_EOR_scientific_administration:0 "Scientific Administration"
 EOR_spirit_text_EOR_scientific_administration_desc:0 "Scientific administrators connect laboratories, procurement and ministries. Their institutions support research as a continuing responsibility of government."
 EOR_spirit_text_EOR_accord:0 "The Imperial Accord"
 EOR_spirit_text_EOR_accord_desc:0 "The Imperial accord coordinates government and military priorities. Its institutions sustain cooperation among the participating administrations."
 EOR_spirit_text_EOR_innovation:0 "Tradition and Innovation"
 EOR_spirit_text_EOR_innovation_desc:0 "Court traditions accommodate technical experimentation. The settlement gives scientific work a place within existing Imperial institutions."
 EOR_spirit_text_EOR_reformed_court:0 "A Reformed Imperial Court"
 EOR_spirit_text_EOR_reformed_court_desc:0 "Technical counselors support Imperial research while bargaining over policy consumes political authority. The settlement preserves moderate advice within Yoshiro's court."
 EOR_spirit_text_EOR_siberian_logistics:0 "Siberian Logistics"
 EOR_spirit_text_EOR_siberian_logistics_desc:0 "Specialist supply organizations sustain operations across Siberia. They prepare formations for difficult distances and limited infrastructure."
 EOR_spirit_text_EOR_offensive_preparations:0 "Offensive Preparations"
 EOR_spirit_text_EOR_offensive_preparations_desc:0 "Staff officers have prepared an operational timetable and supply allocation. These temporary arrangements support the coming offensive."
 EOR_spirit_text_EOR_rapid_offensive:0 "Rapid Mechanized Offensive"
 EOR_spirit_text_EOR_rapid_offensive_desc:0 "Mechanized formations train for rapid concentration and exploitation. Their doctrine places speed and coordinated breakthroughs at the center of operations."
 EOR_spirit_text_EOR_capital_offensive:0 "Capital Offensive"
 EOR_spirit_text_EOR_capital_offensive_desc:0 "The general staff concentrates planning against a major enemy command center. Preparations improve offensive coordination for the designated campaign."
 EOR_spirit_text_EOR_urban_operations:0 "Urban Operations"
 EOR_spirit_text_EOR_urban_operations_desc:0 "Assault troops and engineers coordinate fighting in built-up areas. Their preparation supports operations against defended cities."
 EOR_spirit_text_EOR_black_tortoise_doctrine:0 "Floating Fortress Doctrine"
 EOR_spirit_text_EOR_black_tortoise_doctrine_desc:0 "Naval planning incorporates mobile fortress support. Range and protection guide the fleet’s use of its heaviest assets."
 EOR_spirit_text_EOR_pacific_fleet:0 "Challenge the Allied Fleet"
 EOR_spirit_text_EOR_pacific_fleet_desc:0 "The fleet concentrates against Allied naval power in the Pacific. Operational planning supports engagements across widely separated bases."
 EOR_spirit_text_EOR_secure_pacific:0 "Secure the Pacific"
 EOR_spirit_text_EOR_secure_pacific_desc:0 "Naval forces coordinate patrols and protected routes across the Pacific. Temporary support strengthens the campaign while it remains active."
 EOR_spirit_text_EOR_coalition_preparation:0 "Prepare for the Coalition"
 EOR_spirit_text_EOR_coalition_preparation_desc:0 "The general staff prepares for cooperation among rival great powers. Planning and defensive readiness anticipate a wider conflict."
 EOR_spirit_text_EOR_advanced_shipbuilding:0 "Advanced Imperial Shipbuilding"
 EOR_spirit_text_EOR_advanced_shipbuilding_desc:0 "Imperial shipyards coordinate modern hull construction and repair. Industrial expertise supports the fleet’s expansion."
 EOR_spirit_text_EOR_shogun_battleship:0 "Shogun Battleship Program"
 EOR_spirit_text_EOR_shogun_battleship_desc:0 "The Shogun program supports heavy naval artillery and battleship production. Its ships still require ordinary dockyard construction and resources."
 EOR_spirit_text_EOR_mecha_tengu_doctrine:0 "Mecha Tengu Operational Doctrine"
 EOR_spirit_text_EOR_mecha_tengu_doctrine_desc:0 "Land-based Tengu fighters coordinate air cover with the fleet. They operate from airfields; this doctrine does not make them carrier aircraft."
 EOR_spirit_text_EOR_striker_vx_doctrine:0 "Striker-VX Support Doctrine"
 EOR_spirit_text_EOR_striker_vx_doctrine_desc:0 "Dedicated Striker-VX aircraft support the army from land bases. Their doctrine coordinates ground attack without creating a transforming map unit."
 EOR_spirit_text_EOR_liberated_manpower:0 "Liberate the Manpower"
 EOR_spirit_text_EOR_liberated_manpower_desc:0 "Automation releases workers for other national responsibilities. Rapid labor reorganization also imposes social disruption."
 EOR_spirit_text_EOR_mobilization_law:0 "Imperial Mobilization Law"
 EOR_spirit_text_EOR_mobilization_law_desc:0 "The mobilization law coordinates manpower and industrial obligations. Its institutions make military production a continuing national priority."
 EOR_spirit_text_EOR_zaibatsu_dialogue:0 "Industrial Coordination"
 EOR_spirit_text_EOR_zaibatsu_dialogue_desc:0 "Procurement officials coordinate strategic contracts with industrial combines. Negotiated production priorities support military factory construction."
 EOR_spirit_text_EOR_first_amendment:0 "First Mobilization Amendment"
 EOR_spirit_text_EOR_first_amendment_desc:0 "Expanded industrial obligations support wartime factory output. The first amendment strengthens production within the mobilization system."
 EOR_spirit_text_EOR_second_amendment:0 "Second Mobilization Amendment"
 EOR_spirit_text_EOR_second_amendment_desc:0 "Further mobilization commitments support military industrial expansion. The second amendment extends the government’s factory-construction program."
 EOR_spirit_text_EOR_controlled_procurement:0 "Imperial Procurement"
 EOR_spirit_text_EOR_controlled_procurement_desc:0 "Imperial procurement offices coordinate military contracts and deliveries. Their supervision links industrial capacity to the armed services."
 EOR_spirit_text_EOR_logistics_network:0 "Imperial Logistics Network"
 EOR_spirit_text_EOR_logistics_network_desc:0 "A coordinated logistics network supports military supply. Its continuing benefits depend on the institutions that maintain the network."
 EOR_spirit_text_EOR_research_cooperation:0 "Imperial Research Cooperation"
 EOR_spirit_text_EOR_research_cooperation_desc:0 "Imperial research institutions coordinate shared technical work with current dependencies. Subject-only membership is removed when that relationship ends."
 EOR_spirit_text_EOR_research_surge:0 "Scientific Initiative"
 EOR_spirit_text_EOR_research_surge_desc:0 "A temporary scientific initiative concentrates specialists on urgent research. Its support expires when the funded program ends."
 EOR_spirit_text_EOR_political_secrecy:0 "The Burden of Secrecy"
 EOR_spirit_text_EOR_political_secrecy_desc:0 "The government restricts circulation of sensitive evidence. Maintaining secrecy consumes administrative effort and shapes political confidence."
 EOR_spirit_text_EOR_fleet_expansion:0 "Conventional Fleet Expansion"
 EOR_spirit_text_EOR_fleet_expansion_desc:0 "Shipyards receive temporary support for conventional fleet expansion. Hulls still require normal construction time, resources and crews."
 EOR_spirit_text_EOR_emergency_defense:0 "Emergency Homeland Mobilization"
 EOR_spirit_text_EOR_emergency_defense_desc:0 "Emergency arrangements mobilize personnel and defensive planning. Their temporary support strengthens the homeland during a military crisis."
 EOR_spirit_text_EOR_continuity:0 "Continuity of Imperial Government"
 EOR_spirit_text_EOR_continuity_desc:0 "Emergency offices preserve government coordination through disruption. Temporary continuity arrangements sustain authority while normal administration recovers."
 EOR_spirit_text_EOR_naval_withdrawal:0 "Preserve the Fleet"
 EOR_spirit_text_EOR_naval_withdrawal_desc:0 "The navy prioritizes preserving its surviving fleet. Defensive operating practices support withdrawal and recovery."
 EOR_spirit_text_EOR_project_investment:0 "Experimental Industrial Investment"
 EOR_spirit_text_EOR_project_investment_desc:0 "The grand-project bureau reserves eight civilian factories and diverts military output during preparation. Only one grand project can occupy this allocation at a time."
 EOR_spirit_text_EOR_nanocore_investment:0 "Nanocore Industrial Investment"
 EOR_spirit_text_EOR_nanocore_investment_desc:0 "The central development allocation reserves three civilian factories for the commitment shown in the decision list. Civil construction, research and overseas investments share this capacity; invalidated targets receive no delivery and paid costs are sunk."
 EOR_spirit_text_EOR_procurement_investment:0 "Military Procurement Investment"
 EOR_spirit_text_EOR_procurement_investment_desc:0 "Military procurement reserves three civilian factories while contracted equipment is assembled. This allocation is separate from central development and grand military projects."
 EOR_spirit_text_EOR_executioner:0 "Shogun Executioner Deployment"
 EOR_spirit_text_EOR_executioner_desc:0 "An Executioner operation supports army breakthroughs for sixty days. Its exceptional machinery places additional demands on supply and suffers prototype attrition."
 EOR_spirit_text_EOR_executioner_reliable:0 "Shogun Executioner Refined Prototype"
 EOR_spirit_text_EOR_executioner_reliable_desc:0 "Refined Executioner machinery supports army breakthroughs for sixty days. Better reliability reduces prototype losses, while the operation still consumes additional supplies."
 EOR_spirit_text_EOR_giga_fortress:0 "Giga Fortress Deployment"
 EOR_spirit_text_EOR_giga_fortress_desc:0 "The Giga Fortress operation concentrates naval and air support for ninety days. Its strategic reach demands additional fuel; it is represented by a temporary national operation."
 EOR_spirit_text_EOR_black_tortoise:0 "Black Tortoise Support"
 EOR_spirit_text_EOR_black_tortoise_desc:0 "Black Tortoise support extends naval operating range and convoy protection for one hundred and eighty days. The floating fortress is represented through operational support."
 EOR_spirit_text_EOR_psionic_command_disruption:0 "Psionic Command Disruption"
 EOR_spirit_text_EOR_psionic_command_disruption_desc:0 "Hostile command networks are suffering a temporary psionic disruption. Planning and unit coordination remain impaired until its effects expire."
 EOR_spirit_text_EOR_omega_counterintelligence:0 "Yuriko: Counterintelligence"
 EOR_spirit_text_EOR_omega_counterintelligence_desc:0 "Yuriko protects sensitive research and command information against hostile operatives. The protective assignment lasts sixty days and uses her shared mission cooldown."
 EOR_spirit_text_EOR_postwar_science:0 "Continuing Technical Research"
 EOR_spirit_text_EOR_postwar_science_desc:0 "Technical ministries coordinate long-term research and industrial learning. Their program follows the consolidation of Tatsu’s government and does not require a special victory."
 EOR_spirit_text_EOR_post_defeat:0 "Collapse of the Shogunate"
 EOR_spirit_text_EOR_post_defeat_desc:0 "Military defeat has disrupted the shogunate’s institutions. Reconstruction can remove these penalties after the government regains its footing."
 EOR_spirit_text_EOR_imperial_resistance:0 "Imperial Resistance"
 EOR_spirit_text_EOR_imperial_resistance_desc:0 "Surviving institutions organize continued resistance after defeat. Their support strengthens homeland defense without spawning a new army."
 EOR_spirit_text_EOR_coalition_cooperation:0 "Anti-Imperial Cooperation"
 EOR_spirit_text_EOR_coalition_cooperation_desc:0 "Rival powers share operational support against Imperial expansion. The temporary agreement improves their capacity to cooperate."
 EOR_spirit_text_EOR_subject_centralized:0 "Imperial Administrative Pressure"
 EOR_spirit_text_EOR_subject_centralized_desc:0 "Imperial officials direct local administration toward the requirements of the overlord. These obligations apply while the country remains an Imperial subject."
 EOR_spirit_text_EOR_subject_partnership:0 "Imperial Partnership Administration"
 EOR_spirit_text_EOR_subject_partnership_desc:0 "Local institutions participate in an Imperial investment partnership. Cooperation improves administration while this country remains an Imperial subject."
 EOR_spirit_text_EOR_subject_concessions:0 "Limited Imperial Concessions"
 EOR_spirit_text_EOR_subject_concessions_desc:0 "Negotiated concessions ease the burden of Imperial rule. Their temporary benefits end if the subject relationship ends."
 EOR_spirit_text_EOR_subject_security:0 "Imperial Security Deployment"
 EOR_spirit_text_EOR_subject_security_desc:0 "Imperial security personnel reinforce local authority. This temporary deployment depends on the country remaining an Imperial subject."
 EOR_spirit_text_EOR_subject_resentment:0 "Resentment of Imperial Security"
 EOR_spirit_text_EOR_subject_resentment_desc:0 "Imperial security measures have provoked resentment among local institutions and communities. This penalty belongs to the subject relationship and ends with it."
 EOR_spirit_text_EOR_subject_development:0 "Imperial Development Assistance"
 EOR_spirit_text_EOR_subject_development_desc:0 "Imperial development assistance supports the local economy. The temporary program ends when the recipient ceases to be an Imperial subject."
 EOR_spirit_text_EOR_subject_resource_access:0 "Imperial Resource Agreement"
 EOR_spirit_text_EOR_subject_resource_access_desc:0 "A negotiated resource agreement supports the Imperial supply network. Its benefits depend on the current subject relationship."
 EOR_spirit_text_EOR_mandate_ascendancy:0 "[GetEORAuthorityAscendancy]"
 EOR_spirit_text_EOR_mandate_ascendancy_desc:0 "[GetEORAuthorityDescription]"
 EOR_spirit_text_EOR_mandate_confidence:0 "[GetEORAuthorityConfidence]"
 EOR_spirit_text_EOR_mandate_confidence_desc:0 "[GetEORAuthorityDescription]"
 EOR_spirit_text_EOR_mandate_doubts:0 "[GetEORAuthorityDoubts]"
 EOR_spirit_text_EOR_mandate_doubts_desc:0 "[GetEORAuthorityDescription]"
 EOR_spirit_text_EOR_mandate_crisis:0 "[GetEORAuthorityCrisis]"
 EOR_spirit_text_EOR_mandate_crisis_desc:0 "[GetEORAuthorityDescription]"
 EOR_spirit_text_EOR_mandate_shattered:0 "[GetEORAuthorityShattered]"
 EOR_spirit_text_EOR_mandate_shattered_desc:0 "[GetEORAuthorityDescription]"
 EOR_spirit_text_EOR_research_program:0 "Imperial Research Program"
 EOR_spirit_text_EOR_research_program_desc:0 "A national research program coordinates technical priorities. Sustained funding supports the Empire’s laboratories and military developers."
 EOR_spirit_text_EOR_institute_funding:0 "Imperial Weaponry Institute Funding"
 EOR_spirit_text_EOR_institute_funding_desc:0 "The Weaponry Institute receives continuing support for military research. Its staff connect experimental science with the needs of production."
 EOR_spirit_text_EOR_v2_establish_imperial_intelligence:0 "Imperial Intelligence Bureau"
 EOR_spirit_text_EOR_v2_establish_imperial_intelligence_desc:0 "The intelligence bureau compares military reporting with intercepted communications. Its staff protect sensitive programs and support decryption."
 EOR_spirit_text_EOR_v2_restore_imperial_authority:0 "Restored Imperial Authority"
 EOR_spirit_text_EOR_v2_restore_imperial_authority_desc:0 "Consolidated Imperial offices coordinate political authority and mobilization. Their responsibilities combine the restored administration with the former unity program."
 EOR_spirit_text_EOR_v2_scientific_purge:0 "The Scientific Purge"
 EOR_spirit_text_EOR_v2_scientific_purge_desc:0 "Scientific skeptics have been removed from positions of influence. The purge protects orthodoxy while damaging research and political cooperation."
 EOR_spirit_text_EOR_v2_absolute_loyalty:0 "Absolute Loyalty"
 EOR_spirit_text_EOR_v2_absolute_loyalty_desc:0 "Military institutions demand obedience to the throne. Discipline strengthens organization while consuming political effort."
 EOR_spirit_text_EOR_v2_imperial_unity:0 "Imperial Unity"
 EOR_spirit_text_EOR_v2_imperial_unity_desc:0 "The court has reconciled competing loyalist institutions. Their cooperation broadens the manpower available for service."
 EOR_spirit_text_EOR_v2_sacred_offensive:0 "The Sacred Offensive"
 EOR_spirit_text_EOR_v2_sacred_offensive_desc:0 "A sacred offensive concentrates military effort around Yoshiro’s public mission. The temporary attack advantage increases supply demands."
 EOR_spirit_text_EOR_v2_defend_the_homeland:0 "Defend the Sacred Homeland"
 EOR_spirit_text_EOR_v2_defend_the_homeland_desc:0 "Homeland defense institutions prioritize positions on Imperial cores. Their defensive advantage comes at the expense of movement."
 EOR_spirit_text_EOR_v2_warriors_of_destiny:0 "Warriors of Destiny"
 EOR_spirit_text_EOR_v2_warriors_of_destiny_desc:0 "Elite infantry and special forces embody the court’s military ideal. Their training strengthens attacks without restricting common equipment access."
 EOR_spirit_text_EOR_v2_imperial_fortresses:0 "Imperial Fortresses"
 EOR_spirit_text_EOR_v2_imperial_fortresses_desc:0 "Military engineers maintain a program of protected homeland positions. Fortifications reinforce defensive operations on Imperial cores."
 EOR_spirit_text_EOR_v2_question_the_old_order:0 "Question the Old Order"
 EOR_spirit_text_EOR_v2_question_the_old_order_desc:0 "Technical officials challenge inherited political assumptions. Research gains influence while public institutions absorb the resulting instability."
 EOR_spirit_text_EOR_v2_abdication_instability:0 "The Abdication Crisis"
 EOR_spirit_text_EOR_v2_abdication_instability_desc:0 "The forced abdication has unsettled the court and public administration. This temporary crisis reflects the political cost of succession."
 EOR_spirit_text_EOR_v2_a_new_emperor:0 "A New Emperor"
 EOR_spirit_text_EOR_v2_a_new_emperor_desc:0 "Tatsu rules through a new Imperial settlement. His political authority grows while unresolved opposition continues to burden stability."
 EOR_spirit_text_EOR_v2_the_silent_throne:0 "The Silent Throne"
 EOR_spirit_text_EOR_v2_the_silent_throne_desc:0 "Yoshiro's ceremonial position reassures traditional institutions while Tatsu directs government. The settlement supports stability and political administration."
 EOR_spirit_text_EOR_v2_empower_the_technocrats:0 "Empowered Technocrats"
 EOR_spirit_text_EOR_v2_empower_the_technocrats_desc:0 "Technical specialists coordinate production learning and advanced research. Their ministries institutionalize Tatsu’s modernization program."
 EOR_spirit_text_EOR_v2_automated_warfare:0 "Automated Warfare"
 EOR_spirit_text_EOR_v2_automated_warfare_desc:0 "Automated production supports armored warfare at lower construction cost. Its output demands additional steel and supplies."
 EOR_spirit_text_EOR_v2_human_machine_doctrine:0 "Human-Machine Doctrine"
 EOR_spirit_text_EOR_v2_human_machine_doctrine_desc:0 "Professional troops operate alongside advanced machinery. Standardized procurement and training support their organization."
 EOR_spirit_text_EOR_v2_robotic_legions:0 "Robotic Legions"
 EOR_spirit_text_EOR_v2_robotic_legions_desc:0 "Robotic formations coordinate armored assaults. Their operating doctrine concentrates heavy firepower against defended positions."
 EOR_spirit_text_EOR_v2_professional_armed_forces:0 "Professional Armed Forces"
 EOR_spirit_text_EOR_v2_professional_armed_forces_desc:0 "A professional staff coordinates military planning and supply. Service institutions emphasize sustained readiness over improvised mobilization."
 EOR_spirit_text_EOR_v2_army_supremacy:0 "Army Supremacy"
 EOR_spirit_text_EOR_v2_army_supremacy_desc:0 "The army takes priority in industrial planning. Land-force production and organization improve at the expense of dockyard output."
 EOR_spirit_text_EOR_v2_naval_supremacy:0 "Naval Supremacy"
 EOR_spirit_text_EOR_v2_naval_supremacy_desc:0 "The navy directs strategic procurement. Dockyards and amphibious operations gain support while military factory output bears the cost."
 EOR_spirit_text_EOR_v2_the_land_shogunate:0 "The Land Shogunate"
 EOR_spirit_text_EOR_v2_the_land_shogunate_desc:0 "Shinzo’s land commands coordinate mobile warfare and supply. The military settlement prioritizes the practical needs of field formations."
 EOR_spirit_text_EOR_v2_the_oceanic_shogunate:0 "The Oceanic Shogunate"
 EOR_spirit_text_EOR_v2_the_oceanic_shogunate_desc:0 "Shinzo’s naval commands coordinate protected fleet operations and landings. The military settlement prioritizes maritime campaigning."
 EOR_spirit_text_EOR_v2_supreme_shogunate:0 "The Supreme Shogunate"
 EOR_spirit_text_EOR_v2_supreme_shogunate_desc:0 "The armed services dominate national administration under Shinzo. Military output and organization gain strength while civilian stability and research bear the cost."
 EOR_spirit_text_EOR_v2_secure_the_far_east:0 "Far Eastern Logistics"
 EOR_spirit_text_EOR_v2_secure_the_far_east_desc:0 "Forward supply organizations consolidate the Far Eastern campaign. Their support reduces the supply burden of military operations."
 EOR_spirit_text_EOR_cooperative_zaibatsus:0 "Corporate Partnership"
 EOR_spirit_text_EOR_cooperative_zaibatsus_desc:0 "Corporate laboratories and factories retain initiative within national procurement. Research and output improve, while bargaining with the industrial combines consumes political authority."
 EOR_spirit_text_EOR_v2_industrial_autonomy:0 "Industrial Autonomy"
 EOR_spirit_text_EOR_v2_industrial_autonomy_desc:0 "Industrial combines retain discretion within strategic contracts. Production learning improves while political bargaining continues to consume authority."
 EOR_spirit_text_EOR_controlled_zaibatsus:0 "State-Controlled Industry"
 EOR_spirit_text_EOR_controlled_zaibatsus_desc:0 "The state directs strategic industrial contracts and factory expansion. Tighter control raises output but burdens consumers and independent research."
 EOR_spirit_text_EOR_v2_imperial_planning:0 "Imperial Planning"
 EOR_spirit_text_EOR_v2_imperial_planning_desc:0 "State planning coordinates factory learning and infrastructure development. Public institutions supervise the industrial settlement."
 EOR_spirit_text_EOR_v2_resource_autarky:0 "Resource Autarky"
 EOR_spirit_text_EOR_v2_resource_autarky_desc:0 "Synthetic production and refining reduce reliance on imported fuel. Domestic security requires an additional consumer burden."
 EOR_spirit_text_EOR_v2_overseas_extraction:0 "Overseas Extraction"
 EOR_spirit_text_EOR_v2_overseas_extraction_desc:0 "Imperial procurement draws resources from overseas dependencies. Favorable access consumes political authority and contributes to administrative pressure."
 EOR_spirit_text_EOR_v2_imperial_supply:0 "Imperial Supply"
 EOR_spirit_text_EOR_v2_imperial_supply_desc:0 "Supply offices coordinate protected shipping routes. Logistics and convoy escorts support the overseas resource network."
 EOR_spirit_text_EOR_v2_open_trade:0 "Open Trade"
 EOR_spirit_text_EOR_v2_open_trade_desc:0 "Commercial agreements improve access to international resources. Peaceful markets support the political case for economic openness."
 EOR_spirit_text_EOR_v2_maritime_commerce:0 "Maritime Commerce"
 EOR_spirit_text_EOR_v2_maritime_commerce_desc:0 "Protected trade routes connect Imperial industry to world markets. Escort coordination and dockyard support sustain commercial access."
 EOR_spirit_text_EOR_v2_trade_disruption:0 "Maritime Trade Disruption"
 EOR_spirit_text_EOR_v2_trade_disruption_desc:0 "War with a principal trading power has disrupted commercial access. Industry and fuel supply remain under pressure while that conflict continues."
 EOR_spirit_text_EOR_v2_the_futuristic_bushido:0 "Futuristic Bushido"
 EOR_spirit_text_EOR_v2_the_futuristic_bushido_desc:0 "Elite infantry combine disciplined service with advanced weapons. Training and procurement institutions sustain their specialized role."
 EOR_spirit_text_EOR_v2_warriors_of_the_rising_sun:0 "Warriors of the Rising Sun"
 EOR_spirit_text_EOR_v2_warriors_of_the_rising_sun_desc:0 "Infantry formations maintain a coordinated assault doctrine. Their institutions strengthen the army’s offensive performance."
 EOR_spirit_text_EOR_v2_a_highly_mechanized_army:0 "Mechanized Warfare"
 EOR_spirit_text_EOR_v2_a_highly_mechanized_army_desc:0 "Mechanized formations organize around armor and protected mobility. Their doctrine supports concentrated land operations."
 EOR_spirit_text_EOR_v2_the_shadow_warriors:0 "Asymmetric Warfare"
 EOR_spirit_text_EOR_v2_the_shadow_warriors_desc:0 "Specialist formations coordinate intelligence and precise attacks. Their doctrine supports operations against exposed enemy systems."
 EOR_spirit_text_EOR_v2_shinobi_intelligence_network:0 "Shinobi Intelligence Network"
 EOR_spirit_text_EOR_v2_shinobi_intelligence_network_desc:0 "Shinobi networks connect intelligence collection with special operations. Their institutions support preparation and operational security."
 EOR_spirit_text_EOR_v2_rapid_deployment_doctrine:0 "Rapid Deployment Doctrine"
 EOR_spirit_text_EOR_v2_rapid_deployment_doctrine_desc:0 "Specialist formations prepare to concentrate quickly. Their operating doctrine supports rapid deployment and mobile action."
 EOR_spirit_text_EOR_v2_strike_from_the_shadows:0 "Strike from the Shadows"
 EOR_spirit_text_EOR_v2_strike_from_the_shadows_desc:0 "Special operations commands coordinate attacks against vulnerable positions. Their doctrine rewards preparation and concentrated action."
 EOR_spirit_text_EOR_v2_shogun_battlefleet:0 "Shogun Battlefleet"
 EOR_spirit_text_EOR_v2_shogun_battlefleet_desc:0 "The fleet concentrates heavy ships around decisive surface engagements. Its doctrine supports battleship firepower and protection."
 EOR_spirit_text_EOR_v2_decisive_naval_battle:0 "Decisive Naval Battle"
 EOR_spirit_text_EOR_v2_decisive_naval_battle_desc:0 "Naval commands concentrate for a decisive engagement. Their doctrine coordinates fleet attacks and heavy surface forces."
 EOR_spirit_text_EOR_v2_carrier_fleet:0 "Carrier Fleet"
 EOR_spirit_text_EOR_v2_carrier_fleet_desc:0 "Carrier forces coordinate conventional embarked aircraft with fleet operations. Dedicated Tengu fighters provide land-based cover from airfields."
 EOR_spirit_text_EOR_v2_tenzai_naval_aviation:0 "Tenzai Naval Aviation"
 EOR_spirit_text_EOR_v2_tenzai_naval_aviation_desc:0 "Naval aviation offices coordinate technical development with fleet requirements. Their work supports conventional carrier aircraft and land-based air cover."
 EOR_spirit_text_EOR_v2_air_sea_battle_doctrine:0 "Air-Sea Battle Doctrine"
 EOR_spirit_text_EOR_v2_air_sea_battle_doctrine_desc:0 "Naval and air commands share operational planning. Land-based Tengu cover complements conventional fleet aviation."
 EOR_spirit_text_EOR_v2_submarine_warfare:0 "Submarine Warfare"
 EOR_spirit_text_EOR_v2_submarine_warfare_desc:0 "Submarine commands concentrate against enemy shipping. Their doctrine supports concealed attacks on maritime supply routes."
 EOR_spirit_text_EOR_v2_torpedo_warfare_doctrine:0 "Torpedo Warfare Doctrine"
 EOR_spirit_text_EOR_v2_torpedo_warfare_doctrine_desc:0 "Submarine crews coordinate torpedo attacks and target selection. Specialized training supports their offensive role."
 EOR_spirit_text_EOR_v2_disrupt_enemy_commerce:0 "Disrupt Enemy Commerce"
 EOR_spirit_text_EOR_v2_disrupt_enemy_commerce_desc:0 "Submarine commands prioritize merchant routes and supply traffic. Their doctrine sustains pressure on enemy commerce."
 EOR_spirit_text_EOR_v2_the_silent_pacific:0 "The Silent Pacific"
 EOR_spirit_text_EOR_v2_the_silent_pacific_desc:0 "Submarine patrols coordinate a sustained Pacific campaign. Concealed operations threaten shipping across the theater."
 EOR_spirit_text_EOR_v2_air_superiority:0 "Air Superiority"
 EOR_spirit_text_EOR_v2_air_superiority_desc:0 "Fighter commands prioritize control of contested skies. Their doctrine supports air combat independently of the common equipment program."
 EOR_spirit_text_EOR_v2_dominate_the_skies:0 "Dominate the Skies"
 EOR_spirit_text_EOR_v2_dominate_the_skies_desc:0 "An integrated fighter service combines air superiority, interception and reliable mission execution. This institution supersedes the earlier air-superiority program."
 EOR_spirit_text_EOR_v2_tactical_support:0 "Tactical Support"
 EOR_spirit_text_EOR_v2_tactical_support_desc:0 "Ground-attack commands coordinate closely with army formations. Their doctrine supports battlefield air operations."
 EOR_spirit_text_EOR_v2_support_the_army:0 "Support the Army"
 EOR_spirit_text_EOR_v2_support_the_army_desc:0 "An integrated ground-support service coordinates pilots, formations and operational experience. This institution supersedes the earlier tactical-support program."
 EOR_spirit_text_EOR_v2_resource_mobilization:0 "Imperial Resource Mobilization"
 EOR_spirit_text_EOR_v2_resource_mobilization_desc:0 "Imperial offices mobilize overseas resources for national procurement. The policy depends on continued administrative control of dependencies."
 EOR_spirit_text_EOR_v2_fortify_the_empire:0 "Fortify the Empire"
 EOR_spirit_text_EOR_v2_fortify_the_empire_desc:0 "Military planning prioritizes protected bases and defensive positions. Its institutions prepare the Empire for prolonged pressure."
 EOR_spirit_text_EOR_v2_total_defense:0 "Total Defense"
 EOR_spirit_text_EOR_v2_total_defense_desc:0 "Defense planning coordinates military institutions across threatened regions. National preparations support a sustained defensive campaign."
 EOR_spirit_text_EOR_v2_war_of_attrition:0 "War of Attrition"
 EOR_spirit_text_EOR_v2_war_of_attrition_desc:0 "Commanders organize for prolonged resistance and recovery. Their doctrine sustains operations when a rapid conclusion is unavailable."
 EOR_activate_executioner:0 "Activate the Shogun Executioner"
 EOR_activate_executioner_desc:0 "Consume the prepared asset during war for 60 days of national operational support. Recovery lasts a further 365 days after the active period. No second preparation can begin during readiness, activation or recovery."
 eor.120.t:0 "Shogun Executioner Ready"
 eor.120.d:0 "Kenji reports that the Shogun Executioner preparation is complete. Naomi has withheld the operational order until the fleet and army can coordinate. The industrial reservation is released; the asset can wait ready without upkeep until a separate wartime activation."
 eor.123.t:0 "Shogun Executioner Activated"
 eor.123.d:0 "Shinzo confirms activation of the Shogun Executioner operation. Its national support lasts 60 days, followed by 365 days of recovery. Normal forces carry out the fighting; no giant map unit has been created."
 EOR_activate_giga_fortress:0 "Activate the Giga Fortress"
 EOR_activate_giga_fortress_desc:0 "Consume the prepared asset during war for 90 days of national operational support. Recovery lasts a further 540 days after the active period. No second preparation can begin during readiness, activation or recovery."
 eor.121.t:0 "Giga Fortress Ready"
 eor.121.d:0 "Kenji reports that the Giga Fortress preparation is complete. Naomi has withheld the operational order until the fleet and army can coordinate. The industrial reservation is released; the asset can wait ready without upkeep until a separate wartime activation."
 eor.124.t:0 "Giga Fortress Activated"
 eor.124.d:0 "Shinzo confirms activation of the Giga Fortress operation. Its national support lasts 90 days, followed by 540 days of recovery. Normal forces carry out the fighting; no giant map unit has been created."
 EOR_activate_black_tortoise:0 "Activate the Black Tortoise"
 EOR_activate_black_tortoise_desc:0 "Consume the prepared asset during war for 180 days of national operational support. Recovery lasts a further 365 days after the active period. No second preparation can begin during readiness, activation or recovery."
 eor.122.t:0 "Black Tortoise Ready"
 eor.122.d:0 "Kenji reports that the Black Tortoise preparation is complete. Naomi has withheld the operational order until the fleet and army can coordinate. The industrial reservation is released; the asset can wait ready without upkeep until a separate wartime activation."
 eor.125.t:0 "Black Tortoise Activated"
 eor.125.d:0 "Shinzo confirms activation of the Black Tortoise operation. Its national support lasts 180 days, followed by 365 days of recovery. Normal forces carry out the fighting; no giant map unit has been created."
 eor.130.t:0 "Yuriko: Foothold Supported"
 eor.130.d:0 "The selected enemy-owned foothold remains under Imperial control. Yuriko’s support improves local organization recovery and breakthrough against that enemy for thirty days."
 eor.134.t:0 "Yuriko: Assignment Invalidated"
 eor.134.d:0 "Suki reports that the assignment’s target conditions no longer hold. No mission benefit has been applied. The authorization cost and shared cooldown remain spent."
 eor.131.t:0 "Yuriko: Command Disrupted"
 eor.131.d:0 "The selected country remains an enemy. Yuriko’s command disruption reduces planning speed and organization for thirty days."
 eor.135.t:0 "Yuriko: Assignment Invalidated"
 eor.135.d:0 "Suki reports that the assignment’s target conditions no longer hold. No mission benefit has been applied. The authorization cost and shared cooldown remain spent."
 eor.132.t:0 "Yuriko: Military Factory Damaged"
 eor.132.d:0 "Yuriko has damaged two military-factory levels in the selected enemy state and disrupted local resource output and factory security for 60 days. This is a targeted operation; it does not destroy an army or create a superweapon unit."
 eor.136.t:0 "Yuriko: Assignment Invalidated"
 eor.136.d:0 "Suki reports that the assignment’s target conditions no longer hold. No mission benefit has been applied. The authorization cost and shared cooldown remain spent."
 eor.133.t:0 "Yuriko: Sensitive Programs Protected"
 eor.133.d:0 "Yuriko has completed her protective assignment. Sensitive research and command programs receive sixty days of increased hostile-operative detection."
 eor.137.t:0 "Yuriko: Assignment Invalidated"
 eor.137.d:0 "Suki reports that the assignment’s target conditions no longer hold. No mission benefit has been applied. The authorization cost and shared cooldown remain spent."
 EOR_imperial_decisions_desc:0 "Institutional legitimacy: [?EOR_imperial_legitimacy|0]/100 — political access and succession.\nSacred belief: [?EOR_divine_mandate|0]/100 — Yoshiro’s authority only.\nTechnocratic influence: [?EOR_technocratic_influence|0]/100\nMilitary influence: [?EOR_military_influence|0]/100\nActive authority: [?EOR_authority|0]/100 — successor governments use institutional legitimacy. Only one authority tier applies."
 EOR_overseas_decisions_desc:0 "Overseas pressure: [?EOR_subject_pressure|0]/100.\nEarned administrative relief: [?EOR_administration_relief|0]/6 per month. Completed administrative settlements and development projects provide bounded relief. Severe unrest follows earlier demands, with a 60-day grace period. Benefits follow current subjects; projects recheck their original recipient and control before delivery."
 EOR_diplomacy_decisions_desc:0 "Imperial threat: [?EOR_global_threat|0]/100.\nChinese agreements require consent; follow-up focuses require a current partnership. Settlement requests require legal eligibility before payment. Targeted envoy preparation improves acceptance weight temporarily; the recipient can still refuse. Settlements create a non-aggression pact and one-year truce."
 eor.140.t:0 "Subject Investment Delivered"
 eor.140.d:0 "Suki confirms that the original project capital remains owned and controlled by its recipient, which is still an Imperial subject. The contracted benefit has been delivered. The three-factory reservation ends on its original schedule."
 eor.141.t:0 "Subject Investment Invalidated"
 eor.141.d:0 "Suki reports that the recipient or original project capital no longer meets the contract’s conditions. No reward or refund is granted. The three-factory reservation ends on its original schedule."
 eor.142.t:0 "A Negotiated Military Government"
 eor.142.d:0 "Shinzo’s command now governs through an agreed transfer of authority. Officers have gained the single chain of command they demanded, but their settlement with the court binds them to preserve the institutions that accepted it. Suki records those obligations as the basis of the new administration."
 eor.143.t:0 "The Cost of Armed Seizure"
 eor.143.d:0 "Shinzo’s command has survived the loyalist struggle. Officers who demanded clear orders now inherit damaged administration, casualties and households divided by the fighting. Suki warns that defeating organized loyalists does not restore their confidence. The existing military-government program must rebuild an administration capable of carrying out its orders."
 eor.144.t:0 "Program Completed"
 eor.144.d:0 "Suki confirms that the program still meets its delivery conditions. Its listed equipment, institutional or operational benefits have been delivered. Any reserved civilian factories are released on the original schedule."
 eor.145.t:0 "Program Invalidated"
 eor.145.d:0 "Suki reports that the government, recipient, target or diplomatic situation no longer meets the program conditions. No benefit or refund is granted. Any reserved factories remain committed until their original release date."
 EOR_sacred_programs_tt:0 "Unlocks two alternative funded programs: Sacred Mobilization or an Overseas Prestige Investment. They share a 365-day authorization cooldown."

 EOR_fortress_grants_tt:0 "Grants two homeland construction contracts. Each reserves 3 civilian factories for 90 days, then adds two land-fort levels at the selected regional city and two state anti-air levels. Each region can receive one grant."

 EOR_modernization_programs_tt:0 "Unlocks a funded equipment contract matching the chosen military modernization doctrine."

 EOR_service_programs_tt:0 "Unlocks a funded service-readiness program matching the army or navy settlement."

 EOR_giga_preparation_tt:0 "Unlocks paid Giga Fortress preparation. Completion creates a ready asset; wartime activation remains a separate decision."

 EOR_odessa_support_tt:0 "Unlocks Prepare the Odessa Campaign: 50 PP, 30 days preparation, then 90 days of Soviet offensive and urban-combat support."

 EOR_targeted_envoys_tt:0 "Unlocks 60-day envoy preparations for eligible Soviet, American, British and European settlement partners. Preparation costs 75 PP and doubles the acceptance weight of a later request for 180 days; it guarantees no agreement."

 EOR_schedule_court_review:0 "Schedule a Court Review"

 EOR_schedule_court_review_desc:0 "Spend 75 PP to schedule a 60-day debate over Imperial government. If no political route or earlier crisis has settled the question when the review ends, the court opens the succession debate. This review discovers no foreign evidence and requires neither war nor defeat."

 EOR_sacred_mobilization:0 "Fund Sacred Mobilization"

 EOR_sacred_mobilization_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days. Under Yoshiro, completion grants 10,000 manpower, 300 Imperial Warrior equipment if known (otherwise standard infantry equipment), and 5 Divine Mandate. Shares a 365-day authorization cooldown with Overseas Prestige Investment. A government change invalidates delivery without refund."

 EOR_fund_homeland_fortress:0 "Fund a Homeland Fortress"

 EOR_fund_homeland_fortress_desc:0 "Use one of two focus-funded grants and reserve 3 civilian factories for 90 days. Select Kanto, Kansai or Tokai: completion adds two land-fort levels at Tokyo, Osaka or Nagoya respectively and two state anti-air levels, up to normal building limits. Each region can receive one grant. Government change or lost ownership/full control invalidates delivery; the grant and time are not refunded."

 EOR_automated_armored_contract:0 "Fund an Automated Armor Contract"

 EOR_automated_armored_contract_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Under Tatsu, deliver 20 King Oni if that technology is known, otherwise 40 Tsunami tanks, plus 15 army experience. At least one of those technologies must already be known. Annual authorization cooldown; a government change invalidates the contract without refund."

 EOR_combined_force_contract:0 "Fund a Combined-Force Contract"

 EOR_combined_force_contract_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Under Tatsu, deliver 400 Imperial Warrior equipment if known (otherwise standard infantry equipment), 150 support equipment and 25 army experience. Annual authorization cooldown; a government change invalidates the contract without refund."

 EOR_land_service_program:0 "Fund Army Readiness"

 EOR_land_service_program_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Under Shinzo, deliver 30 Tsunami tanks and 100 support equipment, then support mobile planning for 180 days. Tsunami technology is required. Annual authorization cooldown; a government change invalidates delivery without refund."

 EOR_naval_service_program:0 "Fund Fleet Readiness"

 EOR_naval_service_program_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days. Under Shinzo, gain 30 navy experience and 180 days of conventional shipbuilding, repair and fleet-preservation support. Ships still require normal construction. Annual authorization cooldown; a government change invalidates delivery without refund."

 EOR_settle_military_administration:0 "Settle Military Administration"

 EOR_settle_military_administration_desc:0 "Spend 75 PP and reserve 3 civilian factories for 60 days. Under Shinzo, give civilian administrators a permanent coordinating role: gain 3 percentage points of stability and two points of monthly administrative relief at a cost of 5 military influence. Once per campaign; a government change invalidates completion without refund."

 EOR_prepare_odessa_operation:0 "Prepare the Odessa Campaign"

 EOR_prepare_odessa_operation_desc:0 "Spend 50 PP and prepare for 30 days. If war with the Soviet Union continues, gain 90 days of Soviet offensive planning and urban-combat support. Authorization cooldown: 180 days. Peace before completion invalidates the operation without refund; no territory changes automatically."

 EOR_prepare_settlement_sov:0 "Prepare Envoys: Soviet Union"

 EOR_prepare_settlement_sov_desc:0 "Spend 75 PP and 60 days preparing a separate agreement with the Soviet Union. The target must remain eligible for an Imperial settlement. Successful preparation doubles its acceptance weight for a later paid request for 180 days; refusal remains possible. Only one envoy preparation can run at a time. Annual authorization cooldown; invalidation gives no refund."

 EOR_prepare_settlement_usa:0 "Prepare Envoys: United States"

 EOR_prepare_settlement_usa_desc:0 "Spend 75 PP and 60 days preparing a separate agreement with the United States. The target must remain eligible for an Imperial settlement. Successful preparation doubles its acceptance weight for a later paid request for 180 days; refusal remains possible. Only one envoy preparation can run at a time. Annual authorization cooldown; invalidation gives no refund."

 EOR_prepare_settlement_eng:0 "Prepare Envoys: Britain"

 EOR_prepare_settlement_eng_desc:0 "Spend 75 PP and 60 days preparing a separate agreement with the Britain. The target must remain eligible for an Imperial settlement. Successful preparation doubles its acceptance weight for a later paid request for 180 days; refusal remains possible. Only one envoy preparation can run at a time. Annual authorization cooldown; invalidation gives no refund."

 EOR_prepare_settlement_aoe:0 "Prepare Envoys: European administration"

 EOR_prepare_settlement_aoe_desc:0 "Spend 75 PP and 60 days preparing a separate agreement with the European administration. The target must remain eligible for an Imperial settlement. Successful preparation doubles its acceptance weight for a later paid request for 180 days; refusal remains possible. Only one envoy preparation can run at a time. Annual authorization cooldown; invalidation gives no refund."

 eor.41.review:0 "The scheduled court review has assembled ministers and commanders before a military disaster forces their hand. Yoshiro argues for sacred authority, Tatsu offers technical administration and Shinzo seeks a stronger military voice. No foreign evidence has been discovered by this debate. The court must decide which institution should shape the next government."

 eor.146.t:0 "Terms of Court Reconciliation"

 eor.146.d:0 "Yoshiro can preserve the throne while admitting moderate critics to its work. Tatsu remains eligible as an advisor and retains his military command. The court can fund a technical advisory settlement with ongoing political overhead, or a narrower compact between the armed services."

 eor.146.a:0 "Fund Technical Counsel: 75 PP and Continuing Political Overhead"

 eor.146.b:0 "Fund a Joint Service Compact: 25 PP"

 eor.147.t:0 "Terms of the Preserved Throne"

 eor.147.d:0 "Tatsu must define how Yoshiro will remain within the new government. A ceremonial throne reassures traditionalists and supports administrative stability. A scientific court links the dynasty to research and military planning, but costs institutional legitimacy and strengthens the officers."

 eor.147.a:0 "Preserve a Ceremonial Throne"

 eor.147.b:0 "Establish a Scientific Court"

 eor.150.t:0 "China Requests Economic Concessions"

 eor.150.d:0 "China will cooperate on a limited basis if the Empire pays 100 political power in economic concessions. Acceptance gives China access arrangements and opens the bilateral focus program; it does not automatically add China to our faction. We may decline these terms."

 eor.150.a:0 "Accept the 100 PP Agreement"

 eor.150.b:0 "Decline the Terms"

 eor.151.t:0 "Chinese Partnership Accepted"

 eor.151.d:0 "China and the Empire have agreed to cooperate. The bilateral focus program is available while China remains an eligible partner at peace with the Empire. Military access and faction membership follow the actual accepted terms; the agreement transfers no states."

 eor.152.t:0 "Chinese Agreement Declined"

 eor.152.d:0 "No agreement has been reached. Bilateral follow-up focuses require an accepted partnership; a renewed cooperation offer remains available through diplomacy after its cooldown. A rejected submission demand instead leaves the ordinary war-goal route available."

 eor.153.t:0 "China Accepts the Protectorate"

 eor.153.d:0 "China has accepted the offered subject relationship. Existing state ownership remains in place, and further integration uses normal subject mechanics. The protectorate focus now has a current recipient."

 eor.154.t:0 "Envoys Complete Their Preparations"

 eor.154.d:0 "The selected rival remains eligible for negotiations. Its acceptance weight for a later Imperial settlement request is doubled for 180 days. A request still costs political power, and the recipient can refuse; no pact or peace has yet been signed."

 eor.155.t:0 "Envoy Preparations Invalidated"

 eor.155.d:0 "The selected rival no longer meets the settlement conditions. The preparation grants no diplomatic advantage and no refund. A later request must satisfy its own eligibility conditions."

 EOR_regional_policy_reward_tt:0 "Gain 50 Political Power and open the China and Southeast Asian policy branches. This is a 14-day administrative focus."

 EOR_the_china_question_reward_tt:0 "Gain 50 Political Power and one 50% industry research bonus. Opens the mutually exclusive cooperation and coercion approaches; neither choice transfers territory."

 EOR_cooperate_with_china_reward_tt:0 "Spend 50 Political Power to send China a partnership offer. China may accept, request an additional 100-PP agreement for you to approve, or refuse. Acceptance opens bilateral follow-up focuses; refusal leaves the renewed-offer decision available after its cooldown."

 EOR_the_asian_accord_reward_tt:0 "Requires a current accepted Chinese partnership. On completion: EOR and China each receive one 50% industry research bonus; EOR gains 3 percentage points of stability; Chinese opinion of EOR improves by 40."

 EOR_joint_military_plan_reward_tt:0 "Requires a current accepted Chinese partnership. On completion: EOR and China each gain 25 army experience and +5% planning speed for 180 days."

 EOR_partners_in_asia_reward_tt:0 "Requires a current accepted Chinese partnership. On completion: EOR and China each receive one 50% electronics research bonus and one 50% armor research bonus; EOR gains 50 Political Power. This is a bilateral exchange, not subject research-group membership."

 EOR_subjugate_china_reward_tt:0 "Spend 50 Political Power and add 10 Imperial threat. Gain 25 army experience, 100 support equipment and +5% planning speed for 180 days to prepare the continental campaign. This focus does not declare war."

 EOR_imperial_ultimatum_reward_tt:0 "Send China a submission demand after 14 days. Acceptance creates the offered subject relationship through diplomacy; refusal grants the ordinary puppet war goal. China may refuse, and war is not declared automatically."

 EOR_the_chinese_campaign_reward_tt:0 "Against an eligible independent China: gain 20 army experience, +5% attack against China and +10% planning speed for 180 days. Supply the ordinary puppet war goal if the ultimatum has not already granted it. Automatically bypassed if China is already our subject or no longer exists."

 EOR_imperial_protectorate_reward_tt:0 "For a current Chinese subject controlling its capital: add one civilian factory there, give China 365 days of resource-access support, and grant EOR 75 Political Power. If China no longer exists, require an owned and controlled Chinese core; build the factory in one such state and add 180 days of local repair support instead. No ownership or cores are transferred."

 EOR_automation_scope_tt:0 "Automation improves production and armored equipment costs. It does not reduce battalion manpower requirements."

 PHI_WAR_OF_THE_THREE_POWERS_DESC:0 "The Philippines begins as a subject of the Empire of the Rising Sun. Develop the country and manage its place within the Imperial faction."

 MAL_WAR_OF_THE_THREE_POWERS_DESC:0 "Malaya begins as a subject of the Empire of the Rising Sun. Develop its economy and manage its place within the Imperial faction."

 INS_WAR_OF_THE_THREE_POWERS_DESC:0 "Indonesia begins as a subject of the Empire of the Rising Sun. Develop its economy and manage its place within the Imperial faction."
