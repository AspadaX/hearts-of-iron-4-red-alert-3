l_english:
 EOR_divine_emperor:0 "The Divine Emperor"
 EOR_divine_emperor_desc:0 "The throne binds military duty and public obedience to Yoshiro's claim of sacred destiny. Victories strengthen that conviction; a crisis of faith can shake the institutions that depend upon it."
 the_shogunate:0 "The Imperial Shogunate"
 the_shogunate_desc:0 "The shogunate connects military command to Imperial ministries. Its offices coordinate administration and the responsibilities of the armed services."
 EOR_technological_superiority:0 "Technological Superiority"
 EOR_technological_superiority_desc:0 "Advanced industrial laboratories sustain the Empire’s technical advantage. Their research supports equipment development across the armed services."
 traditional_zaibatsus:0 "Traditional Zaibatsus"
 traditional_zaibatsus_desc:0 "Established industrial combines dominate strategic procurement. Their traditional contracts shape factory output until a corporate or state settlement replaces them."
 EOR_imperial_resource_dependency:0 "Imperial Resource Dependency"
 EOR_imperial_resource_dependency_desc:0 "Advanced industry depends on overseas raw materials. Autarky, peaceful commerce, or completed Malayan and Indonesian resource programs can ease this burden; lost access restores it."
 EOR_coprosperity_administration:0 "The Co-Prosperity Sphere"
 EOR_coprosperity_administration_desc:0 "The overseas administration coordinates Imperial dependencies. Centralized extraction and cooperative investment offer different settlements; benefits follow current subject relationships."
 EOR_reinforced_shogunate:0 "Reinforced Shogunate"
 EOR_reinforced_shogunate_desc:0 "The shogunate coordinates officers and ministries beneath the throne. Reinforced institutions translate court authority into military discipline."
 EOR_eternal_empire:0 "The Eternal Empire"
 EOR_eternal_empire_desc:0 "Yoshiro’s court has established a durable political settlement. Public obedience and military service remain bound to the Emperor’s sacred mission."
 EOR_scientific_legitimacy:0 "Scientific Legitimacy"
 EOR_scientific_legitimacy_desc:0 "Technical achievement supplies a public argument for government authority. Laboratories and procurement offices gain standing alongside the older institutions of the court."
 EOR_scientific_shogunate:0 "The Scientific Shogunate"
 EOR_scientific_shogunate_desc:0 "Military command and scientific administration share responsibility for Imperial modernization. Their institutions coordinate research with the demands of the armed forces."
 EOR_empire_of_tomorrow:0 "The Empire of Tomorrow"
 EOR_empire_of_tomorrow_desc:0 "Tatsu’s ministries direct industrial and military modernization. The throne’s future is defended through technical achievement and organized administration."
 EOR_modern_shogunate:0 "The Modern Shogunate"
 EOR_modern_shogunate_desc:0 "The Shogunate shall retain its traditions while incorporating modern administrative principles and advanced military planning."
 EOR_one_empire_one_future:0 "One Empire, One Future"
 EOR_one_empire_one_future_desc:0 "The Empire has overcome its ideological divisions. Under the guidance of Emperor Yoshiro and Crown Prince Tatsu, tradition and technological innovation shall together secure Japan's future."
 EOR_supremacy_of_technology:0 "Supremacy of Technology"
 EOR_supremacy_of_technology_desc:0 "Scientific investment supports the Empire’s answer to larger rival economies. Research institutions coordinate advanced military development."
 EOR_the_nano_construction:0 "Nanoconstruction"
 EOR_the_nano_construction_desc:0 "The institute's research offers new methods for building and repairing infrastructure. Develop nanoconstruction and authorize paid projects that apply it in selected states."
 EOR_the_robotic_production:0 "Robotic Assembly"
 EOR_the_robotic_production_desc:0 "Automation can extend from weapons to the factories that make them. Introduce robotic production methods to improve industrial output and production learning."
 EOR_nanotech_mainframe:0 "Nanotech Mainframe"
 EOR_nanotech_mainframe_desc:0 "The mainframe connects institute research with advanced manufacturing. It supplies the technical foundation for experimental programs."
 EOR_a_highly_mechanized_army:0 "A Highly Mechanized Army"
 EOR_a_highly_mechanized_army_desc:0 "Machines can provide the mobility and protection needed for a decisive campaign. Choose a mechanized doctrine that organizes the army around armored and motorized formations."
 EOR_the_futuristic_bushido:0 "The Futuristic Bushido"
 EOR_the_futuristic_bushido_desc:0 "The modern warrior must combine advanced weapons with disciplined individual service. Choose an infantry-centered doctrine that places elite troops at the heart of the army."
 EOR_landing_combat_scheme:0 "Landing Combat Scheme"
 EOR_landing_combat_scheme_desc:0 "Every army doctrine needs a practical method for crossing defended shores. Develop shared landing procedures and amphibious equipment support as a common branch of army reform."
 EOR_multiple_terrains_combat_support:0 "Multi-Terrain Combat Support"
 EOR_multiple_terrains_combat_support_desc:0 "A force that succeeds on the beach must still operate inland. Extend the common support program to reduce the logistical and environmental burdens of varied terrain."
 EOR_fortified_fleet:0 "The Fortified Fleet"
 EOR_fortified_fleet_desc:0 "Capital ships must remain effective under sustained enemy pressure. Strengthen fleet protection, detection and repair practices before seeking a decisive engagement."
 EOR_imperial_centralization:0 "Imperial Centralization"
 EOR_imperial_centralization_desc:0 "Closer integration increases subject resource and manpower access. Administrative pressure rises monthly; demands and unrest can follow. Occupied non-core territories also face increased resistance."
 EOR_imperial_partnership:0 "Imperial Partnership"
 EOR_imperial_partnership_desc:0 "Autonomy and investment improve cooperation and subject stability while reducing immediate resource extraction. Benefits end when a country ceases to be an Imperial subject."
 EOR_court_coordination:0 "Council of Shoguns"
 EOR_court_coordination_desc:0 "The council coordinates the armed services with the Imperial Court. Shared planning reduces disputes over strategic priorities."
 EOR_crown_prince:0 "The Crown Prince"
 EOR_crown_prince_desc:0 "Tatsu maintains a public platform for technical modernization. His supporters link the court to industrial and military specialists."
 EOR_warriors:0 "Warriors of the Rising Sun"
 EOR_warriors_desc:0 "The warrior establishment combines disciplined service with modern weapons. Its institutions sustain the infantry formations of the Empire."
 EOR_guard:0 "The Emperor’s Personal Guard"
 EOR_guard_desc:0 "The personal guard protects the throne and its political institutions. Its privileges tie an elite military formation directly to Yoshiro’s authority."
 EOR_prince_speaks:0 "The Crown Prince Speaks"
 EOR_prince_speaks_desc:0 "Tatsu’s public intervention gives scientific administrators a stronger political voice. Technical reform now has an advocate within the dynasty."
 EOR_reformed_war_council:0 "Reformed War Council"
 EOR_reformed_war_council_desc:0 "A reorganized war council coordinates strategic planning across the services. Officers share responsibility for translating policy into operations."
 EOR_empowered_technocrats:0 "Empowered Technocrats"
 EOR_empowered_technocrats_desc:0 "Technical ministries have gained authority over research and production. Their specialists coordinate industrial learning with national procurement."
 EOR_scientific_administration:0 "Scientific Administration"
 EOR_scientific_administration_desc:0 "Scientific administrators connect laboratories, procurement and ministries. Their institutions support research as a continuing responsibility of government."
 EOR_accord:0 "The Imperial Accord"
 EOR_accord_desc:0 "The Imperial accord coordinates government and military priorities. Its institutions sustain cooperation among the participating administrations."
 EOR_innovation:0 "Tradition and Innovation"
 EOR_innovation_desc:0 "Court traditions accommodate technical experimentation. The settlement gives scientific work a place within existing Imperial institutions."
 EOR_reformed_court:0 "A Reformed Imperial Court"
 EOR_reformed_court_desc:0 "Court offices have been reorganized to coordinate policy more effectively. Their authority rests on administrative cooperation rather than personal rivalry."
 EOR_siberian_logistics:0 "Siberian Logistics"
 EOR_siberian_logistics_desc:0 "Specialist supply organizations sustain operations across Siberia. They prepare formations for difficult distances and limited infrastructure."
 EOR_offensive_preparations:0 "Offensive Preparations"
 EOR_offensive_preparations_desc:0 "Staff officers have prepared an operational timetable and supply allocation. These temporary arrangements support the coming offensive."
 EOR_rapid_offensive:0 "Rapid Mechanized Offensive"
 EOR_rapid_offensive_desc:0 "Mechanized formations train for rapid concentration and exploitation. Their doctrine places speed and coordinated breakthroughs at the center of operations."
 EOR_capital_offensive:0 "Capital Offensive"
 EOR_capital_offensive_desc:0 "The general staff concentrates planning against a major enemy command center. Preparations improve offensive coordination for the designated campaign."
 EOR_urban_operations:0 "Urban Operations"
 EOR_urban_operations_desc:0 "Assault troops and engineers coordinate fighting in built-up areas. Their preparation supports operations against defended cities."
 EOR_black_tortoise_doctrine:0 "Floating Fortress Doctrine"
 EOR_black_tortoise_doctrine_desc:0 "Naval planning incorporates mobile fortress support. Range and protection guide the fleet’s use of its heaviest assets."
 EOR_pacific_fleet:0 "Challenge the Allied Fleet"
 EOR_pacific_fleet_desc:0 "The fleet concentrates against Allied naval power in the Pacific. Operational planning supports engagements across widely separated bases."
 EOR_secure_pacific:0 "Secure the Pacific"
 EOR_secure_pacific_desc:0 "Naval forces coordinate patrols and protected routes across the Pacific. Temporary support strengthens the campaign while it remains active."
 EOR_coalition_preparation:0 "Prepare for the Coalition"
 EOR_coalition_preparation_desc:0 "The general staff prepares for cooperation among rival great powers. Planning and defensive readiness anticipate a wider conflict."
 EOR_advanced_shipbuilding:0 "Advanced Imperial Shipbuilding"
 EOR_advanced_shipbuilding_desc:0 "Imperial shipyards coordinate modern hull construction and repair. Industrial expertise supports the fleet’s expansion."
 EOR_shogun_battleship:0 "Shogun Battleship Program"
 EOR_shogun_battleship_desc:0 "The Shogun program supports heavy naval artillery and battleship production. Its ships still require ordinary dockyard construction and resources."
 EOR_mecha_tengu_doctrine:0 "Mecha Tengu Operational Doctrine"
 EOR_mecha_tengu_doctrine_desc:0 "Land-based Tengu fighters coordinate air cover with the fleet. They operate from airfields; this doctrine does not make them carrier aircraft."
 EOR_striker_vx_doctrine:0 "Striker-VX Support Doctrine"
 EOR_striker_vx_doctrine_desc:0 "Dedicated Striker-VX aircraft support the army from land bases. Their doctrine coordinates ground attack without creating a transforming map unit."
 EOR_liberated_manpower:0 "Liberate the Manpower"
 EOR_liberated_manpower_desc:0 "Automation releases workers for other national responsibilities. Rapid labor reorganization also imposes social disruption."
 EOR_mobilization_law:0 "Imperial Mobilization Law"
 EOR_mobilization_law_desc:0 "The mobilization law coordinates manpower and industrial obligations. Its institutions make military production a continuing national priority."
 EOR_zaibatsu_dialogue:0 "Industrial Coordination"
 EOR_zaibatsu_dialogue_desc:0 "Procurement officials coordinate strategic contracts with industrial combines. Negotiated production priorities support military factory construction."
 EOR_first_amendment:0 "First Mobilization Amendment"
 EOR_first_amendment_desc:0 "Expanded industrial obligations support wartime factory output. The first amendment strengthens production within the mobilization system."
 EOR_second_amendment:0 "Second Mobilization Amendment"
 EOR_second_amendment_desc:0 "Further mobilization commitments support military industrial expansion. The second amendment extends the government’s factory-construction program."
 EOR_controlled_procurement:0 "Imperial Procurement"
 EOR_controlled_procurement_desc:0 "Imperial procurement offices coordinate military contracts and deliveries. Their supervision links industrial capacity to the armed services."
 EOR_logistics_network:0 "Imperial Logistics Network"
 EOR_logistics_network_desc:0 "A coordinated logistics network supports military supply. Its continuing benefits depend on the institutions that maintain the network."
 EOR_research_cooperation:0 "Imperial Research Cooperation"
 EOR_research_cooperation_desc:0 "Imperial research institutions coordinate shared technical work with current dependencies. Subject-only membership is removed when that relationship ends."
 EOR_research_surge:0 "Scientific Initiative"
 EOR_research_surge_desc:0 "A temporary scientific initiative concentrates specialists on urgent research. Its support expires when the funded program ends."
 EOR_political_secrecy:0 "The Burden of Secrecy"
 EOR_political_secrecy_desc:0 "The government restricts circulation of sensitive evidence. Maintaining secrecy consumes administrative effort and shapes political confidence."
 EOR_fleet_expansion:0 "Conventional Fleet Expansion"
 EOR_fleet_expansion_desc:0 "Shipyards receive temporary support for conventional fleet expansion. Hulls still require normal construction time, resources and crews."
 EOR_emergency_defense:0 "Emergency Homeland Mobilization"
 EOR_emergency_defense_desc:0 "Emergency arrangements mobilize personnel and defensive planning. Their temporary support strengthens the homeland during a military crisis."
 EOR_continuity:0 "Continuity of Imperial Government"
 EOR_continuity_desc:0 "Emergency offices preserve government coordination through disruption. Temporary continuity arrangements sustain authority while normal administration recovers."
 EOR_naval_withdrawal:0 "Preserve the Fleet"
 EOR_naval_withdrawal_desc:0 "The navy prioritizes preserving its surviving fleet. Defensive operating practices support withdrawal and recovery."
 EOR_project_investment:0 "Experimental Industrial Investment"
 EOR_project_investment_desc:0 "The grand-project bureau reserves eight civilian factories and diverts military output during preparation. Only one grand project can occupy this allocation at a time."
 EOR_nanocore_investment:0 "Nanocore Industrial Investment"
 EOR_nanocore_investment_desc:0 "The central development allocation reserves three civilian factories for the commitment shown in the decision list. Civil construction, research and overseas investments share this capacity; invalidated targets receive no delivery and paid costs are sunk."
 EOR_procurement_investment:0 "Military Procurement Investment"
 EOR_procurement_investment_desc:0 "Military procurement reserves three civilian factories while contracted equipment is assembled. This allocation is separate from central development and grand military projects."
 EOR_executioner:0 "Shogun Executioner Deployment"
 EOR_executioner_desc:0 "An Executioner operation supports army breakthroughs for sixty days. Its exceptional machinery places additional demands on supply and suffers prototype attrition."
 EOR_executioner_reliable:0 "Shogun Executioner Refined Prototype"
 EOR_executioner_reliable_desc:0 "Refined Executioner machinery supports army breakthroughs for sixty days. Better reliability reduces prototype losses, while the operation still consumes additional supplies."
 EOR_giga_fortress:0 "Giga Fortress Deployment"
 EOR_giga_fortress_desc:0 "The Giga Fortress operation concentrates naval and air support for ninety days. Its strategic reach demands additional fuel; it is represented by a temporary national operation."
 EOR_black_tortoise:0 "Black Tortoise Support"
 EOR_black_tortoise_desc:0 "Black Tortoise support extends naval operating range and convoy protection for one hundred and eighty days. The floating fortress is represented through operational support."
 EOR_psionic_command_disruption:0 "Psionic Command Disruption"
 EOR_psionic_command_disruption_desc:0 "Hostile command networks are suffering a temporary psionic disruption. Planning and unit coordination remain impaired until its effects expire."
 EOR_omega_counterintelligence:0 "Yuriko: Counterintelligence"
 EOR_omega_counterintelligence_desc:0 "Spend 100 PP and prepare Yuriko for 30 days to protect sensitive research and command information. Completion grants 60 days of hostile-operative detection if the government has not capitulated. All four missions share a 180-day cooldown; invalidation retains the cost and cooldown."
 EOR_postwar_science:0 "Fund Technical Applications"
 EOR_postwar_science_desc:0 "Spend 75 PP and reserve 3 civilian factories for 180 days. Under Tatsu, gain one electronics and one armor research bonus plus 180 days of scientific initiative. Annual authorization cooldown; a government change invalidates delivery without refund."
 EOR_post_defeat:0 "Collapse of the Shogunate"
 EOR_post_defeat_desc:0 "Military defeat has disrupted the shogunate’s institutions. Reconstruction can remove these penalties after the government regains its footing."
 EOR_imperial_resistance:0 "Imperial Resistance"
 EOR_imperial_resistance_desc:0 "Surviving institutions organize continued resistance after defeat. Their support strengthens homeland defense without spawning a new army."
 EOR_coalition_cooperation:0 "Anti-Imperial Cooperation"
 EOR_coalition_cooperation_desc:0 "Rival powers share operational support against Imperial expansion. The temporary agreement improves their capacity to cooperate."
 EOR_subject_centralized:0 "Imperial Administrative Pressure"
 EOR_subject_centralized_desc:0 "Imperial officials direct local administration toward the requirements of the overlord. These obligations apply while the country remains an Imperial subject."
 EOR_subject_partnership:0 "Imperial Partnership Administration"
 EOR_subject_partnership_desc:0 "Local institutions participate in an Imperial investment partnership. Cooperation improves administration while this country remains an Imperial subject."
 EOR_subject_concessions:0 "Limited Imperial Concessions"
 EOR_subject_concessions_desc:0 "Negotiated concessions ease the burden of Imperial rule. Their temporary benefits end if the subject relationship ends."
 EOR_subject_security:0 "Imperial Security Deployment"
 EOR_subject_security_desc:0 "Imperial security personnel reinforce local authority. This temporary deployment depends on the country remaining an Imperial subject."
 EOR_subject_resentment:0 "Resentment of Imperial Security"
 EOR_subject_resentment_desc:0 "Imperial security measures have provoked resentment among local institutions and communities. This penalty belongs to the subject relationship and ends with it."
 EOR_subject_development:0 "Imperial Development Assistance"
 EOR_subject_development_desc:0 "Imperial development assistance supports the local economy. The temporary program ends when the recipient ceases to be an Imperial subject."
 EOR_subject_resource_access:0 "Imperial Resource Agreement"
 EOR_subject_resource_access_desc:0 "A negotiated resource agreement supports the Imperial supply network. Its benefits depend on the current subject relationship."
 EOR_mandate_ascendancy:0 "[GetEORAuthorityAscendancy]"
 EOR_mandate_ascendancy_desc:0 "[GetEORAuthorityDescription]"
 EOR_mandate_confidence:0 "[GetEORAuthorityConfidence]"
 EOR_mandate_confidence_desc:0 "[GetEORAuthorityDescription]"
 EOR_mandate_doubts:0 "[GetEORAuthorityDoubts]"
 EOR_mandate_doubts_desc:0 "[GetEORAuthorityDescription]"
 EOR_mandate_crisis:0 "[GetEORAuthorityCrisis]"
 EOR_mandate_crisis_desc:0 "[GetEORAuthorityDescription]"
 EOR_mandate_shattered:0 "[GetEORAuthorityShattered]"
 EOR_mandate_shattered_desc:0 "[GetEORAuthorityDescription]"
 EOR_research_program:0 "Imperial Research Program"
 EOR_research_program_desc:0 "A national research program coordinates technical priorities. Sustained funding supports the Empire’s laboratories and military developers."
 EOR_institute_funding:0 "Imperial Weaponry Institute Funding"
 EOR_institute_funding_desc:0 "The Weaponry Institute receives continuing support for military research. Its staff connect experimental science with the needs of production."
 EOR_the_imperial_dawn:0 "The Imperial Dawn"
 EOR_the_imperial_dawn_desc:0 "A new century has brought the Empire to the edge of a struggle for the Pacific. Mobilize the government behind a common program and prepare the court to decide what the Rising Sun will become."
 EOR_the_divine_mandate:0 "The Divine Mandate"
 EOR_the_divine_mandate_desc:0 "Yoshiro's authority rests on the conviction that the dynasty embodies Japan's destiny. Reaffirm that bond before military setbacks and political rivals can turn public doubt into a crisis of legitimacy."
 EOR_the_imperial_court:0 "The Imperial Court"
 EOR_the_imperial_court_desc:0 "The Emperor cannot govern an empire of such vast ambitions alone. The Imperial Court must coordinate the military, government ministries, and industrial corporations to ensure that every institution serves the nation's objectives."
 EOR_council_of_shoguns:0 "Council of Shoguns"
 EOR_council_of_shoguns_desc:0 "The Imperial Armed Forces require unified strategic direction. The most capable commanders shall assemble to determine the Empire's military priorities and coordinate the coming war."
 EOR_the_crown_prince:0 "The Crown Prince"
 EOR_the_crown_prince_desc:0 "Tatsu believes that scientific achievement can secure the Empire's future. Give the crown prince a public platform and open a channel through which the government can support his technocratic allies."
 EOR_the_question_of_destiny:0 "The Question of Destiny"
 EOR_the_question_of_destiny_desc:0 "A scheduled court review or an unfolding crisis has opened a public debate over Imperial government. Prepare the choice between Yoshiro's authority, Tatsu's technical administration and Shinzo's military command."
 EOR_reaffirm_the_divine_mandate:0 "Reaffirm the Divine Mandate"
 EOR_reaffirm_the_divine_mandate_desc:0 "The throne need not wait for defeat to defend its authority. Reaffirm Yoshiro's rule, restore administrative confidence and choose how the court will settle its internal disputes."
 EOR_reinforce_the_shogunate:0 "Reinforce the Shogunate"
 EOR_reinforce_the_shogunate_desc:0 "The Shogunate must remain the unquestioned instrument of Imperial authority. Military officers and civilian administrators alike must demonstrate absolute loyalty to the Emperor."
 EOR_the_emperors_sacred_authority:0 "The Emperor's Sacred Authority"
 EOR_the_emperors_sacred_authority_desc:0 "The Emperor's authority is not merely political. It represents the spiritual unity of the Empire. By strengthening Imperial institutions, we shall ensure that no internal division can threaten our national purpose."
 EOR_warriors_of_the_rising_sun:0 "Warriors of the Rising Sun"
 EOR_warriors_of_the_rising_sun_desc:0 "The infantry program must become a coherent fighting tradition. Consolidate the training and equipment standards of the army's warrior formations."
 EOR_the_emperors_personal_guard:0 "The Emperor's Personal Guard"
 EOR_the_emperors_personal_guard_desc:0 "An elite force shall be established to safeguard the Imperial family and serve as the ultimate symbol of loyalty to the throne."
 EOR_the_eternal_empire:0 "The Eternal Empire"
 EOR_the_eternal_empire_desc:0 "The throne has survived its challenge and chosen a lasting military direction. Consolidate Yoshiro's settlement into a state built around Imperial continuity and disciplined national service."
 EOR_the_crown_prince_speaks:0 "The Crown Prince Speaks"
 EOR_the_crown_prince_speaks_desc:0 "Crown Prince Tatsu has challenged the traditional interpretation of Imperial destiny. The Empire's victories have been achieved not through divine intervention, but through the ingenuity of its scientists, engineers, and soldiers."
 EOR_science_above_superstition:0 "Science Above Superstition"
 EOR_science_above_superstition_desc:0 "The Empire must confront the realities of the modern world. Scientific knowledge and technological innovation—not unquestioning faith—must determine our future."
 EOR_reform_imperial_war_council:0 "Reform the Imperial War Council"
 EOR_reform_imperial_war_council_desc:0 "The Imperial military command must be reorganized around operational effectiveness. Officers shall be judged by their competence rather than their adherence to tradition."
 EOR_empower_the_technocrats:0 "Empower the Technocrats"
 EOR_empower_the_technocrats_desc:0 "Engineers and researchers need authority over the institutions they are expected to transform. Give the technical ministries a coordinating role in production, procurement and the Empire's next generation of weapons."
 EOR_the_scientific_shogunate:0 "The Scientific Shogunate"
 EOR_the_scientific_shogunate_desc:0 "The Shogunate shall be transformed into an institution guided by technical expertise and strategic rationality. The authority of the state will be preserved, but its methods must evolve."
 EOR_the_empire_of_tomorrow:0 "The Empire of Tomorrow"
 EOR_the_empire_of_tomorrow_desc:0 "Tatsu's political and military reforms now form a coherent national program. Consolidate the technocratic settlement and turn scientific achievement into a durable source of authority."
 EOR_father_and_son_accord:0 "The Father and Son Accord"
 EOR_father_and_son_accord_desc:0 "Emperor Yoshiro and Crown Prince Tatsu have agreed that Imperial tradition and scientific progress need not be enemies. The monarchy shall retain its authority while the Crown Prince receives greater responsibility for military modernization."
 EOR_tradition_and_innovation:0 "Tradition and Innovation"
 EOR_tradition_and_innovation_desc:0 "The Empire's traditions provide unity, while its technological achievements provide strength. By reconciling these principles, we may avoid the destructive divisions that have weakened other nations."
 EOR_reformed_imperial_court:0 "A Reformed Imperial Court"
 EOR_reformed_imperial_court_desc:0 "The Imperial Court shall establish clearer responsibilities between the throne, the military leadership, and the technological ministries."
 EOR_imperial_ambition:0 "Imperial Ambition"
 EOR_imperial_ambition_desc:0 "The Empire's scattered commitments demand a strategic purpose. Bring its overseas ambitions before the government and begin planning the campaigns that would make them achievable."
 EOR_northern_war_plan:0 "The Northern War Plan"
 EOR_northern_war_plan_desc:0 "A northern campaign needs its own logistical and operational framework. Open the Soviet theater once it is our chosen priority or a later strategic reassessment permits expansion."
 EOR_operation_vorkuta:0 "Operation Vorkuta"
 EOR_operation_vorkuta_desc:0 "Continental distances will punish any force that advances without preparation. Organize the northern offensive and establish the military foundations for operations against the Soviet Union."
 EOR_strike_vladivostok:0 "Strike at Vladivostok"
 EOR_strike_vladivostok_desc:0 "Vladivostok anchors Soviet power on the Pacific coast. Prepare the attack on this first major objective and the prestige claim that will follow its capture."
 EOR_battle_for_siberia:0 "Advance Through Siberia"
 EOR_battle_for_siberia_desc:0 "The advance now depends on surviving distance, weather and a thin transport network. Adapt our logistics to Siberia and prepare the next stage of the northern war."
 EOR_into_soviet_territory:0 "Into Soviet Territory"
 EOR_into_soviet_territory_desc:0 "The Imperial Army must exploit its initial victories before Soviet forces can reorganize. Rapid mechanized offensives will prevent the enemy from establishing defensive lines."
 EOR_stalingrad_offensive:0 "The Stalingrad Offensive"
 EOR_stalingrad_offensive_desc:0 "The Soviet leadership has attached enormous symbolic importance to Stalingrad. Capturing the city would deliver both a military and psychological blow to the Soviet war effort."
 EOR_odessa_operation:0 "The Odessa Operation"
 EOR_odessa_operation_desc:0 "An objective on a staff map does not supply an army. Authorize a prepared Soviet campaign operation combining offensive planning and urban combat support, timed by the player's operational decision."
 EOR_march_on_moscow:0 "March on Moscow"
 EOR_march_on_moscow_desc:0 "Moscow is the political and military center of the Soviet war effort. Concentrate preparations for the final approach and make its capture an explicit campaign objective."
 EOR_pacific_war_plan:0 "The Pacific War Plan"
 EOR_pacific_war_plan_desc:0 "A Pacific campaign requires secure bases and a coordinated fleet strategy. Open this theater once it is our first priority or a later reassessment permits it."
 EOR_fortify_pearl_harbor:0 "Fortify Pearl Harbor"
 EOR_fortify_pearl_harbor_desc:0 "Hawaii is a vital forward base in the central Pacific. Strengthen Pearl Harbor's defenses and prepare it to support operations far from Japan."
 EOR_black_tortoise_fortress:0 "The Black Tortoise Fortress"
 EOR_black_tortoise_fortress_desc:0 "A hardened Hawaiian base could absorb attacks that would cripple an exposed fleet. Develop the Black Tortoise defensive concept and authorize its costly preparation as a temporary strategic operation."
 EOR_challenge_allied_pacific_fleet:0 "Challenge the Allied Fleet"
 EOR_challenge_allied_pacific_fleet_desc:0 "The Allied fleet must be confronted before our forces can operate freely across the ocean. Prepare the naval effort needed to contest its control of the Pacific."
 EOR_secure_the_pacific:0 "Secure the Pacific"
 EOR_secure_the_pacific_desc:0 "Bases and fleet operations must support one another. Consolidate our Pacific position after preparing both Pearl Harbor and the challenge to Allied sea power."
 EOR_operation_santa_monica:0 "Operation Santa Monica"
 EOR_operation_santa_monica_desc:0 "An attack across the Pacific depends on careful staging and sustained supply. Prepare Operation Santa Monica as the bridge from maritime control to a mainland campaign."
 EOR_assault_american_mainland:0 "Assault the American Mainland"
 EOR_assault_american_mainland_desc:0 "The continental campaign must now turn preparations into a viable offensive. Establish the military basis for attacking the American mainland and pursuing its principal objectives."
 EOR_imperial_strategic_reassessment:0 "Global Reassessment"
 EOR_imperial_strategic_reassessment_desc:0 "The first campaign has revealed new opportunities or exposed the limits of our original plan. Review its results and authorize operations in additional theaters when the reassessment conditions are met."
 EOR_prepare_for_coalition:0 "Prepare for the Coalition"
 EOR_prepare_for_coalition_desc:0 "Intelligence reports suggest that the Allied Nations and Soviet Union may cooperate against the Empire. We must prepare for the possibility of a coordinated offensive."
 EOR_the_last_opposition:0 "The Last Opposition"
 EOR_the_last_opposition_desc:0 "The Empire has overcome extraordinary challenges. Yet so long as another great power remains capable of resisting us, our struggle remains unfinished."
 EOR_the_supreme_shogunate:0 "The Supreme Shogunate"
 EOR_the_supreme_shogunate_desc:0 "The military settlement needs an agreed command above its competing services. Unite the institutions under Shinzo’s authority; a later major success can bring public recognition of the Supreme Shogun title."
 EOR_ensure_the_supremacy_of_our_technology:0 "Ensure the Supremacy of Our Technology"
 EOR_ensure_the_supremacy_of_our_technology_desc:0 "The Empire's numerical disadvantages make technical superiority essential. Establish a national research program to support advanced manufacturers, military reform and experimental science."
 EOR_approach_the_new_high_tech_companies:0 "Approach the New High-Tech Companies"
 EOR_approach_the_new_high_tech_companies_desc:0 "New industrial firms possess capabilities beyond the traditional procurement establishment. Open negotiations with them and build the partnerships needed by the Imperial research program."
 EOR_kurikara_robotics:0 "Kurikara Robotics"
 EOR_kurikara_robotics_desc:0 "Heavy robotic systems require specialists able to turn prototypes into reliable machines. Bring Kurikara Robotics into Imperial procurement and make its expertise available to the government."
 EOR_tenzai_robotics:0 "Tenzai Robotics"
 EOR_tenzai_robotics_desc:0 "Advanced aircraft demand close cooperation between airframe designers and robotic-control specialists. Bring Tenzai Robotics into the procurement network supporting our air forces."
 EOR_kanegawa_industries:0 "Kanegawa Industries"
 EOR_kanegawa_industries_desc:0 "Armored warfare depends on dependable production as much as bold designs. Establish a procurement relationship with Kanegawa Industries and its armored-equipment specialists."
 EOR_shirada_shipworks:0 "Shirada Shipworks"
 EOR_shirada_shipworks_desc:0 "A modern fleet needs shipyards capable of building and maintaining advanced hulls. Engage Shirada Shipworks as a central partner in Imperial naval development."
 EOR_funding_imperial_weaponry_institute:0 "Fund the Imperial Weaponry Institute"
 EOR_funding_imperial_weaponry_institute_desc:0 "Separate firms cannot answer every question raised by advanced weapons. Fund a central institute to coordinate military research, support technical ministries and provide a foundation for experimental programs."
 EOR_deploy_king_oni:0 "The King Oni Program"
 EOR_deploy_king_oni_desc:0 "Heavy robotics must move from laboratory access into army service. Introduce King Oni technology if necessary, deliver a first equipment batch and open continuing funded procurement contracts."
 EOR_shogun_executioner_program:0 "The Shogun Executioner Program"
 EOR_shogun_executioner_program_desc:0 "Executioner research must improve ordinary procurement before a great machine is ready. Establish production-learning institutions and armor research support, then evaluate the prototype's operational reliability."
 EOR_advanced_imperial_shipbuilding:0 "Advanced Imperial Shipbuilding"
 EOR_advanced_imperial_shipbuilding_desc:0 "Shirada's expertise must be supported by a broader naval construction program. Develop the shipbuilding capacity and methods required by the next generation of Imperial vessels."
 EOR_shogun_battleship_program:0 "The Shogun Battleship Program"
 EOR_shogun_battleship_program_desc:0 "Heavy naval construction requires sustained shipyard effort after a hull design is available. Support normal dockyard production for six months, train naval staff and authorize continuing funded construction support."
 EOR_giga_fortress_project:0 "The Giga Fortress Project"
 EOR_giga_fortress_project_desc:0 "Fortress research must support the fleet throughout development. Establish heavy-ship engineering and naval research support, then complete the prototype before paying for industrial preparation of a ready asset."
 EOR_transformable_aircraft:0 "Transformable Aircraft"
 EOR_transformable_aircraft_desc:0 "Tengu and Striker-VX development requires shared advanced airframes and control systems. Establish dedicated land-based fighter and ground-attack equipment; transformation and carrier embarkation are not represented by these aircraft."
 EOR_mecha_tengu_program:0 "The Mecha Tengu Program"
 EOR_mecha_tengu_program_desc:0 "A fighter program should equip its pilots as well as support later research. Deliver twenty-four Tengu aircraft, train service personnel and retain a research bonus for conventional fighter development."
 EOR_striker_vx_squadrons:0 "Striker-VX Squadrons"
 EOR_striker_vx_squadrons_desc:0 "Ground-attack doctrine needs aircraft ready for ordinary wing deployment. Deliver twenty-four Striker-VX aircraft, train service personnel and retain research support for further close-air-support development."
 EOR_establish_nanotech_mainframe:0 "Establish the Nanotech Mainframe"
 EOR_establish_nanotech_mainframe_desc:0 "Research and robotic production need a common technical foundation. Connect the institute's programs through the mainframe and authorize a choice of experimental projects without another general permission fee."
 EOR_project_omega:0 "Project Omega"
 EOR_project_omega_desc:0 "A single operative program requires focused scientific administration and specialized research. Establish those institutions now, then complete Yuriko's operational authorization before funding her individual missions."
 EOR_liberate_the_manpower:0 "Liberate the Manpower"
 EOR_liberate_the_manpower_desc:0 "Automation can release workers from tasks that machines can perform. Reorganize employment to make more manpower available, accepting the social disruption caused by rapid change."
 EOR_imperial_wartime_measures:0 "Imperial Wartime Measures"
 EOR_imperial_wartime_measures_desc:0 "Military ambition requires an economy able to sustain it. Begin a coordinated industrial program that will settle the government's relationship with the zaibatsus and provide the foundation for mobilization."
 EOR_introduce_the_imperial_mobilization_law:0 "Introduce the Imperial Mobilization Law"
 EOR_introduce_the_imperial_mobilization_law_desc:0 "The chosen industrial settlement now provides a framework for wartime coordination. Introduce a national mobilization law and authorize joint mobilization with current subjects."
 EOR_government_zaibatsus_dialogue:0 "Government-Zaibatsu Dialogue"
 EOR_government_zaibatsus_dialogue_desc:0 "The industrial combines possess expertise the state cannot replace overnight. Convene negotiations to decide whether cooperation or direct control will govern the wartime economy."
 EOR_the_first_amendment_of_the_imperial_mobilization_law:0 "First Amendment to Imperial Mobilization"
 EOR_the_first_amendment_of_the_imperial_mobilization_law_desc:0 "The first mobilization measures have exposed weaknesses in military procurement. Amend the law to support Imperial infantry purchases and a broader commitment to the war effort."
 EOR_the_second_amendment_of_the_imperial_mobilization_law:0 "Second Amendment to Imperial Mobilization"
 EOR_the_second_amendment_of_the_imperial_mobilization_law_desc:0 "Sustained war requires production capacity as well as emergency orders. Extend the mobilization framework to authorize paid industrial expansion and maintain public support for the effort."
 EOR_bring_the_zaibatsus_into_the_fold:0 "The Imperial Arsenal"
 EOR_bring_the_zaibatsus_into_the_fold_desc:0 "Central planning must extend from legal authority to the operation of the combines. Complete their integration into the state-directed economy before introducing national mobilization measures."
 EOR_build_our_overseas_territories:0 "Imperial Overseas Territories"
 EOR_build_our_overseas_territories_desc:0 "The Empire's overseas commitments need more than garrisons and declarations. Begin a common administrative and development program for the territories and dependencies that support its regional position."
 EOR_imperial_logistics_network:0 "Imperial Logistics Network"
 EOR_imperial_logistics_network_desc:0 "Either administrative settlement depends on reliable movement between its members. Build a common logistics network after consolidating centralized integration or regional cooperation."
 EOR_resource_security_program:0 "Imperial Resource Dependency"
 EOR_resource_security_program_desc:0 "Factories cannot meet their targets if fuel and raw materials remain uncertain. Establish a resource-security program and choose whether self-sufficiency, overseas extraction or open commerce will sustain industry."
 EOR_develop_oceanic_territories:0 "Develop the Imperial Oceanic Territories"
 EOR_develop_oceanic_territories_desc:0 "The Oceanic Territories need ports, industry and services connected to the regional logistics system. Authorize targeted investments that require the local government's continued subject relationship and control of its capital."
 EOR_the_technological_co-development_initiative:0 "Technological Co-Development Initiative"
 EOR_the_technological_co-development_initiative_desc:0 "Infrastructure and joint development make a shared research program practical. Extend technical cooperation with participating dependencies while allowing its benefits to end when the relationship changes."
 EOR_tennoheika_banzai:0 "Imperial Centralization"
 EOR_tennoheika_banzai_desc:0 "The centralized sphere will be held together by loyalty to the throne. Commit to stronger Imperial authority, accepting the administrative pressure created by deeper extraction and control."
 EOR_reform_coprosperity_sphere:0 "Imperial Partnership"
 EOR_reform_coprosperity_sphere_desc:0 "The sphere can endure through cooperation rather than unconditional obedience. Choose a partnership policy that increases autonomy and accepts limits on immediate Imperial extraction."
 EOR_nanocore_state:0 "Construction Nanocores"
 EOR_forward_mecha_state:0 "Forward Mecha Bay"
 EOR_reconstruction_state:0 "Emergency Nanocore Reconstruction"
 EOR_omega_assault_state:0 "Yuriko: Psionic Assault"
 EOR_hawaii_defense:0 "Pearl Harbor Emergency Defense"
 EOR_capital_defense:0 "Defend the Imperial Capital"
 EOR_soviet_planning:0 "Soviet Campaign Preparations"
 EOR_soviet_offensive:0 "Moscow Offensive"
 EOR_subject_centralized_state:0 "Centralized Imperial Administration"
 EOR_nanocore_construction:0 "Construction Nanocores"
 EOR_omega_assault:0 "Yuriko: Psionic Assault"
 eor.1.t:0 "The Imperial Dawn"
 eor.1.d:0 "Suki reports that the Empire’s forces and advanced industries are ready, but their raw-material supply depends on a fragile overseas system. Yoshiro sees a sacred mission; Tatsu asks whether the institutions can sustain it. This campaign begins in the mod’s alternate 2008, drawing on RA3’s altered timeline. Campaign revelations and original political developments occur through play; no single RA3 ending is assumed."
 eor.1.a:0 "The Rising Sun Shall Illuminate the World"
 eor.2.t:0 "The Emperor's Address"
 eor.2.d:0 "Emperor Yoshiro has addressed the nation, declaring that the Empire's rise represents the fulfillment of its divine destiny.\n\nAcross Japan, citizens gather to celebrate the achievements of the Imperial Armed Forces and express their loyalty to the throne."
 eor.2.a:0 "Tenno Heika Banzai"
 eor.3.t:0 "The Crown Prince's Proposal"
 eor.3.d:0 "Crown Prince Tatsu has presented the Imperial Court with an ambitious program of military modernization.\n\nHis proposal emphasizes robotics, advanced manufacturing, and scientific research.\n\nAlthough the Emperor supports technological progress, several traditionalist officials have expressed concern over the Crown Prince's growing influence."
 eor.3.a:0 "Support the Crown Prince"
 eor.3.b:0 "Preserve the Existing Military Hierarchy"
 eor.4.t:0 "Council of Shoguns"
 eor.4.d:0 "Shinzo demands one timetable for the coming campaigns. Naomi insists that fuel, escorts and forward bases come before another promise of a decisive battle; Kenji argues that concentrated modern forces can create their own opening. The council must choose which preparations receive priority."
 eor.4.a:0 "Prioritize Continental Warfare"
 eor.4.b:0 "Prioritize Naval Supremacy"
 eor.4.c:0 "Maintain a Combined-Service Reserve"
 eor.10.t:0 "The Northern Offensive"
 eor.10.d:0 "Shinzo presents two operational timetables. Immediate readiness supports the northern campaign now and raises world tension. A deliberate 90-day preparation delays our authored northern war authorization, then delivers service experience, offensive preparations and stronger Soviet planning support. Neither choice declares war automatically."
 eor.10.a:0 "Authorize Immediate Northern Readiness"
 eor.10.b:0 "Prepare a Stronger Northern Plan over 90 Days"
 eor.11.t:0 "The Fall of Vladivostok"
 eor.11.d:0 "Vladivostok has fallen before the Imperial Armed Forces.\n\nThe capture of the Soviet Union's principal Pacific naval base represents a major strategic victory.\n\nImperial naval engineers have already begun preparing the port for military operations."
 eor.11.a:0 "A Glorious Victory"
 eor.12.t:0 "The Battle for Stalingrad"
 eor.12.d:0 "Shinzo reports that the northern operation has reached Vorkuta. Yoshiro wants its symbolic significance proclaimed; the staff must decide whether to turn that success into public confidence or prepare the next assault on Soviet command."
 eor.12.a:0 "The Emperor's Will Is Absolute"
 eor.12.b:0 "Exploit Our Strategic Advantage"
 eor.13.t:0 "The Shogun Executioner"
 eor.13.d:0 "Kenji presents the Executioner prototype as the answer to fortified positions. Naomi asks how it will reach the theater and who will supply it. Authorizing the program permits costly preparation; further development improves reliability, while cancellation redirects support to ordinary robotic production."
 eor.13.a:0 "Deploy the Executioner Immediately"
 eor.13.b:0 "Continue Development"
 eor.13.c:0 "Redirect the Resources"
 eor.14.t:0 "The Fall of Moscow"
 eor.14.d:0 "The Imperial Armed Forces have captured Moscow.\n\nThe Soviet capital, once the center of a global revolutionary movement, now lies under Imperial occupation.\n\nAcross the Empire, celebrations mark what may be the greatest military victory in modern Japanese history.\n\nYet the remaining Soviet forces continue to resist, and the Allied Nations are watching developments with growing concern."
 eor.14.a:0 "The Soviet Empire Is Broken"
 eor.20.t:0 "The Attack on Pearl Harbor"
 eor.20.d:0 "Naomi reports an enemy foothold in Hawaii while Imperial forces still hold part of the state. The fleet can reinforce the defense or preserve its surviving strength. Neither choice claims the island is already secure."
 eor.20.a:0 "Hold Pearl Harbor at All Costs"
 eor.20.b:0 "Preserve the Fleet"
 eor.21.t:0 "The Black Tortoise Project"
 eor.21.d:0 "Naomi asks whether the Black Tortoise’s extended naval support justifies its industrial reservation. Kenji argues that the design is ready; she insists that fuel and escorts must be available too. The council can authorize preparation now or first support conventional fleet expansion for one hundred and eighty days."
 eor.21.a:0 "Construct the Fortress"
 eor.21.b:0 "Expand the Conventional Fleet"
 eor.22.t:0 "Operation Santa Monica"
 eor.22.d:0 "Shinzo presents the Santa Monica landing plan. Naomi asks whether the fleet can sustain it after the first wave. Immediate authorization prepares landing support; postponement funds broader offensive preparations and delays the war order."
 eor.22.a:0 "Begin the Landing"
 eor.22.b:0 "Await Reinforcements"
 eor.23.t:0 "The Defeat of the Allied Nations"
 eor.23.d:0 "The Allied Nations have suffered a catastrophic military defeat.\n\nTheir principal military forces have been overwhelmed, and the Empire now controls strategic territories once considered beyond its reach.\n\nThe Emperor has declared that the Rising Sun has entered a new age of greatness.\n\nNevertheless, the future of the world remains uncertain."
 eor.23.a:0 "Glory to the Empire"
 eor.30.t:0 "An Alliance of Necessity"
 eor.30.d:0 "Suki reports that Soviet and Allied representatives are considering cooperation against Imperial expansion. Yoshiro urges a demonstration of resolve, while the staff asks whether diplomacy or defensive preparation will buy more time. The rivals still decide their own response."
 eor.30.a:0 "Warn the Imperial War Council"
 eor.31.t:0 "The Siege of Yokohama"
 eor.31.d:0 "Suki reports hostile control in the capital region. Shinzo demands emergency defense; the administration warns that ministries may need to move. The council must choose whether to concentrate on the threatened center or authorize relocation to a controlled Imperial core."
 eor.31.a:0 "Defend the Imperial Capital"
 eor.31.b:0 "Preserve the Imperial Government"
 eor.40.t:0 "The Truth Behind Our Existence"
 eor.40.d:0 "Suki presents verified evidence that Soviet time travel altered history. The surviving records do not establish every detail. Yoshiro defends his sacred mission; Tatsu argues that an Empire made possible by human intervention must command its own future."
 eor.40.a:0 "Reject the Soviet claims"
 eor.40.b:0 "Accept the evidence"
 eor.40.c:0 "Conceal the truth"
 eor.41.t:0 "The Imperial Court Divided"
 eor.41.d:0 "Suki lays the competing claims before the court. Yoshiro defends the sacred mission, Tatsu demands authority for technical administration and Shinzo seeks a stronger chain of command. The crisis has made a government settlement unavoidable."
 eor.41.a:0 "Support the Emperor"
 eor.41.b:0 "Support the Crown Prince"
 eor.41.c:0 "Strengthen the military establishment"
 eor.42.t:0 "Tatsu Assumes Command"
 eor.42.d:0 "Tatsu takes executive responsibility for the Empire’s government and armed forces. He promises an Imperial strategy built on technical coercion and disciplined procurement. Suki warns that Yoshiro’s ceremonial role or abdication must still be settled with the court."
 eor.42.a:0 "Government must serve the future"
 eor.50.t:0 "The Imperial Conference"
 eor.50.d:0 "The administration asks which approach should guide its preparations: centralized extraction or cooperative development. This recommendation does not enact either policy immediately. Adopting the matching policy later returns 25 political power through the work already prepared."
 eor.50.a:0 "Strengthen Imperial Administration"
 eor.50.b:0 "Promote Economic Cooperation"
 eor.51.t:0 "Demands from the Overseas Territories"
 eor.51.d:0 "Suki presents demands from [event_target:EOR_unrest_subject.GetName]. The council can assert control, negotiate concessions or fund local development. Administrative pressure and earned monthly relief are visible in overseas decisions; unresolved demands can later escalate into unrest."
 eor.51.a:0 "The Emperor's Authority Is Absolute"
 eor.51.b:0 "Offer Limited Concessions"
 eor.51.c:0 "Invest in Local Development"
 eor.52.t:0 "Imperial Territorial Unrest"
 eor.52.d:0 "Shinzo reports unrest in [event_target:EOR_unrest_subject.GetName] after earlier demands went unresolved. Security forces consume equipment and leave resentment; concessions or investment reduce pressure by different amounts. Durable administrative settlements can ease the recurring burden."
 eor.52.a:0 "Deploy Imperial Security Forces"
 eor.52.b:0 "Negotiate with Local Authorities"
 eor.52.c:0 "Implement Emergency Economic Measures"
 eor.60.t:0 "The Government Settlement"
 eor.60.d:0 "Suki reports that the governing institutions have agreed their responsibilities. The court, technical ministries or military command can now pursue the retained government’s continuing policy program. This is an internal political milestone; wars and international outcomes continue under the ordinary rules."
 eor.60.a:0 "Confirm Yoshiro’s court settlement"
 eor.60.b:0 "Establish Tatsu’s technical administration"
 eor.60.c:0 "Consolidate Shinzo’s governing command"
 eor.70.t:0 "The Collapse of the Shogunate"
 eor.70.d:0 "Suki reports that defeat has broken ordinary coordination. Shinzo argues for continued resistance; administrators ask for a reconstruction mandate. Both approaches require later action and neither creates a separate way to win the game."
 eor.70.a:0 "The Empire Has Fallen"
 eor.70.b:0 "The Rising Sun Shall Return"
 eor.80.t:0 "Project Omega"
 eor.80.d:0 "Kenji reports that Project Omega can now support prepared missions through Yuriko. Shinzo demands one accountable command and a separate briefing for each assignment. Only one mission can proceed at a time; the shared cooldown covers all four uses."
 eor.80.a:0 "Authorize specialized operations"
 eor.32.t:0 "An Alliance of Necessity"
 eor.32.d:0 "The Empire threatens both the Allied Nations and the Soviet Union. Shall we propose military coordination?"
 eor.32.a:0 "Propose a military coalition"
 eor.32.b:0 "Offer limited cooperation"
 eor.32.c:0 "Break off negotiations"
 eor.33.t:0 "The Allied Coalition Proposal"
 eor.33.d:0 "The Allied Nations propose military coordination against the Empire. Our existing political alliances will remain intact."
 eor.33.a:0 "Coordinate the war effort"
 eor.33.b:0 "Limit cooperation to logistics"
 eor.33.c:0 "Reject the proposal"
 eor.34.t:0 "Limited Allied Cooperation"
 eor.34.d:0 "The Allies offer logistical and intelligence cooperation against the Empire."
 eor.34.a:0 "Accept limited cooperation"
 eor.34.b:0 "Reject the offer"
 EOR_imperial_administration:0 "Imperial Administration"
 EOR_imperial_administration_desc:0 "Overseas policy must have a clear institutional foundation. Review the administration before choosing direct Imperial control or a more autonomous cooperative settlement."
 EOR_research_investment:0 "Imperial Research Investment"
 EOR_subject_negotiation:0 "Imperial Negotiation"
 EOR_deploy_construction_nanocores:0 "Deploy Construction Nanocores"
 EOR_deploy_construction_nanocores_desc:0 "Pay 50 political power and reserve 3 civilian factories for 90 days. Nanocores improve construction in the selected state by 20%. Requires Nanocore research. Cooldown: 180 days."
 EOR_forward_mecha_bay:0 "Establish a Forward Mecha Bay"
 EOR_forward_mecha_bay_desc:0 "Invest 75 PP, 100 support equipment and 3 civilian factories for 90 days. Construct a military factory and add local supplies for 180 days in the selected controlled state. Cooldown: 180 days."
 EOR_mobile_naval_facilities:0 "Deploy Mobile Naval Facilities"
 EOR_mobile_naval_facilities_desc:0 "Reserve 3 civilian factories for 90 days to accelerate naval-base construction by 30% in a controlled coastal state. Cooldown: 180 days."
 EOR_emergency_reconstruction:0 "Emergency Nanocore Reconstruction"
 EOR_emergency_reconstruction_desc:0 "Pay 35 PP and 100 support equipment; reserve 3 civilian factories for 60 days. Repair infrastructure and factories 50% faster in the selected state. Cooldown: 120 days."
 EOR_imperial_administration_review:0 "Review Imperial Administration"
 EOR_imperial_administration_review_desc:0 "Spend 50 PP to stabilize the Mandate by 5 and ease overseas pressure by 10. Cooldown: 180 days."
 EOR_war_council_planning:0 "Convene the Imperial War Council"
 EOR_war_council_planning_desc:0 "Spend 50 PP for 90 days of improved planning and supply coordination. Cooldown: 180 days."
 EOR_technological_administration:0 "Coordinate Technological Ministries"
 EOR_technological_administration_desc:0 "Spend 75 PP and reserve 3 civilian factories for 90 days to gain 180 days of +3% research speed."
 EOR_investigate_soviet_research:0 "Investigate Soviet Temporal Research"
 EOR_investigate_soviet_research_desc:0 "An intelligence route to the truth: invest 100 PP and 3 civilian factories for 180 days after establishing the Weaponry Institute. The resulting intelligence unlocks the ideological crisis once the Crown Prince is established."
 EOR_begin_northern_war:0 "Authorize the Northern War"
 EOR_begin_northern_war_desc:0 "Declare war on the Soviet Union using the completed war preparations. The AI requires favorable estimated army strength and no existing war."
 EOR_prepare_soviet_offensive:0 "Prepare a Soviet Offensive"
 EOR_prepare_soviet_offensive_desc:0 "Spend 50 PP for 90 days of attack and planning support against the Soviet Union."
 EOR_begin_pacific_war:0 "Authorize the Pacific War"
 EOR_begin_pacific_war_desc:0 "Declare war on the USA. The AI requires favorable estimated strength and no existing war. This does not automatically declare war on the Soviet Union."
 EOR_pacific_operations:0 "Pacific Fleet Operations"
 EOR_pacific_operations_desc:0 "Spend 50 PP and 50 fuel to gain 90 days of convoy and invasion support. Cooldown: 180 days."
 EOR_mainland_invasion:0 "Prepare Mainland Landing Support"
 EOR_mainland_invasion_desc:0 "Spend 75 PP for 90 days of amphibious and logistical support. Cooldown: 180 days."
 EOR_global_strategy:0 "Review Global Strategy"
 EOR_global_strategy_desc:0 "Spend 50 PP for 20 army experience and 90 days of planning support."
 EOR_anti_coalition_readiness:0 "Prepare Homeland Reserves"
 EOR_anti_coalition_readiness_desc:0 "Spend 75 PP for 90 days of homeland defense and mobilization support."
 EOR_defend_pearl_harbor:0 "Reinforce Pearl Harbor"
 EOR_defend_pearl_harbor_desc:0 "Spend 50 PP and 2500 manpower to improve Hawaiian defense for 90 days."
 EOR_rebuild_vladivostok:0 "Reconstruct Vladivostok Port"
 EOR_rebuild_vladivostok_desc:0 "Reserve 3 civilian factories for 90 days to improve local naval-base repair by 50% for 180 days."
 EOR_procure_king_oni:0 "Procure King Oni"
 EOR_procure_king_oni_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days to deliver 30 equipment. Cooldown: 180 days."
 EOR_procure_infantry:0 "Procure Imperial Infantry"
 EOR_procure_infantry_desc:0 "Spend 75 PP and reserve 3 civilian factories for 120 days to deliver 600 equipment. Cooldown: 180 days."
 EOR_shogun_construction_program:0 "Fund Shogun Shipbuilding"
 EOR_shogun_construction_program_desc:0 "Invest 100 PP and reserve 3 civilian factories for 180 days for 180 days of increased dockyard output. Ships still require normal construction and resources."
 EOR_mobilize_imperial_workforce:0 "Mobilize the Imperial Workforce"
 EOR_mobilize_imperial_workforce_desc:0 "Spend 50 PP and 2% stability for a 180-day factory output mobilization."
 EOR_expanded_economic_mobilization:0 "Expand Wartime Industry"
 EOR_expanded_economic_mobilization_desc:0 "Invest 75 PP and reserve 3 civilian factories for 180 days to add one military factory in the capital."
 EOR_develop_mal_resources:0 "Develop Malayan Resources"
 EOR_develop_mal_resources_desc:0 "Invest 75 PP and 3 civilian factories for 180 days. A current Imperial subject receives 8 resources in a controlled state. Dependency relief requires both Malayan and Indonesian projects while both remain subjects."
 EOR_develop_ins_resources:0 "Develop Indonesian Resources"
 EOR_develop_ins_resources_desc:0 "Invest 75 PP and 3 civilian factories for 180 days. A current Imperial subject receives 8 resources in a controlled state. Dependency relief requires both Malayan and Indonesian projects while both remain subjects."
 EOR_overseas_infrastructure:0 "Invest in Overseas Infrastructure"
 EOR_overseas_infrastructure_desc:0 "Invest 50 PP and 3 civilian factories for 90 days. A selected current Imperial subject state gains infrastructure and the subject gains 3% stability."
 EOR_overseas_ports:0 "Invest in Overseas Naval Industry"
 EOR_overseas_ports_desc:0 "Invest 75 PP and 3 civilian factories for 120 days to construct a dockyard in a selected coastal subject state."
 EOR_overseas_mobilization:0 "Coordinate Subject Mobilization"
 EOR_overseas_mobilization_desc:0 "Spend 50 PP to raise war support by 5% in current subjects and gain 10 army experience."
 EOR_centralization_administration:0 "Fund Centralized Administration"
 EOR_centralization_administration_desc:0 "Spend 75 PP to reduce overseas pressure by 20. The first administrative settlement adds two points of monthly administrative relief; centralization and partnership share that one-time award."
 EOR_partnership_investment:0 "Fund Imperial Partnership"
 EOR_partnership_investment_desc:0 "Invest 75 PP and 3 civilian factories for 120 days to improve current subject stability by 3% and support scientific cooperation. The first administrative settlement adds two points of monthly administrative relief; centralization and partnership share that one-time award."
 EOR_build_executioner:0 "Prepare the Shogun Executioner"
 EOR_build_executioner_desc:0 "Spend 150 PP, reserve 8 civilian factories and accept a 10% factory-output penalty for 180 days. Completion releases the queue and leaves the asset ready without upkeep. Activate it separately during war for 60 days; recovery then lasts 365 days. Preparation costs are sunk. This is a national operation, not a map unit."
 EOR_build_giga_fortress:0 "Prepare the Giga Fortress"
 EOR_build_giga_fortress_desc:0 "Spend 200 PP, reserve 8 civilian factories and accept a 10% factory-output penalty for 240 days. Completion releases the queue and leaves the asset ready without upkeep. Activate it separately during war for 90 days; recovery then lasts 540 days. Preparation costs are sunk. This is a national operation, not a map unit."
 EOR_build_black_tortoise:0 "Prepare the Black Tortoise"
 EOR_build_black_tortoise_desc:0 "Spend 150 PP, reserve 8 civilian factories and accept a 10% factory-output penalty for 180 days. Completion releases the queue and leaves the asset ready without upkeep. Activate it separately during war for 180 days; recovery then lasts 365 days. Preparation costs are sunk. This is a national operation, not a map unit."
 EOR_omega_assault_desc:0 "Invest 100 PP to prepare Yuriko for 30 days. Gain 30 days of +10% breakthrough against the selected enemy and local organization recovery in its selected occupied state. All Yuriko operations share a 180-day cooldown. Eligibility is checked again after preparation; invalidation gives no reward or refund and retains the shared cooldown."
 EOR_omega_command_disruption:0 "Yuriko: Disrupt Enemy Command"
 EOR_omega_command_disruption_desc:0 "Invest 100 PP and 30 days preparation. The selected current enemy receives -10% planning speed and -5% organization for 30 days. Shared 180-day cooldown. Eligibility is checked again after preparation; invalidation gives no reward or refund and retains the shared cooldown."
 EOR_omega_sabotage:0 "Yuriko: Strategic Sabotage"
 EOR_omega_sabotage_desc:0 "Invest 75 PP and prepare for 30 days to damage two military-factory levels and disrupt local resources and factory security for 60 days in a selected enemy state. Shared 180-day Yuriko cooldown. Enemy control and military industry are rechecked at completion; invalidation gives no reward or refund."
 EOR_emergency_relocation:0 "Relocate the Imperial Government"
 EOR_emergency_relocation_desc:0 "Spend 75 PP to move government to a controlled Japanese core state and support continuity for 180 days."
 EOR_emergency_homeland_mobilization:0 "Emergency Homeland Mobilization"
 EOR_emergency_homeland_mobilization_desc:0 "Spend 75 PP and 3% stability for 90 days of defense and mobilization support."
 EOR_postwar_imperial:0 "Fund Homeland Resilience"
 EOR_postwar_imperial_desc:0 "Spend 75 PP and reserve 3 civilian factories for 180 days. Under Yoshiro, add one civilian factory and 180 days of repair support to a selected owned, controlled core state, plus 3 percentage points of stability. Annual authorization cooldown. Lost state eligibility or a government change invalidates delivery without refund."
 EOR_post_defeat_reconstruction:0 "Begin Imperial Reconstruction"
 EOR_post_defeat_reconstruction_desc:0 "Invest 50 PP and 3 civilian factories for 180 days to remove collapse penalties and recover 5% stability."
 EOR_imperial_resistance_preparation:0 "Organize Imperial Resistance"
 EOR_imperial_resistance_preparation_desc:0 "Spend 75 PP for 90 days of homeland defense preparation. This supports resistance and does not spawn a new country or army."
 EOR_mobile_naval_state:0 "Mobile Naval Facilities"
 EOR_port_repair:0 "Port Reconstruction"
 EOR_yoshiro:0 "Emperor Yoshiro"
 EOR_tatsu:0 "Crown Prince Tatsu"
 EOR_divine_ruler:0 "Divine Emperor"
 EOR_traditionalist:0 "Traditionalist"
 EOR_technocratic_leader:0 "Technocratic Reformer"
 EOR_yoshiro_desc:0 "Emperor Yoshiro is the supreme ruler of the Empire of the Rising Sun and the central figure of its political ideology.\n\nHe believes that Japan's rise to global power represents the fulfillment of a divine destiny. Under his rule, the Empire has developed into a technologically advanced military power capable of challenging both the Soviet Union and Allied Nations.\n\nAlthough Yoshiro possesses considerable political authority, his belief in destiny can influence his strategic judgment. He places great importance on symbolic victories and demonstrations of Imperial superiority.\n\nThe revelation that Soviet scientists altered history threatens the philosophical foundations of his rule. "
 EOR_tatsu_desc:0 "Crown Prince Tatsu is the son of Emperor Yoshiro and one of the Empire's most influential military leaders.\n\nUnlike his father, Tatsu places his confidence in science, engineering, and technological progress.\n\nHe advocates military modernization and prefers strategically decisive operations over symbolic demonstrations of power.\n\nHis scientific outlook increasingly brings him into conflict with the traditionalists of the Imperial Court.\n\nWhen evidence emerges that history has been manipulated through Soviet time travel, Tatsu becomes the central advocate for reforming the Empire's political and military institutions. "
 EOR_nanocores:0 "Nanocore Construction"
 EOR_nanocores_desc:0 "Nanocores permit paid, temporary state construction projects."
 EOR_nanotech_integration:0 "Nanotech Integration"
 EOR_nanotech_integration_desc:0 "The Mainframe integrates advanced manufacturing and unlocks experimental projects."
 EOR_transformable_airframes:0 "Transformable Airframes"
 EOR_transformable_airframes_desc:0 "Transforming systems are represented by dedicated aircraft and operational doctrines in HOI4."
 EOR_mecha_tengu:0 "Mecha Tengu"
 EOR_mecha_tengu_desc:0 "An advanced dedicated fighter supported by transformable-unit doctrine."
 EOR_mecha_tengu_equipment:0 "Mecha Tengu"
 EOR_mecha_tengu_equipment_short:0 "Mecha Tengu"
 EOR_mecha_tengu_equipment_desc:0 "A dedicated land-based fighter. Fleet coordination does not permit carrier embarkation or transformation into a land unit."
 EOR_striker_vx:0 "Striker-VX"
 EOR_striker_vx_desc:0 "A dedicated close-air-support aircraft with advanced defensive systems."
 EOR_striker_vx_equipment:0 "Striker-VX"
 EOR_striker_vx_equipment_short:0 "Striker-VX"
 EOR_striker_vx_equipment_desc:0 "A dedicated close-air-support aircraft with advanced defensive systems."
 EOR_kurikara_robotics_unlock_tt:0 "Kurikara Robotics is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_tenzai_robotics_unlock_tt:0 "Tenzai Robotics is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_kanegawa_industries_unlock_tt:0 "Kanegawa Industries is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_shirada_shipworks_unlock_tt:0 "Shirada Shipworks is available as a military manufacturer. Production equipment unlocks through its corresponding development focus."
 EOR_WAR_OF_THE_THREE_POWERS_DESC:0 "Emperor Yoshiro's technological empire prepares to challenge the Soviets and Allied Nations. Advanced robotics and a powerful navy promise victory, but resources, overseas unrest and rival political factions threaten its ambitions. Preserve divine Imperial rule, support Tatsu's technocrats, or back Shinzo's military government while choosing the Empire's doctrines, economic strategy and place in Asia."
 EOR_kenji_tenzai_desc:0 "Kenji Tenzai is an Imperial commander associated with the Empire's advanced military operations.\n\nHe specializes in mechanized warfare and the deployment of sophisticated combat equipment.\n\nHis tactical approach emphasizes speed, concentrated firepower, and the exploitation of technological advantages."
 EOR_shinzo_nagama_desc:0 "Shinzo Nagama is an experienced Imperial commander specializing in amphibious operations and the coordination of infantry formations.\n\nHis expertise makes him particularly valuable during the Empire's campaigns against coastal territories and strategically important islands."
 EOR_naomi_shirada_desc:0 "Naomi Shirada is one of the Empire's most capable naval commanders.\n\nShe combines aggressive naval tactics with extensive knowledge of modern naval engineering and advanced fleet operations.\n\nHer leadership is particularly valuable during large-scale naval confrontations and operations involving the Empire's advanced capital ships."
 EOR_american_offensive:0 "American Mainland Offensive"
 EOR_the_imperial_dawn_decisions_tt:0 "Unlocks decisions: Begin Imperial Reconstruction, Organize Imperial Resistance."
 EOR_the_imperial_court_decisions_tt:0 "Unlocks decisions: Review Imperial Administration, Relocate the Imperial Government, Emergency Homeland Mobilization."
 EOR_council_of_shoguns_decisions_tt:0 "Unlocks decisions: Convene the Imperial War Council."
 EOR_the_scientific_shogunate_decisions_tt:0 "Unlocks decisions: Coordinate Technological Ministries."
 EOR_northern_war_plan_decisions_tt:0 "Unlocks decisions: Prepare a Soviet Offensive."
 EOR_strike_vladivostok_decisions_tt:0 "Unlocks decisions: Authorize the Northern War, Reconstruct Vladivostok Port."
 EOR_pacific_war_plan_decisions_tt:0 "Unlocks decisions: Authorize the Pacific War."
 EOR_fortify_pearl_harbor_decisions_tt:0 "Unlocks decisions: Reinforce Pearl Harbor."
 EOR_black_tortoise_fortress_decisions_tt:0 "Unlocks decisions: Construct the Black Tortoise."
 EOR_secure_the_pacific_decisions_tt:0 "Unlocks decisions: Pacific Fleet Operations."
 EOR_operation_santa_monica_decisions_tt:0 "Unlocks decisions: Prepare the American Landing."
 EOR_imperial_strategic_reassessment_decisions_tt:0 "Unlocks decisions: Review Global Strategy."
 EOR_prepare_for_coalition_decisions_tt:0 "Unlocks decisions: Prepare Homeland Reserves."
 EOR_the_supreme_shogunate_decisions_tt:0 "Unlocks decisions: Postwar Imperial Administration, Postwar Scientific Development, Postwar Imperial Cooperation."
 EOR_funding_imperial_weaponry_institute_decisions_tt:0 "Unlocks decisions: Investigate Soviet Temporal Research, Imperial Warrior Equipment, Tsunami Tank Equipment."
 EOR_deploy_king_oni_decisions_tt:0 "Unlocks decisions: Procure King Oni."
 EOR_shogun_executioner_program_decisions_tt:0 "Begins Executioner prototype development. Operational authorization is followed by paid industrial preparation and separate wartime activation."
 EOR_shogun_battleship_program_decisions_tt:0 "Unlocks decisions: Fund Shogun Shipbuilding."
 EOR_giga_fortress_project_decisions_tt:0 "Begins Giga Fortress prototype development. Operational authorization is followed by paid industrial preparation and separate wartime activation."
 EOR_the_nano_construction_decisions_tt:0 "Unlocks decisions: Deploy Construction Nanocores, Deploy Mobile Naval Facilities, Emergency Nanocore Reconstruction."
 EOR_establish_nanotech_mainframe_decisions_tt:0 "Opens the three primary experimental programs, forward mecha construction and expensive additional-project exceptions. Primary project focuses provide practical research or service benefits before preparation."
 EOR_project_omega_decisions_tt:0 "Begins Project Omega development. Yuriko mission decisions require the later operational authorization."
 EOR_imperial_wartime_measures_decisions_tt:0 "Unlocks decisions: Mobilize the Imperial Workforce."
 EOR_introduce_the_imperial_mobilization_law_decisions_tt:0 "Unlocks decisions: Coordinate Subject Mobilization."
 EOR_the_first_amendment_of_the_imperial_mobilization_law_decisions_tt:0 "Unlocks decisions: Procure Imperial Infantry."
 EOR_the_second_amendment_of_the_imperial_mobilization_law_decisions_tt:0 "Unlocks decisions: Expand Wartime Industry."
