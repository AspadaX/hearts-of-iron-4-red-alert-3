 EOR_modern_shogunate:0 "The Modern Shogunate"
 EOR_modern_shogunate_desc:0 "The Shogunate shall retain its traditions while incorporating modern administrative principles and advanced military planning."
 EOR_one_empire_one_future:0 "One Empire, One Future"
 EOR_one_empire_one_future_desc:0 "The Empire has overcome its ideological divisions. Under the guidance of Emperor Yoshiro and Crown Prince Tatsu, tradition and technological innovation shall together secure Japan's future."
 EOR_supremacy_of_technology:0 "Supremacy of Technology"
 EOR_supremacy_of_technology_desc:0 "Supremacy of Technology. Initial balance values; campaign balance requires testing."
 EOR_the_nano_construction:0 "Nanoconstruction"
 EOR_the_nano_construction_desc:0 "The institute's research offers new methods for building and repairing infrastructure. Develop nanoconstruction and authorize paid projects that apply it in selected states."
 EOR_the_robotic_production:0 "Robotic Assembly"
 EOR_the_robotic_production_desc:0 "Automation can extend from weapons to the factories that make them. Introduce robotic production methods to improve industrial output and production learning."
 EOR_nanotech_mainframe:0 "Nanotech Mainframe"
 EOR_nanotech_mainframe_desc:0 "Nanotech Mainframe. Initial balance values; campaign balance requires testing."
 EOR_a_highly_mechanized_army:0 "A Highly Mechanized Army"
 EOR_a_highly_mechanized_army_desc:0 "Machines can provide the mobility and protection needed for a decisive campaign. Choose a mechanized doctrine that organizes the army around armored and motorized formations."
 EOR_the_futuristic_bushido:0 "The Futuristic Bushido"
 EOR_the_futuristic_bushido_desc:0 "The modern warrior must combine advanced weapons with disciplined individual service. Choose an infantry-centered doctrine that places elite troops at the heart of the army."
 EOR_landing_combat_scheme:0 "Landing Combat Scheme"
 EOR_landing_combat_scheme_desc:0 "Every army doctrine needs a practical method for crossing defended shores. Develop shared landing procedures and amphibious equipment support as a common branch of army reform."
 EOR_multiple_terrains_combat_support:0 "Multi-Terrain Combat Support"
 EOR_multiple_terrains_combat_support_desc:0 "A force that succeeds on the beach must still operate inland. Extend the common support program to reduce the logistical and environmental burdens of varied terrain."
 EOR_fortified_fleet:0 "The Fortified Fleet"
 EOR_fortified_fleet_desc:0 "Capital ships must remain effective under sustained enemy pressure. Strengthen fleet protection, detection and repair practices before seeking a decisive engagement."
 EOR_imperial_centralization:0 "Imperial Centralization"
 EOR_imperial_centralization_desc:0 "Closer integration increases subject resource and manpower access. Administrative pressure rises monthly; demands and unrest can follow. Occupied non-core territories also face increased resistance."
 EOR_imperial_partnership:0 "Imperial Partnership"
 EOR_imperial_partnership_desc:0 "Autonomy and investment improve cooperation and subject stability while reducing immediate resource extraction. Benefits end when a country ceases to be an Imperial subject."
